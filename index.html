<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Choice of the Dragon: The Hoard Eternal</title>

<!-- PWA essentials -->
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0c0a10">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Dragon Saga">
<meta name="mobile-web-app-capable" content="yes">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="512x512" href="icon-512.png">

<style>
  @import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700;900&family=Spectral:ital,wght@0,400;0,500;0,600;1,400&family=JetBrains+Mono:wght@400;600&display=swap');

  :root{
    --void: #0c0a10;
    --panel: #17121c;
    --panel-hi: #211a29;
    --ember: #c1481f;
    --ember-bright: #e4682f;
    --gold: #c9a227;
    --gold-dim: #7d6a26;
    --parchment: #ece3d3;
    --parchment-dim: #a89e8c;
    --vein: #3a2418;
    --danger: #8f2323;
  }

  *{box-sizing:border-box; -webkit-tap-highlight-color: transparent;}

  html,body{
    margin:0; padding:0; min-height:100%;
    background:
      radial-gradient(ellipse 900px 500px at 50% -10%, rgba(193,72,31,0.12), transparent 60%),
      radial-gradient(ellipse 700px 400px at 90% 100%, rgba(201,162,39,0.06), transparent 60%),
      var(--void);
    color: var(--parchment);
    font-family: 'Spectral', serif;
    line-height:1.65;
  }

  #app{
    max-width: 680px;
    margin: 0 auto;
    padding: 18px 16px 60px;
    min-height:100vh;
  }

  /* Header / Stat bar */
  .hud{
    background: linear-gradient(180deg, var(--panel-hi), var(--panel));
    border: 1px solid #2c2230;
    border-radius: 14px;
    padding: 14px 16px;
    margin-bottom: 22px;
    position: relative;
    overflow:hidden;
  }
  .hud::before{
    content:"";
    position:absolute; inset:0;
    background: repeating-linear-gradient(115deg, transparent 0 18px, rgba(193,72,31,0.035) 18px 19px);
    pointer-events:none;
  }
  .hud-title{
    font-family:'Cinzel', serif;
    font-weight:700;
    letter-spacing:0.06em;
    font-size: 12px;
    color: var(--gold);
    text-transform: uppercase;
    margin-bottom:10px;
    display:flex;
    justify-content:space-between;
    align-items:center;
  }
  .act-tag{
    font-family:'JetBrains Mono', monospace;
    font-size:10px;
    color: var(--parchment-dim);
    letter-spacing:0.04em;
  }
  .stat-grid{
    display:grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px 16px;
    margin-bottom:10px;
  }
  .stat-row{ font-size:12px; }
  .stat-label{
    display:flex; justify-content:space-between;
    font-family:'JetBrains Mono', monospace;
    font-size: 10px;
    color: var(--parchment-dim);
    margin-bottom:4px;
    letter-spacing:0.02em;
  }
  .stat-track{
    height:6px; border-radius:4px;
    background:#241a1f;
    overflow:hidden;
    position:relative;
    border: 1px solid #2c2230;
  }
  .stat-fill{
    height:100%;
    border-radius:4px;
    transition: width 0.5s ease;
  }
  .fill-axis1{ background: linear-gradient(90deg, var(--ember), var(--gold)); }
  .fill-axis2{ background: linear-gradient(90deg, #7d6a26, #8b6fd1); }
  .fill-axis3{ background: linear-gradient(90deg, #5b5560, #4fa5c9); }
  .fill-health{ background: linear-gradient(90deg, #8f2323, #d14a1f); }

  .vitals{
    display:flex; gap: 14px; margin-top: 10px;
    font-family:'JetBrains Mono', monospace;
    font-size: 11px;
    color: var(--parchment-dim);
    flex-wrap:wrap;
  }
  .vitals b{ color: var(--gold); font-weight:600; }

  /* Story panel */
  .scene{
    background: var(--panel);
    border: 1px solid #2c2230;
    border-radius: 14px;
    padding: 22px 20px;
    margin-bottom: 18px;
    position:relative;
  }
  .scene::before{
    content:"";
    position:absolute; left:0; top:14px; bottom:14px; width:3px;
    background: linear-gradient(180deg, var(--ember), transparent);
    border-radius:2px;
  }
  .node-eyebrow{
    font-family:'Cinzel', serif;
    font-size:11px;
    letter-spacing:0.14em;
    text-transform:uppercase;
    color: var(--gold-dim);
    margin-bottom: 6px;
  }
  .node-title{
    font-family:'Cinzel', serif;
    font-weight:700;
    font-size: 22px;
    color: var(--parchment);
    margin: 0 0 14px 0;
    letter-spacing:0.01em;
  }
  .scene-text p{
    margin: 0 0 14px 0;
    font-size: 16.5px;
    color: #d9cfc0;
  }
  .scene-text p:first-letter{
    font-family:'Cinzel', serif;
    font-size: 30px;
    color: var(--ember-bright);
    font-weight:700;
  }
  .flash{
    font-family:'JetBrains Mono', monospace;
    font-size: 11px;
    background: #1e1520;
    border: 1px dashed #3a2a30;
    border-radius: 8px;
    padding: 8px 10px;
    color: var(--gold);
    margin: 4px 0 16px 0;
  }

  /* Choices */
  .choices{ display:flex; flex-direction:column; gap:10px; }
  .choice-btn{
    text-align:left;
    background: linear-gradient(180deg, #1c1520, #150f18);
    border: 1px solid #35272a;
    border-radius: 10px;
    padding: 14px 16px;
    color: var(--parchment);
    font-family:'Spectral', serif;
    font-size: 15px;
    cursor:pointer;
    transition: border-color 0.15s, transform 0.1s, background 0.15s;
    position:relative;
  }
  .choice-btn .choice-label{
    display:block;
    font-weight:600;
    margin-bottom:3px;
  }
  .choice-btn .choice-flavor{
    display:block;
    font-size:12.5px;
    color: var(--parchment-dim);
    font-style:italic;
  }
  .choice-btn:hover, .choice-btn:focus-visible{
    border-color: var(--ember);
    background: linear-gradient(180deg, #241923, #1a1219);
    transform: translateX(2px);
    outline: 2px solid transparent;
  }
  .choice-btn:focus-visible{ outline: 2px solid var(--gold); outline-offset:2px; }
  .choice-btn:active{ transform: translateX(2px) scale(0.99); }

  .footer-controls{
    display:flex; justify-content:center; margin-top: 28px;
  }
  .restart-btn{
    background:none;
    border: 1px solid #3a2a30;
    color: var(--parchment-dim);
    font-family:'JetBrains Mono', monospace;
    font-size: 11px;
    letter-spacing:0.05em;
    padding: 8px 16px;
    border-radius: 20px;
    cursor:pointer;
    text-transform:uppercase;
  }
  .restart-btn:hover{ color: var(--gold); border-color: var(--gold-dim); }

  .continue-btn{
    display:block;
    width:100%;
    text-align:center;
    background: linear-gradient(180deg, var(--ember-bright), var(--ember));
    border: 1px solid #7a2e13;
    border-radius: 10px;
    padding: 15px 16px;
    color: #1a0f08;
    font-family:'Cinzel', serif;
    font-weight:700;
    font-size: 14px;
    letter-spacing:0.04em;
    text-transform:uppercase;
    cursor:pointer;
    transition: filter 0.15s, transform 0.1s;
  }
  .continue-btn:hover{ filter: brightness(1.08); }
  .continue-btn:active{ transform: scale(0.99); }
  .continue-btn:focus-visible{ outline: 2px solid var(--gold); outline-offset:2px; }

  .outcome-tag{
    font-family:'JetBrains Mono', monospace;
    font-size: 10px;
    letter-spacing:0.08em;
    text-transform:uppercase;
    color: var(--parchment-dim);
    background:#1e1520;
    border:1px solid #3a2a30;
    display:inline-block;
    padding:3px 8px;
    border-radius: 5px;
    margin-bottom: 12px;
  }

  /* Naming screen */
  .name-input{
    width:100%;
    background: #150f18;
    border: 1px solid #3a2a30;
    border-radius: 10px;
    padding: 14px 16px;
    color: var(--parchment);
    font-family:'Cinzel', serif;
    font-size: 17px;
    letter-spacing:0.02em;
    margin-bottom: 14px;
  }
  .name-input::placeholder{ color: #5c5460; font-family:'Spectral', serif; font-style:italic; }
  .name-input:focus{ outline: 2px solid var(--gold); outline-offset:1px; border-color: var(--gold-dim); }

  .name-divider{
    display:flex; align-items:center; gap:10px;
    margin: 4px 0 14px;
    font-family:'JetBrains Mono', monospace;
    font-size: 10px;
    letter-spacing:0.08em;
    text-transform:uppercase;
    color: var(--parchment-dim);
  }
  .name-divider::before, .name-divider::after{
    content:""; flex:1; height:1px; background:#2c2230;
  }

  .name-presets{
    display:flex; flex-wrap:wrap; gap:8px;
    margin-bottom: 20px;
  }
  .name-chip{
    background: #1c1520;
    border: 1px solid #35272a;
    border-radius: 20px;
    padding: 8px 14px;
    color: var(--parchment-dim);
    font-family:'Spectral', serif;
    font-size: 13.5px;
    cursor:pointer;
    transition: border-color 0.15s, color 0.15s;
  }
  .name-chip:hover{ border-color: var(--gold-dim); color: var(--parchment); }
  .name-chip.selected{ border-color: var(--gold); color: var(--gold); background: #241c14; }

  .dragon-name-line{
    text-align:center;
    font-family:'Cinzel', serif;
    font-size: 14px;
    letter-spacing:0.1em;
    text-transform:uppercase;
    color: var(--parchment-dim);
    margin-bottom: 2px;
  }

  /* Impact chips — shown on the aftermath screen after a choice */
  .impact-strip{
    display:flex; flex-wrap:wrap; gap:8px;
    margin-bottom: 18px;
  }
  .impact-chip{
    display:inline-flex; align-items:center; gap:6px;
    padding: 6px 12px 6px 8px;
    border-radius: 20px;
    font-family:'JetBrains Mono', monospace;
    font-size: 12px;
    font-weight:600;
    letter-spacing:0.01em;
    border: 1px solid;
    background: #150f18;
  }
  .chip-icon{ font-size: 14px; line-height:1; }
  .chip-brutality{ color:#e4682f; border-color:#5a2c17; background:rgba(193,72,31,0.08); }
  .chip-finesse{   color:#d9bd52; border-color:#5c4c1c; background:rgba(201,162,39,0.08); }
  .chip-honor{     color:#c9b98f; border-color:#4a4536; background:rgba(201,185,143,0.08); }
  .chip-cunning{   color:#a893e0; border-color:#3f3660; background:rgba(139,111,209,0.10); }
  .chip-disdain{   color:#9a94a3; border-color:#3a3640; background:rgba(91,85,96,0.12); }
  .chip-curiosity{ color:#6fc3e8; border-color:#284a58; background:rgba(79,165,201,0.10); }
  .chip-health-up{   color:#e8899c; border-color:#5c2530; background:rgba(209,74,31,0.08); }
  .chip-health-down{ color:#e0596e; border-color:#5c1e26; background:rgba(143,35,35,0.14); }
  .chip-hoard{     color:#e6c65a; border-color:#5c4c1c; background:rgba(201,162,39,0.12); }
  .chip-infamy{    color:#d97f7f; border-color:#4a2424; background:rgba(143,35,35,0.10); }

  .ending-badge{
    font-family:'Cinzel', serif;
    font-weight:900;
    font-size: 26px;
    text-align:center;
    color: var(--gold);
    margin: 6px 0 18px;
    text-shadow: 0 0 24px rgba(201,162,39,0.35);
  }

  @media (max-width: 420px){
    .stat-grid{ grid-template-columns: 1fr; }
    .node-title{ font-size: 19px; }
    .scene-text p{ font-size:15.5px; }
  }

  ::selection{ background: var(--ember); color: var(--void); }
</style>
</head>
<body>
<div id="app"></div>

<script>
/* =========================================================
   CHOICE OF THE DRAGON — THE HOARD ETERNAL
   Full branching narrative engine, single file, no build step.
   ========================================================= */

// Computes a rough "how developed is this dragon" power score for the Vexar
// rematch, factoring in accumulated stat extremity, infamy, wealth, and a
// bonus if the chosen combat style matches the dragon's physical traits
// (chosen way back during character creation).
function vexarPower(state, style){
  let score = Math.abs(state.axis1) + Math.abs(state.axis2) + Math.abs(state.axis3)
    + Math.min(state.infamy, 60) * 0.5
    + Math.min(state.wealth, 150) * 0.1;

  const f = state.flags;
  if(style === 'brutality' && (f.tailType === 'club' || f.hornType === 'ram' || f.skinTexture === 'armored')) score += 22;
  if(style === 'cunning' && (f.tailType === 'venom' || f.hornType === 'none' || f.skinTexture === 'ridged')) score += 22;
  if(style === 'finesse' && (f.tailType === 'whip' || f.hornType === 'spike' || f.skinTexture === 'leathery')) score += 22;

  return score;
}

const STORY = {
  start: "1.1",
  nodes: {

    /* ============ CHAPTER ONE — THE YOUNG ============ */
    "1.1": {
      chapterShort:"Chapter One", chapter:"Chapter One — The Young", part:"Part I",
      title: "The Egg",
      text: [
        "Darkness. Warmth. A slow, ancient heartbeat that is not your own but the mountain's, thrums through the calcified shell that has been your entire world. For centuries beyond counting this egg has lain hidden in the deepest chamber of a forgotten cave system, cradled by veins of geothermal fire that snake through the rock like the vessels of some slumbering titan.",
        "You feel it before you understand it: a pressure building beneath your scales, an instinct older than thought itself, whispering break free. Bones litter the cavern floor beyond your shell — goat, bear, and the rusted husk of a knight's breastplate, half-swallowed by dust. This place has claimed lives before. It has been waiting for you to claim it as your own.",
        "With a final, thunderous crack, the shell splits. Cold cave air rushes against wet scales for the first time. You spill onto the stone floor in a tangle of wing, tail and talon, and roar your first sound into the world. Three glints of possibility shimmer in your newborn mind, as if your very soul is asking what you will become."
      ],
      choices: [
        { label:"Embrace the Fire", flavor:"Scales flush volcanic red. Raw power floods fresh muscle.",
          stats:{axis1:-22}, infamy:4, next:"1.1a",
          outcome:["The transformation completes in a rush of heat and certainty. Your scales harden fast, blackening at each claw-tip like cooling lava, and when you exhale for the first time a thin ribbon of true smoke curls from your nostrils — clumsy, involuntary, but unmistakably yours. The lava vein in the eastern wall seems to brighten in answer, as though the mountain itself recognizes its heir.",
          "You stagger upright on legs still unsure of their own strength, wings unfurling in a trembling stretch that knocks a small avalanche of pebbles loose from the ceiling. Whatever you become from here, the world will feel it before it sees it."] },
        { label:"Embrace the Shadow", flavor:"Scales darken to obsidian. Venom glistens along fang and claw.",
          stats:{axis2:22}, next:"1.1a",
          outcome:["The transformation settles over you like a held breath. Your scales darken to a deep, light-swallowing black, and a faint venomous sheen gathers along your fangs and claw-tips — not yet lethal, but promising to become so. You notice, with a clarity that feels older than your minutes-old body should allow, how little sound you make when you move.",
          "The cave keeps its secrets, and so, you sense, will you. Patience is already beginning to feel less like a virtue and more like a weapon you were born already holding."] },
        { label:"Embrace the Gold", flavor:"Scales shimmer with impossible arcane light.",
          stats:{axis1:22}, next:"1.1a",
          outcome:["Light gathers where no light should exist in a sealed cave, catching along your scales as they shift to a burnished, metallic gold. Something hums faintly beneath your skin — not fire, not venom, but potential, raw and unshaped, the way a held note hums before it becomes music. You flex a claw and feel, distantly, the edges of power you do not yet have words for.",
          "The bones littering the cavern floor no longer look like warnings to you. They look like a syllabus."] },
        { label:"Resist categorization entirely", flavor:"You let instinct remain fluid, and watch the cave instead of yourself.",
          stats:{axis3:22}, next:"1.1a",
          outcome:["You let the moment pass without choosing, and something in the cave itself seems to exhale in response — as if it, too, is relieved not to have you sorted so soon. Your scales settle into a muted, undecided grey, and rather than watching your own body for signs of what you are, you watch the cave: the drip of mineral water, the pulse of distant lava, the old bones arranged like a museum you were never meant to see.",
          "You will decide what you are through action, not instinct. For now, that is enough."] }
      ]
    },


    "1.1a": {
      chapterShort:"Chapter One", chapter:"Chapter One — The Young", part:"Part II",
      title:"A Color to Call Your Own",
      text:[
        "The elemental pull that shaped your instincts a moment ago is still settling into your scales, but the exact shade is still, strangely, yours to decide — the way a held breath before a sneeze is technically still under your control, right up until it isn't. You catch a warped, dim reflection of yourself in a pool of mineral water at the cave's edge, and for the first time, actually look."
      ],
      choices: [
        { label:"Deep crimson red", flavor:"Bold. Unmistakable. The color every old story already expects.",
          stats:{axis1:-4}, next:"1.1b", setFlags:{skinColor:'crimson'},
          outcome:["The red deepens as you watch, settling from something almost pink and embarrassing into a proper, war-banner crimson. It is, you decide, an extremely difficult color to be subtle in. You are apparently fine with that."] },
        { label:"Obsidian black", flavor:"Vanishes into shadow. Unsettling in daylight, worse at night.",
          stats:{axis2:4}, next:"1.1b", setFlags:{skinColor:'obsidian'},
          outcome:["Black, it turns out, is less a color and more an absence — your reflection in the pool seems to swallow the dim cave-light rather than catch it. You find you rather like being difficult to fully see, even to yourself."] },
        { label:"Storm-grey", flavor:"Blends with cloud and stone. Easy to underestimate.",
          stats:{axis3:4}, next:"1.1b", setFlags:{skinColor:'storm-grey'},
          outcome:["The grey settles in mottled, weather-worn patches, closer to a mountainside after rain than to any other dragon you've heard described. It is not a color anyone will write songs about. You suspect that may be precisely its advantage."] },
        { label:"Molten gold-and-bronze", flavor:"Catches the light like the treasure you intend to collect.",
          stats:{axis1:4}, next:"1.1b", setFlags:{skinColor:'gold-bronze'},
          outcome:["The gold catches even the faint cave-light and throws it back doubled, threaded through with veins of deeper bronze along your spine and wing-joints. Subtlety, you decide, watching yourself glow faintly in the dark water, was never really going to be an option anyway."] }
      ]
    },

    "1.1b": {
      chapterShort:"Chapter One", chapter:"Chapter One — The Young", part:"Part III",
      title:"Scales, Ridges, or Something Stranger",
      text:[
        "Color decided, you notice the texture of your own hide for the first time — and find, with some surprise, that this too is still in motion, hardening into its final form the way a scab sets. You flex a foreleg experimentally and feel the answer arrive."
      ],
      choices: [
        { label:"Overlapping armored scales", flavor:"Classic. Dense. Built to take a hit and keep moving.",
          stats:{axis1:-4}, next:"1.1c", setFlags:{skinTexture:'armored'},
          outcome:["Your scales lock into place like the plates of a hauberk forged by something with considerably more patience than any human smith — overlapping, dense, each one individually unremarkable and collectively close to a wall. You suspect you will be very difficult to seriously hurt."] },
        { label:"Ridged, bony plates", flavor:"Defensive. Intimidating. A living fortification.",
          stats:{axis2:-4}, next:"1.1c", setFlags:{skinTexture:'ridged'},
          outcome:["Rather than scales, jagged bone ridges push up along your spine and flanks, less like armor and more like a fortification that happens to also be alive. It is not a subtle silhouette. It is, on the other hand, an extremely good one to be standing behind during an actual fight."] },
        { label:"Smooth, leathery hide", flavor:"Sleek. Aerodynamic. Built for speed over durability.",
          stats:{axis1:4}, next:"1.1c", setFlags:{skinTexture:'leathery'},
          outcome:["Where scales might have hardened, your hide instead smooths into something closer to oiled leather, sleek enough that the cave's updrafts slide across you rather than catching. You will not be the toughest thing in any given room. You will, quite possibly, be the fastest."] },
        { label:"Strange, faintly bioluminescent hide", flavor:"Unusual. Otherworldly. Nobody's quite sure what to make of you.",
          stats:{axis3:4}, next:"1.1c", setFlags:{skinTexture:'strange'},
          outcome:["Faint threads of cold light pulse just beneath your hide, brightening very slightly whenever you're startled or intrigued, an entirely involuntary and mildly inconvenient tell. No elder dragon in living memory looked quite like this. You are, whatever else you become, going to be memorable."] }
      ]
    },

    "1.1c": {
      chapterShort:"Chapter One", chapter:"Chapter One — The Young", part:"Part IV",
      title:"Horns to Wear Like a Crown",
      text:[
        "Two small, tender points above your brow have been aching since the moment you hatched, and as you press a claw gingerly against one, you realize — with the particular clarity of a creature discovering a new part of its own body — that they are still growing, and still, apparently, negotiable."
      ],
      choices: [
        { label:"Curved, ram-like horns", flavor:"Built for headbutting things that deeply deserve it.",
          stats:{axis1:-4}, next:"1.1d", setFlags:{hornType:'ram'},
          outcome:["They curl backward in a heavy, deliberate arc, the kind of horns that exist less to look impressive and more to make a specific, blunt point to anyone foolish enough to get within range of your skull."] },
        { label:"Twin straight spikes", flavor:"Precise. Purpose-built for a single, exact strike.",
          stats:{axis1:4}, next:"1.1d", setFlags:{hornType:'spike'},
          outcome:["They grow straight and needle-sharp, angled slightly forward — not horns built for wrestling, but for one precise, committed strike, the kind you only really get to use once per opponent."] },
        { label:"A branching, antler-like crown", flavor:"Ornate. Impossible to ignore. Faintly ridiculous, faintly regal.",
          stats:{axis3:4}, next:"1.1d", setFlags:{hornType:'crown'},
          outcome:["They branch and fork as they grow, more crown than weapon, catching light and throwing strange shadows across the cave wall. You look, you have to admit, less like a predator and more like a king who simply hasn't found his throne yet."] },
        { label:"No horns at all — a smooth, streamlined skull", flavor:"Nothing to catch. Nothing to grab. Nothing to see coming.",
          stats:{axis2:4}, next:"1.1d", setFlags:{hornType:'none'},
          outcome:["Nothing grows. Your skull stays smooth, unadorned, faintly serpentine — nothing for an enemy's claws to catch, nothing announcing your intentions before you've decided what they are. You find you don't miss what you never had."] }
      ]
    },

    "1.1d": {
      chapterShort:"Chapter One", chapter:"Chapter One — The Young", part:"Part V",
      title:"A Tail That Speaks For Itself",
      text:[
        "Last of all, you become aware of the long, restless weight trailing behind you — still unfamiliar, still knocking the occasional stalagmite loose whenever you turn too quickly. It wants, you sense, to become something specific too."
      ],
      choices: [
        { label:"A heavy, mace-like tail", flavor:"Blunt force, delivered from a distance you don't have to think about.",
          stats:{axis1:-4}, next:"1.1e", setFlags:{tailType:'club'},
          outcome:["The tip thickens and hardens into something between a club and a boulder, heavy enough that a single careless swing sends a chunk of cave wall skittering across the floor. Noted, and filed away for later."] },
        { label:"A whip-thin, impossibly fast tail", flavor:"Speed over weight. A strike you don't see coming until it's landed.",
          stats:{axis1:4}, next:"1.1e", setFlags:{tailType:'whip'},
          outcome:["It thins and lengthens instead, whip-fast, cracking the air with a sound sharper than anything the rest of your still-clumsy body can currently manage. You suspect it will be lethal, once you actually learn to aim it."] },
        { label:"A barbed tail tipped with venom", flavor:"A single graze that does considerably more than a graze should.",
          stats:{axis2:4}, next:"1.1e", setFlags:{tailType:'venom'},
          outcome:["A hooked barb forms at the very tip, and beneath it, a faint sac you can already feel humming with something that is definitely not blood. You do not test it on yourself. You have a strong feeling you won't need to test it on much else, either."] },
        { label:"A broad, fin-like tail built for water and air alike", flavor:"Adaptable. Built for a life that won't stay on one mountain.",
          stats:{axis3:4}, next:"1.1e", setFlags:{tailType:'fin'},
          outcome:["It broadens instead, webbed and fin-edged, equally at home cutting through a headwind or a fast river current. You have no particular plans to spend much time in water. You have a feeling that won't matter."] }
      ]
    },

    "1.1e": {
      chapterShort:"Chapter One", chapter:"Chapter One — The Young", part:"Part VI",
      title:"Blood From the Same Shell",
      text:[
        "You are still admiring the shape you've become when a second shadow falls across the cave mouth — and your stomach drops before your mind catches up to why. The scent is unmistakable, familiar in a way nothing else in your short life has been: the same clutch, the same mother, the same doomed cave. Your egg was not the only one.",
        "He is bigger. Not by a little — by the unmistakable margin of a creature who hatched days before you and has already spent those days eating, testing, growing, while you were still deciding on horns. He looks you over once, with the particular contempt only a sibling can manufacture on short notice, and says, without any real anger, 'So. You're the one still finding your legs.'",
        "His name, you will learn before this is over, is Vexar. This will not be the only time you meet."
      ],
      choices: [
        { label:"Fight him head-on, pride before sense", flavor:"You are young, proud, and catastrophically overmatched.",
          stats:{axis1:-4}, health:-15, next:"1.2", setFlags:{metVexar:true, vexarFirstApproach:'fight'},
          outcome:["You do not think. You simply launch yourself at him, and it goes exactly as poorly as a creature with several days less growth than its opponent should probably expect. He does not even seem to be trying particularly hard, pinning you beneath one claw with the mild, faintly bored expression of an older sibling who has done this exact thing before, to someone else, and found it equally unremarkable.",
          "'Not yet,' he says, releasing you before real damage is done, though the bruises will disagree with that assessment for days. 'Grow first. Then we'll see.' He is gone before you finish coughing the dust out of your lungs."] },
        { label:"Try to outmaneuver him", flavor:"Clever, at least. It still isn't enough.",
          stats:{axis1:2, axis2:2}, health:-12, next:"1.2", setFlags:{metVexar:true, vexarFirstApproach:'outmaneuver'},
          outcome:["You circle, feint, try to use the cave's tight geometry the way you used it against a mountain goat that, in retrospect, was considerably less prepared for the tactic than your brother currently is. He reads every move a half-second before you make it, catching you mid-feint with an ease that stings considerably more than the graze he leaves along your flank.",
          "'Not bad,' he admits, sounding almost surprised. 'Won't save you today. Might, eventually.' He leaves you with that, and with the distinct, uncomfortable sense of having just been evaluated rather than defeated."] },
        { label:"Back down, and survive to grow stronger", flavor:"Swallow the pride. Live to have this fight later, on your terms.",
          stats:{axis3:4}, health:-4, next:"1.2", setFlags:{metVexar:true, vexarFirstApproach:'retreat'},
          outcome:["You do the arithmetic before your pride can object: he is bigger, faster, and considerably more finished than you currently are, and no version of this fight ends with you walking away undamaged. You yield instead, low and unhurried, and he watches you do it with something that might almost be respect, or might just be mild disappointment at being denied an easy win.",
          "'Smart,' he says, already turning to leave. 'Boring. But smart.' You watch him go, and promise yourself, privately, that boring is not going to be a permanent condition."] }
      ]
    },

    "1.2": {
      chapterShort:"Chapter One", chapter:"Chapter One — The Young", part:"Part VII",
      title:"The First Hunt",
      text:[
        "Hunger arrives before wisdom does. Beyond the cave mouth, a jagged crescent of grey daylight, the mountainside stirs: hooved footsteps on loose scree, the bleat of a herd grazing an exposed outcrop. Your stomach, empty since the instant of your birth, clenches sharper than anything you have felt.",
        "A dozen mountain goats pick at scrub grass below. One, old and limping, has drifted from the herd's protective knot. Every fibre of your unformed body screams with a single, simple truth: this is the moment you decide what kind of predator you will be, long before anyone is watching to judge you for it."
      ],
      choices: [
        { label:"Tear it apart without hesitation", flavor:"Charge down the slope, claw and fang, no plan but violence.",
          stats:{axis1:-14}, infamy:6, next:"1.3",
          outcome:["You do not plan the kill so much as become it. The old goat barely has time to lift its head before you are on it, claws first, momentum doing the work your inexperience cannot yet refine. It is over in seconds — brutal, unglamorous, and utterly effective. Hot blood is the first true meal of your life, and it tastes, to your surprise, like victory.",
          "The rest of the herd scatters in a panic that echoes down the valley. Somewhere below, a shepherd boy watching from a distant ridge will spend the rest of his life telling people what he saw that morning, and no one will quite believe him. His grandchildren, decades later, will still be rolling their eyes at 'the dragon story' at every single family gathering, right up until the week your name becomes considerably harder to dismiss."] },
        { label:"Stalk and ambush from downwind", flavor:"Use the rocks for cover, strike once, strike clean.",
          stats:{axis1:14}, next:"1.3",
          outcome:["You circle wide through the scree, keeping low, letting the wind carry your scent away from the herd rather than toward it. When you finally strike, it is a single, economical motion — no wasted movement, no panic, no chase. The old goat is dead before the rest of the herd even registers you were there.",
          "It is, you understand instinctively, a better kill than the alternative would have been: quieter, cleaner, and infinitely more repeatable. Whatever you become, precision will always serve you better than rage."] },
        { label:"Test your fire breath on it", flavor:"Your control is untested — this could go wonderfully or terribly.",
          stats:{axis1:-10}, health:-5, infamy:8, next:"1.3",
          outcome:["You aim your first real breath at the goat and get... something. A cough of grey smoke, a wet crackling heat, and then — briefly, gloriously — a jet of orange flame that catches the goat's flank and sends the whole herd shrieking off the outcrop. Your triumph lasts exactly as long as it takes you to notice your own foreleg is singed where the fire looped back closer than you intended.",
          "The lesson stings, literally. But you have flame now, however unrefined, and that changes everything about what kind of predator you are about to become."] },
        { label:"Watch the herd's patterns first", flavor:"Delay the kill. Learn how prey moves before you decide how you hunt.",
          stats:{axis3:14}, next:"1.3",
          outcome:["You hold back, folding yourself into the shadow of an outcrop, and simply watch. You learn the herd's rhythm within the hour: which goat leads, which trails, where the blind spots in their vigilance lie. When you finally do move, hours later, it is with the calm certainty of something that has already won the encounter before it began.",
          "The kill itself is almost anticlimactic. The real hunt happened in your mind, long before your claws ever touched ground."] }
      ]
    },

    "1.3": {
      chapterShort:"Chapter One", chapter:"Chapter One — The Young", part:"Part VIII",
      title:"The Goblin Warren",
      text:[
        "A half-day's flight from your den, following a ravine you had never bothered to explore, you find smoke rising from somewhere it has no business rising: cookfires, dozens of them, threaded between rough stone huts built into the cliff face. A goblin warren — some hundred and fifty of the small, wiry creatures, by your rough count — has been living in your mountain's shadow this entire time, apparently unnoticed by, or unimportant to, the elder dragon whose territory this used to be.",
        "Your first pass over the ravine sends them into screaming chaos, cookfires kicked out, children snatched indoors. But by your second pass, something stranger happens. A handful of the braver ones creep back into the open, and rather than run, they kneel — foreheads pressed to the dirt, hands raised, in a posture you recognize, with some surprise, as worship. Somewhere in this warren, it becomes clear, dragons are already a religion. You have simply arrived to audition for the part of god."
      ],
      choices: [
        { label:"Accept their worship, and rule as a living god", flavor:"Let devotion become your first true system of tribute.",
          stats:{axis2:16}, infamy:6, wealth:10, next:"1.4a", setFlags:{goblinAllies:'worship'},
          outcome:["You do not correct their theology. You land in the center of the ravine, fold your wings with what you hope reads as divine patience, and let the goblin elders shuffle forward with the first of what will become a very long series of offerings — gold scraped from streambeds, meat from their own dwindling stores, small crude idols carved in your unmistakable likeness. Within a season, a genuine priesthood has organized itself around your infrequent visits.",
          "It is, you reflect, watching a goblin child solemnly leave a chicken bone at your feet like an offering to the sun itself, an absurdly efficient form of taxation. Faith, unlike fear, tends to collect itself."] },
        { label:"Terrorize them into servitude", flavor:"Fear is a simpler contract than faith, and pays in labor.",
          stats:{axis1:-16}, infamy:14, next:"1.4a", setFlags:{goblinAllies:'fear'},
          outcome:["You do not accept worship. You demand it — landing hard enough to crack the ravine's central well, torching two empty huts as a demonstration rather than a punishment, making very sure every goblin watching understands exactly what happens to warrens that displease you. By nightfall their chieftain is at your claws, offering labor rather than prayer: miners, scouts, whatever a creature your size might find use for.",
          "It is not devotion. It is the oldest bargain there is — obedience purchased with the promise of a slightly less terrible alternative — and it will serve your purposes exactly as well as worship would have, for considerably less patience on your part."] },
        { label:"Leave them in peace, and simply observe", flavor:"Not everything needs to be conquered to be understood.",
          stats:{axis3:16}, infamy:-2, next:"1.4a", setFlags:{goblinAllies:'trust'},
          outcome:["You do not land at all, not that first day. You circle once, high enough not to panic them further, and simply watch — their strange, efficient little economy, the way the elders organize the children, the songs they sing to keep the cookfires fed through the mountain's long winters. When you do finally land, weeks later, it is without demands, and the warren's chieftain, more baffled than grateful, offers you something no threat or worship ever could: an honest welcome.",
          "You do not rule them. You do not need to. Something rarer than tribute grows in that ravine instead — the particular, durable trust of creatures who have decided, against every instinct, that you are not going to hurt them."] }
      ]
    },

    "1.4a": {
      chapterShort:"Chapter One", chapter:"Chapter One — The Young", part:"Part IX",
      title:"Words Before Blood",
      text:[
        "Infernus is still talking, in the unhurried way of something that has never once in two centuries had to consider the possibility of being interrupted. There is, you sense, a brief window here — not to change his mind, exactly, but to decide what kind of impression you leave before whatever happens next actually happens."
      ],
      choices: [
        { label:"\"This mountain has a new landlord. Rent is due.\"", flavor:"Cocky. Reckless. Extremely on brand for a three-season-old dragon.",
          stats:{axis1:-6}, next:"1.4",
          outcome:["Infernus stares at you the way a man might stare at a talking sandwich — a long beat of pure bewilderment, followed almost immediately by genuine irritation that the sandwich had the nerve. 'Rent,' he repeats, flatly, smoke curling from both nostrils now. 'From an egg.'",
          "You are fairly sure this went worse for you rhetorically than you intended. It is, at least, memorable."] },
        { label:"\"There's room enough for two dragons on one mountain, surely.\"", flavor:"Reasonable. Diplomatic. Probably doomed.",
          stats:{axis2:-6}, next:"1.4",
          outcome:["'There is not, in fact, room enough,' Infernus says, with the weary patience of someone who has genuinely checked. 'I measured. Twice. Both times the answer involved considerably less of you existing afterward.'",
          "It was worth asking. Diplomacy, you are learning, has a somewhat higher failure rate with elder wyrms than you'd hoped."] },
        { label:"\"You're right, of course. Forgive my trespass, mighty one.\"", flavor:"Fake humility. See how far flattery gets you.",
          stats:{axis2:8}, next:"1.4",
          outcome:["Infernus's chest puffs out with an almost audible creak of satisfaction. 'Well,' he says, visibly recalibrating his entire assessment of you. 'At least one hatchling this century has manners.' You note, with some interest, that flattery apparently works on two-hundred-year-old apex predators exactly the same way it works on toddlers and minor nobility.",
          "This will be useful information going forward."] }
      ]
    },

    "1.4": {
      chapterShort:"Chapter One", chapter:"Chapter One — The Young", part:"Part IX",
      title:"The Rival",
      text:[
        "You are three seasons old and already the mountain knows your name in the language of broken bones and burned scrub, when the sky darkens with a shadow far larger than your own. Infernus descends onto the ridge above your claimed den: an elder wyrm the colour of dried blood, scarred wingtips, eyes like furnace doors. He has smelled a rival, and he has come to end the question of territory before it can properly begin.",
        "'This mountain fed my hatchlings before your egg was ever laid,' he rumbles, smoke curling from a jaw that could take your skull in a single bite. 'Leave, or burn.'",
        "You are not yet a third of his size. But you are not yet without options, either."
      ],
      choices: [
        { label:"Attack him directly, no fear", flavor:"Meet overwhelming force with your own. Reckless, unforgettable.",
          stats:{axis1:-16}, health:-18, infamy:10, next:"2.1",
          outcome:["You do not wait for a better moment because you do not yet know how to recognize one. You launch yourself at Infernus with everything your young body has, and for several long, brutal minutes the ridge becomes a blur of claw, fire and falling stone. He is bigger, older, and far more experienced — and it shows, in the gouges he opens along your flank before you finally manage to sink your teeth into the join of his wing.",
          "It is enough. Bleeding and furious, Infernus breaks off the fight rather than risk a wound that could ground him permanently, and flies east, cursing your name into the wind. You are alone on the mountain, wounded, exhausted, and undeniably, for the first time, its master."] },
        { label:"Lure him into a rockslide trap", flavor:"Use the terrain you already know better than he does.",
          stats:{axis2:16}, next:"2.1",
          outcome:["You lead Infernus on a chase across terrain you know intimately and he does not — up narrow ledges, through a defile you have already marked as unstable. When he finally corners you against what looks like a dead end, you are already gone, and the roof he was standing beneath comes down in a roar of dust and boulders.",
          "He claws free eventually, humiliated and bruised rather than seriously hurt, and decides — loudly, and at length — that this particular mountain is not worth the trouble it is clearly going to keep causing him. He does not return."] },
        { label:"Swear false fealty, and wait", flavor:"Bow your head. Serve him. Learn his weaknesses from within his shadow.",
          stats:{axis2:20}, infamy:-3, next:"2.1",
          outcome:["You bow low, throat exposed in the oldest gesture of submission dragons know, and Infernus accepts your surrender with the lazy satisfaction of a creature who has never once considered that a hatchling might be lying. For a full season you serve him — scouting, fetching, absorbing every habit and blind spot he has never bothered to hide from something he considers beneath notice.",
          "When the moment finally comes — a night he sleeps too deeply after too rich a feast — you do not hesitate. It is not the fight you would have chosen as a hatchling. It is the only fight you were always going to win."] }
      ]
    },

    /* ============ CHAPTER TWO — THE EMPIRE ============ */
    "2.1": {
      chapterShort:"Chapter Two", chapter:"Chapter Two — The Empire", part:"Part I",
      title:"The Perfect Lair",
      text:[
        "Infernus is gone now, by claw or by cunning or by the slow poison of your patience — the mountain no longer questions whose it is. You are grown enough now to think beyond the next meal, toward the shape your reign will take. A dragon is only as powerful as the ground it commands, and three places call to you across these highlands.",
        "There is an abandoned dwarven mine, its vaults still half-stocked with smelted gold, its tunnels defensible by a single narrow gate. There is a bare, wind-scoured peak, visible for a hundred miles, a throne no army could approach unseen. And there is a black limestone labyrinth beneath the earth, a maze even you have not fully mapped, where enemies could wander lost until they starved."
      ],
      choices: [
        { label:"Claim the dwarven mine and its gold", flavor:"Wealth now. Others will hear of it eventually.",
          stats:{}, wealth:40, infamy:5, next:"2.2",
          outcome:["You claim the old dwarven halls as your own, and within days the gold reserves the miners left behind — abandoned in some panic or plague centuries past, by the state of the skeletons still curled around their tools — become the foundation of a hoard that will only ever grow from here. The single narrow gate makes the place absurdly defensible; anything foolish enough to come for your gold will have to come through a corridor built for exactly one dwarf at a time.",
          "It is, you decide, watching gold light flicker off the tunnel walls, an excellent place to become powerful in."] },
        { label:"Claim the unassailable mountain peak", flavor:"A fortress of pure intimidation, seen by every kingdom below.",
          stats:{axis1:10}, infamy:8, next:"2.2",
          outcome:["You claim the bare, wind-scoured summit, and the moment you land atop it you understand why no other creature has bothered to try. There is no cover here, no need for any — the entire point is to be seen, a silhouette against the sky that every farmer, lord and general within a hundred miles will learn to recognize and fear.",
          "Comfort was never the goal. Intimidation, delivered for free simply by existing where you now exist, was."] },
        { label:"Claim the underground labyrinth", flavor:"A lair that rewards patience and punishes pursuit.",
          stats:{axis2:12}, next:"2.2",
          outcome:["You descend into the black limestone maze beneath the mountain and spend the better part of a month simply learning its geometry — which tunnels loop back on themselves, which end in sheer drops, which lead nowhere at all by design or by collapse. By the time you emerge, you know this labyrinth better than any invader ever could, and that asymmetry of knowledge is, you are beginning to understand, its own kind of weapon.",
          "Whatever comes looking for you here will get lost long before it gets close."] }
      ]
    },

    "2.2": {
      chapterShort:"Chapter Two", chapter:"Chapter Two — The Empire", part:"Part II",
      title:"The Trade Road Villages",
      text:[
        "Before you set your sights on anything as large as a walled city, the merchant road beneath your new lair offers something gentler: three unwalled farming hamlets strung along it like beads — Millbrook, Thistlewick, and Ashford Ford — none of them large enough to warrant a garrison, all of them exactly large enough to notice a dragon's shadow crossing their fields.",
        "This is, you understand instinctively, where a legend actually begins — not in some decisive, singular battle, but in the accumulated weight of small decisions like this one, repeated across a dozen forgettable villages whose names will nonetheless end up in every account of how you became what you became."
      ],
      choices: [
        { label:"Raid all three without mercy", flavor:"A systematic sweep. Take everything, leave a warning.",
          stats:{axis1:-14}, infamy:18, wealth:20, next:"2.3",
          outcome:["You take them in sequence, methodically, granary by granary — Millbrook first, its harvest barely in; then Thistlewick, whose miller tries and fails to bar his own doors against you; then Ashford Ford, whose bridge you leave standing, mostly, because burning it would have taken time you didn't particularly want to spend. By the time you're done, three villages know exactly what you are, and by the time the story reaches the next town over, so does everyone else.",
          "It is neither elegant nor subtle. It is, however, extremely effective advertising."] },
        { label:"Impose a toll on the road itself", flavor:"Let merchants pay for safe passage instead of burning the villages.",
          stats:{axis2:14}, infamy:8, wealth:30, next:"2.3",
          outcome:["You do not touch the villages at all. Instead you take up a position on the ridge overlooking the road itself, and let every merchant caravan that passes beneath you understand, without needing to be told twice, that continued safe passage now has a price. Word travels along the trade routes faster than any raid could — dragons, it turns out, make excellent toll collectors, precisely because negotiating with one is not something most caravan masters are eager to attempt twice.",
          "The villages, spared entirely, never quite work out why. The merchants know exactly why, and pay promptly."] },
        { label:"Hunt the wild herds instead, and let the villages be", flavor:"Restraint, and a growing legend built on mystery rather than ash.",
          stats:{axis3:10, axis2:-6}, infamy:-2, next:"2.3",
          outcome:["You turn away from the villages entirely and hunt the hill country instead — wild elk, the occasional bear foolish enough to contest you for a carcass — leaving Millbrook, Thistlewick and Ashford Ford to harvest their fields under your shadow, untouched, for reasons none of them can quite explain to each other. A dragon that could have taken everything and chose not to becomes its own kind of unsettling rumor.",
          "You have not yet decided whether restraint is a strategy or simply what feels right. Either way, the villages will remember it, and remembering, it turns out, is its own kind of power."] }
      ]
    },

    "2.3": {
      chapterShort:"Chapter Two", chapter:"Chapter Two — The Empire", part:"Part III",
      title:"The Plunder of Oakhaven",
      text:[
        "Word of a dragon in the highlands has finally reached the lowlands, and with it, the temptation of the first true human settlement in your reach: Oakhaven, a walled market town of perhaps three thousand souls, its granaries full from a late harvest, its garrison small and poorly paid.",
        "You circle it once at dusk, low enough that farmers drop their tools and run screaming for the gate bell. The choice of what Oakhaven becomes to you — ash, tribute, or a quiet robbery its own lord never notices until the vaults are empty — will define what kind of legend begins to travel ahead of you on the trade roads."
      ],
      choices: [
        { label:"Burn it to the foundations", flavor:"Total destruction. The world will speak your name in fear.",
          stats:{axis1:-14}, infamy:28, wealth:10, next:"2.4a",
          outcome:["Oakhaven does not survive the night. You take the granaries first, then the market square, then, methodically, everything a torch can reach — not out of strategy but out of a desire to be unmistakable. By dawn the town is a smoking outline of its former self, and the survivors who fled into the hills will spend the rest of their lives being the ones who saw it happen.",
          "Word travels faster than you do. By the time you return to your lair, three separate kingdoms already know your name, and none of them are speaking it kindly."] },
        { label:"Demand tribute from the mayor", flavor:"Rule from above. Let them pay you to survive.",
          stats:{axis2:8}, infamy:14, wealth:25, next:"2.4a",
          outcome:["You land in the market square rather than above it, and let the sheer fact of your presence do the negotiating. The mayor, sensible in the particular way of a man who has just watched a dragon land in his town square, agrees to terms before you have finished explaining them. Oakhaven survives, poorer and considerably more frightened, but standing.",
          "It is, you find, a surprisingly efficient arrangement — and one you intend to repeat on every settlement within reach that has anything worth taking on a schedule."] },
        { label:"Rob the banks discreetly by night", flavor:"No one need ever know it was you — until the ledgers are checked.",
          stats:{axis2:18}, infamy:5, wealth:35, next:"2.4a",
          outcome:["You wait for full dark and slip into the town through the old flood culverts rather than over the walls, and by the time the first vault door creaks open under a claw far more precise than its size should allow, the entire garrison is asleep at their posts. You are gone before the bells even think to ring, gold sacks vanishing into the night sky along with you.",
          "It will be three full days before anyone in Oakhaven realizes exactly how much is missing — and considerably longer before anyone thinks to blame a dragon for a crime with no fire, no wreckage, and no witnesses."] }
      ]
    },

    "2.4a": {
      chapterShort:"Chapter Two", chapter:"Chapter Two — The Empire", part:"Part IV",
      title:"The Princess Speaks",
      text:[
        "Aurelia has not screamed, has not fainted, and has not, notably, dropped the jeweled letter-opener she is still gripping like it might actually do something against you. She simply glares, waiting, with the specific patience of someone who has clearly been raised to believe that silence is a weapon too."
      ],
      choices: [
        { label:"\"Scream. It's more efficient than talking, and I'm told very cathartic.\"", flavor:"Deadpan. Mildly unhinged.",
          stats:{axis2:6}, next:"2.4",
          outcome:["She does not scream. Instead she informs you, with the icy composure of someone raised specifically to insult people who could eat her, that your breath 'smells like a blacksmith's forge had a baby with a dead fish.' You are, despite everything, a little impressed.",
          "It is not the reaction you expected. It is, you suspect, the reaction she has been saving for exactly this occasion."] },
        { label:"\"I promise no harm, Princess. For now.\"", flavor:"Honest, with an honest caveat attached.",
          stats:{axis2:-6}, next:"2.4",
          outcome:["'\"For now\" is doing a great deal of work in that sentence,' Aurelia observes, not lowering the letter-opener an inch. But something in her posture eases fractionally — not trust, not yet, but the recognition of a threat that at least bothered to be honest about its terms.",
          "You did not expect honesty to count for much here. It appears to count for slightly more than nothing."] },
        { label:"\"Drop the letter-opener. It's adorable, but it isn't going to work.\"", flavor:"Amused. Possibly a mistake.",
          stats:{axis1:-6}, next:"2.4",
          outcome:["She does not drop it. She throws it, with surprising accuracy, directly at your eye — missing by perhaps two inches, which is considerably closer than 'adorable' generally implies. 'Noted,' she says, already reaching for the second letter-opener you did not know she had.",
          "You are beginning to suspect this particular hostage situation is not going to go entirely according to plan."] }
      ]
    },

    "2.4": {
      chapterShort:"Chapter Two", chapter:"Chapter Two — The Empire", part:"Part IV",
      title:"The Royal Hostage",
      text:[
        "Your growing infamy has bought you the attention of a kingdom, and a kingdom's attention arrives in the form of an armed convoy: banners, mounted knights, and at its centre, in a gilded carriage, Crown Princess Aurelia, on her way to a wedding alliance that will now never take place.",
        "You take the carriage apart like a nutshell and the princess with it, carrying her — furious, unbowed, still gripping a jeweled letter-opener like a dagger — back to your lair, while the surviving knights gallop for the capital to report the unthinkable. She sits now across from you in your own den, and stares at you not with the terror you expected, but with cold, assessing curiosity."
      ],
      choices: [
        { label:"Lock her away and demand ransom", flavor:"A pure, profitable transaction. She is worth her weight in gold.",
          stats:{axis2:10}, infamy:12, wealth:30, next:"3.1", setFlags:{aureliaAlive:true},
          outcome:["You settle Princess Aurelia into a heavily warded corner of your lair — comfortable enough that no one can later accuse you of cruelty, secure enough that escape is not a realistic option — and send word to the capital through the one surviving knight, in terms specific enough to leave no room for negotiation. The ransom arrives within the fortnight, an absurd sum, delivered by a delegation too frightened to make eye contact with either of you.",
          "Aurelia, for her part, spends her captivity taking meticulous mental notes on your lair's defenses. You suspect this will matter again someday. You are, as it turns out, entirely correct."] },
        { label:"Devour her to show your power", flavor:"An unambiguous statement to every throne watching.",
          stats:{axis1:-20}, infamy:40, next:"3.1", setFlags:{aureliaAlive:false},
          outcome:["You do not hesitate, and the message it sends is immediate and unambiguous: every throne within a thousand miles now understands, with total clarity, precisely what kind of dragon they are dealing with. The kingdom's response is fury dressed up as strategy — hastily assembled war councils, a grieving king, a call to arms that will take months to actually mobilize.",
          "You have bought yourself time with terror. Whether that trade was worth what it cost is a question history, and possibly you, will keep returning to. For what it's worth — and it isn't worth much — she also didn't agree with you, digestively speaking. Royalty, you decide, eating your way through a light stomach ache that night, is entirely too rich a diet for regular consumption."] },
        { label:"Treat her as an intellectual equal", flavor:"Open a conversation instead of a cage. See what she truly is.",
          stats:{axis3:18, axis2:6}, infamy:-4, next:"3.1", setFlags:{aureliaAlive:true},
          outcome:["You do not lock her away. Instead you talk — awkwardly at first, and then, as the hours stretch into days, with a genuine and mutual curiosity neither of you quite expected. Aurelia turns out to be sharper than any advisor in her father's court, unafraid of you in a way that has nothing to do with recklessness and everything to do with having actually looked at you and decided you were worth understanding rather than simply fearing.",
          "When you eventually release her — because by then it has become obvious that you will — she leaves with something rarer than ransom: an opinion of dragons that not one person in her kingdom shares, and will not, for a long time, be able to change."] }
      ]
    },

    /* ============ CHAPTER THREE — THE WAR OF MANKIND ============ */
    "3.1": {
      chapterShort:"Chapter Three", chapter:"Chapter Three — The War of Mankind", part:"Part I",
      title:"The First Knights",
      text:[
        "The kingdom's opening response is not the champion you might have expected, but a hastily assembled band of seven hedge-knights and sellswords under a minor baron too proud, or too indebted, to wait for the crown's official war effort to organize itself. They arrive at dawn, banners a size too grand for their numbers, clearly meant less to defeat you than to be seen trying — a probing test, everyone involved privately understands, to buy the kingdom's real preparations a few more weeks.",
        "Their captain, a stout man whose armor has clearly seen more ceremonies than battles, calls up toward your den with a voice that cracks only slightly on the second word. 'Dragon! Surrender the mountain, or face the wrath of the crown!' Behind him, several of his men are visibly recalculating their life choices."
      ],
      choices: [
        { label:"Slaughter them on the mountainside", flavor:"Leave none alive. Let the message be unmistakable.",
          stats:{axis1:-14}, health:-6, infamy:20, next:"3.2a",
          outcome:["You do not negotiate with an opening move this transparent. You are among them before the captain finishes his second sentence, and it is over in minutes — brutal, thorough, and utterly without survivors to carry the tale back except in the vaguest, most terrified rumors. The baron who sent them will spend the rest of his career explaining, badly, why none of his knights came home.",
          "The kingdom's real preparations, whatever they were going to be, now have considerably more urgency behind them — and considerably less patience for half-measures."] },
        { label:"Roar them into a screaming retreat", flavor:"Let them see exactly what they're facing, and decide for themselves.",
          stats:{axis2:12}, infamy:6, next:"3.2a",
          outcome:["You do not kill a single one of them. You simply rise to your full height on the ridge above their formation, spread wings that block out a genuinely alarming portion of the morning sky, and let loose a roar that rattles armor plating from half a mile away. It is, you find, considerably more effective than violence — three men break formation and run before the captain even finishes drawing his sword, and the rest are not far behind.",
          "No blood, no bodies to explain, and a story that will lose nothing at all in the retelling. Sometimes the threat performs better than the act."] },
        { label:"Spare their leader, and send terms back with him", flavor:"Diplomacy through a survivor. Let the kingdom hear it from a witness.",
          stats:{axis2:-14}, infamy:-4, wealth:10, next:"3.2a",
          outcome:["You let the rank and file scatter in their initial panic and go straight for the captain instead, pinning him beneath a single foreleg with enough restraint to make the point without breaking anything essential. 'Tell your crown,' you say, in the calm, unhurried tone of something that has never once needed to shout to be believed, 'that I am willing to discuss terms. I am considerably less willing to discuss them with the next messenger they send in pieces.'",
          "He rides back down the mountain considerably paler than he arrived, and considerably more useful to you alive than any of his men would have been dead."] }
      ]
    },

    "3.2a": {
      chapterShort:"Chapter Three", chapter:"Chapter Three — The War of Mankind", part:"Part II",
      title:"Words Before the Blade",
      text:[
        "Galahad has said his piece — reckoning, however it must, all very properly ominous. He is still several strides from striking range. There is, you calculate, time for exactly one exchange before this becomes considerably less verbal."
      ],
      choices: [
        { label:"\"'Reckoning' is a big word for someone whose sword hand is shaking.\"", flavor:"A taunt. It's not even true, but it might rattle him.",
          stats:{axis1:-6}, next:"3.2",
          outcome:["His hand was not shaking. It is now, slightly, out of sheer indignant spite, which you suppose is a victory of a very small and specific kind. 'It will stop shaking,' he says, 'directly before it stops being attached to my arm, dragon, and not one moment sooner.'",
          "Performative bravado, you are learning, works on paladins exactly as well as it works on everyone else. Which is to say: somewhat, and briefly."] },
        { label:"\"I've done worse than reckoning to bigger things than you.\"", flavor:"A quieter, more genuine threat.",
          stats:{axis1:6}, next:"3.2",
          outcome:["'So the histories imply,' he says, entirely unfazed, drawing his blade the rest of the way free. 'I brought a bigger sword.' You cannot immediately fault the logic. You can, at least, respect a man who does his homework before volunteering to die.",
          "This is going to be a genuinely difficult fight, and you both already know it."] },
        { label:"\"Must you? I only just finished organizing my hoard alphabetically.\"", flavor:"Deadpan absurdity. See if it lands.",
          stats:{axis3:6}, next:"3.2",
          outcome:["Something flickers across Galahad's face that is almost, almost a smile, before he visibly remembers his oath, his order, and the general inadvisability of finding a dragon funny mid-confrontation, and scowls twice as hard to compensate. 'I am given to understand,' he says stiffly, 'that dragons are not typically known for their organizational habits.'",
          "'We contain multitudes,' you inform him, and for one very strange moment, neither of you moves to attack the other."] }
      ]
    },

    "3.2": {
      chapterShort:"Chapter Three", chapter:"Chapter Three — The War of Mankind", part:"Part II",
      title:"The Holy Knight",
      text:[
        "The kingdom's real answer arrives on a white destrier at your cave mouth, alone, which is either supreme confidence or supreme foolishness: Sir Galahad, Paladin of the Sunfire Order, a blade of blessed silver-steel humming with warded light in his gauntleted fist. He does not shout, does not threaten. He simply says, 'Dragon. Your reckoning has come, however it must,' and steps into the dark toward you.",
        "He is skilled beyond any human you have measured yourself against, and the sword in his hand could cut through scale as if it were parchment. How this ends is entirely a question of what kind of monster — or ruler — you have chosen to become."
      ],
      choices: [
        { label:"Meet him in honorable single combat", flavor:"Sword against fang and claw, no tricks, no advantage taken.",
          stats:{axis2:-16}, health:-24, infamy:10, next:"3.3a",
          outcome:["You meet Galahad in the open cavern floor rather than the shadows, matching his honor with your own, and the fight that follows is the hardest of your life. His blessed sword finds your hide twice before you manage to close the distance properly, and by the time you finally pin him beneath a foreleg, you are both bleeding, both exhausted, and both, in some strange way, satisfied that the fight was fair.",
          "He yields rather than dies — an outcome neither of you quite planned for, and one that will matter more than either of you yet realizes."] },
        { label:"Collapse the cavern ceiling on him", flavor:"Use the mountain itself as your weapon. He never draws close.",
          stats:{axis2:20}, health:-4, infamy:2, next:"3.3a",
          outcome:["You let him walk deeper into the dark, drawing him past a section of ceiling you have long known to be unstable, and bring the mountain down on him before his blessed sword ever comes within striking distance. It is not glorious. It is not meant to be. Dust and rubble settle over a silence that stretches long enough for you to wonder if it worked.",
          "It worked. Whatever legend eventually gets told about the paladin who challenged a dragon and vanished, it will not include the detail that he never got a single swing in."] },
        { label:"Bribe and unsettle him with words", flavor:"Offer him gold, doubt, and the seed of an idea he cannot un-hear.",
          stats:{axis2:14, axis3:8}, infamy:-2, next:"3.3a",
          outcome:["You do not fight him at all, not with claw or with flame. Instead you talk — about the kingdom that sent him alone to die for a crown that will not remember his name, about the exact size of the fortune sitting three feet from where he is standing, about the particular kind of doubt that a righteous man cannot un-hear once it has been spoken aloud. Galahad does not accept your gold. But he leaves without drawing his sword, and rides back down the mountain carrying a question about his order he did not have when he arrived.",
          "Sometimes the deepest wound is the one that never breaks skin."] }
      ]
    },

    "3.3a": {
      chapterShort:"Chapter Three", chapter:"Chapter Three — The War of Mankind", part:"Part III",
      title:"An Uninvited Introduction",
      text:[
        "Mirelle has already said her piece — the wondering how long it would take you, the pointed question about who might have sent you. She is watching you now with the particular patience of someone who has clearly rehearsed several possible versions of this conversation, alone, for years, and is mildly disappointed none of her rehearsals involved quite this much scale."
      ],
      choices: [
        { label:"\"Should I be flattered you expected me, or worried?\"", flavor:"Wry. Curious. Buying time to assess her.",
          stats:{axis3:6}, next:"3.3",
          outcome:["'Both, generally, is the correct response to me,' she says, without a trace of humor and without a trace of dishonesty either. 'I find it saves a great deal of time to establish that early.'",
          "You are beginning to like her, against every instinct that has kept you alive this long."] },
        { label:"\"Talk fast. I don't often extend this courtesy.\"", flavor:"Intimidating. A little theatrical.",
          stats:{axis1:6}, next:"3.3",
          outcome:["'Noted,' she says, entirely unbothered, already turning to retrieve a rolled map from somewhere inside her tower. 'I'll try to be concise about the impending apocalypse, then. Give me a moment to find the right map — I have several, and only one of them is currently relevant.'",
          "This is, you reflect, an extremely strange way to be threatened back."] },
        { label:"\"I don't trust hermits who build wards this good. What are you hiding?\"", flavor:"Skeptical. Reasonably so.",
          stats:{axis2:6}, next:"3.3",
          outcome:["She raises one eyebrow, slow and deliberate, the universal expression of someone who has been asked this exact question by exactly the wrong people, exactly too many times. 'Everything, dragon,' she says. 'That is rather the point of a hermitage. I would be terrible at it otherwise.'",
          "You cannot, in fairness, argue with the logic."] }
      ]
    },

    "3.3": {
      chapterShort:"Chapter Three", chapter:"Chapter Three — The War of Mankind", part:"Part III",
      title:"The Hermit Sorceress",
      text:[
        "Scouting the war's approach from higher ground, you find something that has nothing to do with the army you're expecting: a squat stone tower half-swallowed by ivy, deep in a hollow no road actually reaches, humming faintly with wards old enough to have weathered into the stone itself. Whoever lives there has clearly gone to considerable trouble not to be found, which is, in your experience, exactly the kind of trouble worth investigating.",
        "The tower's occupant does not wait for you to knock, in whatever way a dragon might. A woman steps out onto the threshold before you have fully landed — grey-streaked, sharp-eyed, unarmed except for the staff she is very obviously not using as a walking aid — and regards you with none of the fear you have come to expect and rather more calculation. 'A dragon,' she says, in the flat tone of someone confirming a suspicion rather than making a discovery. 'I wondered how long it would take you to find this place. Or whether you'd already been sent to.'"
      ],
      choices: [
        { label:"Kill her before she can strike first", flavor:"An unknown spellcaster near your war is a risk you cannot afford.",
          stats:{axis1:-16}, health:-8, infamy:14, next:"3.4", setFlags:{sorceressAlive:false},
          outcome:["You do not wait to find out what she meant. She fights back harder than her age or her tower suggested she could — a last, desperate lattice of wards flaring blue-white against your claws before they finally give — and by the time it is over, you are bleeding in three places and she is not breathing in any. Her final words, half-swallowed by her own collapsing spellwork, are not a curse. They sound, disturbingly, like a warning.",
          "It will be some time before you learn what she was trying to tell you, and considerably longer before you can be entirely certain killing her was the right call."] },
        { label:"Demand she explain herself, claws ready", flavor:"Hear her out first. You can always finish this afterward.",
          stats:{axis3:14}, health:-2, next:"3.4", setFlags:{sorceressAlive:true},
          outcome:["You do not strike, not yet — curiosity, for once, outweighing caution. She introduces herself as Mirelle, once court sorceress to a kingdom two rulers removed from this one, and explains, with the clipped economy of someone who has rehearsed this conversation many times in solitude, that the war being waged against you is not entirely what it appears to be. 'Ostrovan is a puppet,' she says. 'A good wizard doing his king's bidding, same as everyone else in this. Someone else is pulling every string in this war, dragon, and it isn't your Emperor.'",
          "You do not yet know whether to believe her. But you do not kill her either, and that, you sense, is the more consequential decision of the two."] },
        { label:"Trust your instincts, and lower your guard first", flavor:"Something about her does not read as an enemy. Take the risk.",
          stats:{axis2:-16}, next:"3.4", setFlags:{sorceressAlive:true},
          outcome:["Something in the way she stands — unafraid but not aggressive, watchful rather than hostile — convinces you before she has said a full sentence. You fold your wings, settle onto the hillside rather than looming over her tower, and let her speak without the threat of claws hanging over every word. It is, you will later reflect, one of the better instincts you have trusted in your short life. Mirelle, once court sorceress to a kingdom two rulers removed from this one, has spent years quietly working against the true architect of the war now climbing your mountain — and she has been waiting, she admits, for someone with the strength to actually do something about it.",
          "'I did not expect that someone to have scales,' she says. 'I am adjusting my expectations rapidly.'"] }
      ]
    },

    "3.4": {
      chapterShort:"Chapter Three", chapter:"Chapter Three — The War of Mankind", part:"Part IV",
      title:"The Archmage's Battalion",
      text: (state) => {
        let goblinLine = "";
        if(state.flags.goblinAllies === 'worship'){
          goblinLine = " Even your goblin worshippers, warned by their own scouts, spill out of their warren to watch the army pass, chanting your name like a battle-hymn rehearsed for exactly this occasion.";
        } else if(state.flags.goblinAllies === 'fear'){
          goblinLine = " Deep in the warren, the goblins you long ago broke to servitude watch the approaching army with an expression you have learned to recognize as opportunity.";
        } else if(state.flags.goblinAllies === 'trust'){
          goblinLine = " In the ravine below, the goblin tribe that has quietly trusted you for seasons now watches the approaching army with something that looks remarkably like solidarity.";
        }
        const sorceressLine = state.flags.sorceressAlive
          ? " Mirelle, watching the same army from a rise a half-mile from your den, says only, 'This is Ostrovan's battalion. Whatever you decide to do with it, understand that it is not the war you actually need to win.'"
          : "";
        return [
          "Galahad's fate — however you sealed it — was only the opening move. Now an entire army crawls up the mountain's flank: siege catapults hauled on ox-carts, ranks of pikemen, and at its heart, the Archmage Ostrovan and his battle-college of war-wizards, their staves crackling with chained lightning. This is no longer a monster hunt. This is a war, and it has your name on its banner." + goblinLine + sorceressLine,
          "The mountain shakes with the first catapult volley before you have even finished deciding how to answer it."
        ];
      },
      choices: [
        { label:"Fly above and destroy their supply lines", flavor:"An aerial campaign of speed and precision, far from their spellfire.",
          stats:{axis1:12}, health:-10, infamy:16, next:"3.5",
          outcome:["You take to the sky before the second catapult volley even lands, circling wide and low behind their lines to find exactly what every siege depends on and never adequately protects: the supply carts. Three passes and a few careful bursts of flame later, their oxen are scattered, their food is ash, and an army that arrived expecting a straightforward siege is suddenly calculating how many days it has left before starvation does your work for you.",
          "It is not the battle they trained for. It is the only battle you needed to win."] },
        { label:"Rally the mountain's goblin and orc tribes", flavor:"Turn old neighbors — or old subjects — into an army fighting beside you.",
          stats:{axis2:18}, infamy:8, next:"3.5",
          outcome: (state) => {
            const mode = state.flags.goblinAllies;
            if(mode === 'worship'){
              return [
                "You do not persuade the goblin tribes so much as summon them. To creatures who have spent seasons leaving offerings at the mouth of your den, a call to war from their god is not a request — it is scripture. They arrive not as mercenaries but as zealots, screaming down the mountainside into the army's flank with a fervor no coin could ever have purchased.",
                "War, you are learning, is rarely won by the strongest single combatant. It is won by whoever has the most reasons fighting on their side — and faith, it turns out, is a remarkably durable one."
              ];
            }
            if(mode === 'fear'){
              return [
                "You descend into the warrens you have long kept in chains and offer the goblins there a bargain even they can recognize as an improvement: fight, and the leash loosens. It is not loyalty that answers your call, but the oldest motivation there is — the terrified hope of a lighter chain — and it is enough. They pour down the mountainside into the army's flank, driven less by hatred of the invaders than by fear of what happens if they refuse you.",
                "War, you are learning, is rarely won by the strongest single combatant. It is won by whoever has the most reasons fighting on their side, however those reasons were acquired."
              ];
            }
            return [
              "You descend into the goblin warrens beneath the mountain's eastern face — territory whose trust you earned rather than took — and offer the tribes there something no human lord ever has: a share of the coming victory, freely asked for rather than demanded. They arrive in numbers that surprise even you, screaming down the mountainside into the army's flank at exactly the moment the siege lines are most stretched.",
              "War, you are learning, is rarely won by the strongest single combatant. It is won by whoever has the most reasons fighting on their side."
            ];
          } },
        { label:"Use magic to turn their forces on each other", flavor:"Whisper doubt, illusion and rivalry through their ranks until they break themselves.",
          stats:{axis3:20, axis2:10}, infamy:6, next:"3.5",
          outcome:["You do not meet the army at all, not directly. Instead you move through the fog and half-light at its edges, planting illusions of betrayal among the war-wizards, whispered doubts among the pikemen, a single convincing vision of the Archmage abandoning his own troops to save himself. By midnight the siege has not been broken by dragonfire. It has broken itself, companies turning on companies in the confused, paranoid dark, certain they are defending against an enemy that was never where they thought it was.",
          "By dawn, what marches back down the mountain is not an army anymore. It is survivors."] }
      ]
    },

    /* ============ CHAPTER FOUR — THE ENDGAME ============ */

    "3.5": {
      chapterShort:"Chapter Three", chapter:"Chapter Three — The War of Mankind", part:"Part V",
      title:"Blood Remembers",
      text: (state) => {
        let callback = "";
        if(state.flags.vexarFirstApproach === 'fight'){
          callback = " You remember every detail of the last time he pinned you without effort — the dust, the bruises, the maddening calm in his voice. You have thought about that morning more often than you'd like to admit.";
        } else if(state.flags.vexarFirstApproach === 'outmaneuver'){
          callback = " You remember the grudging almost-respect in his voice the last time — 'might, eventually,' he said. You intend to make eventually arrive considerably sooner than he expects.";
