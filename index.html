    const el = document.createElement('div'); el.className = 'toast';
    el.innerHTML = `<div class="t-ic">${icon(t.ic)}</div><div><b>${esc(t.title)}</b><small>${esc(t.sub)}</small></div>`;
    document.body.appendChild(el);
    setTimeout(() => { el.remove(); next(); }, 3000);
  };
  next();
}
function announce(list){ (list||[]).forEach(a => toast('Achievement: ' + a.title, a.desc, a.icon)); }

/* ════════════ FLOW ════════════ */
const UI = { screen:null, preview:null, lastPointer:'mouse' };
const TOUCH = () => UI.lastPointer === 'touch' || (window.matchMedia && matchMedia('(hover: none)').matches);
document.addEventListener('pointerdown', (e) => { UI.lastPointer = e.pointerType || 'mouse'; }, true);

function choose(choice, idx){
  if(isLocked(choice) || CS.running) return;
  const nodeId = state.node;
  state.undo = JSON.stringify(Object.assign({}, state, {undo:null}));
  applyChoiceCore(state, choice);
  saveGame();
  UI.preview = null; UI.previewIdx = null;
  const fresh = checkAchievements(state);
  if(shouldPlayCutscene(nodeId, idx)){
    playCutscene(nodeId, idx).then(() => { render(); announce(fresh); });
    return;
  }
  announce(fresh);
  render();
}
function continueStory(){
  const prev = STORY.nodes[state.node];
  continueCore(state);
  state.undo = null;
  saveGame();
  const n = STORY.nodes[state.node];
  if(n && prev && n.chapterShort !== prev.chapterShort) showChapterCard(n, state.chapterHeal);
  render();
}
function rewind(){
  if(!state.undo) return;
  state = JSON.parse(state.undo); state.undo = null; saveGame();
  const a = unlockAchievement('rewind'); if(a) announce([a]);
  render();
}
function confirmName(raw){
  const name = (raw || '').trim();
  state.dragonName = name ? name.slice(0, 32) : pickPresetName();
  state.phase = 'story'; if(!state.visited.includes(state.node)) state.visited.push(state.node);
  saveGame(); UI.screen = null;
  showChapterCard(STORY.nodes[state.node], 0);
  render();
}
async function newSaga(skipConfirm){
  if(!skipConfirm && state.phase !== 'naming' && !state.node.startsWith('__ending_')){
    if(!await ask('A new hatching?', 'Your current saga will be lost. Endings and feats you have discovered are kept.', 'Hatch anew', true)) return;
  }
  state = freshState(); clearSave(); UI.screen = null; closeSheet(); render();
}

function showChapterCard(node, heal){
  if(!node) return;
  const [lab, nm] = node.chapter.split(' — ');
  const idx = chapterIndex(state.node);
  const el = document.createElement('div'); el.className = 'chapter-card';
  el.innerHTML = `<div class="num">${ROMAN[idx] || ''}</div><div class="lab">${esc(lab)}</div><div class="nm">${esc(nm || '')}</div>
    ${heal ? `<div class="heal">${icon('heart','sm')} Seasons pass. Your wounds close: +${heal} health.</div>` : ''}<div class="tap">Tap to continue</div>`;
  const close = () => { if(!el.isConnected) return; el.classList.add('out'); setTimeout(() => el.remove(), 450); };
  el.onclick = close; document.body.appendChild(el); setTimeout(close, SETTINGS.reduce ? 1400 : 3200);
}

/* ════════════ RENDER ════════════ */
function previewBubble(hero, look){
  let b = $('pv-bubble');
  const visible = hero && hero.getBoundingClientRect().bottom > 90;
  if(visible){ if(b) b.remove(); return; }
  if(!b){ b = document.createElement('div'); b.id = 'pv-bubble'; document.body.appendChild(b); }
  // While choosing hide or tail, the attribute is what changes, so that is what follows you down
  const attr = state.node === '1.1b' ? ['hide', look.texture, HIDE_NAME[look.texture]] : state.node === '1.1d' ? ['tail', look.tail, TAIL_NAME[look.tail]] : null;
  if(attr && attr[1]){ b.className = 'pv-bubble attr'; b.innerHTML = `<div class="pv-medal"><img src="art/${attr[0]}-${attr[1]}.webp" alt=""></div><span>${esc(attr[2])}</span>`; }
  else { b.className = 'pv-bubble'; b.innerHTML = dragonArt(look); }
}
function render(){
  const app = $('app');
  FX.stop();
  const pb = $('pv-bubble'); if(pb) pb.remove();
  if(UI.screen === 'title') app.innerHTML = topbar() + renderTitle();
  else if(state.phase === 'naming') app.innerHTML = topbar() + renderNaming();
  else if(state.phase === 'outcome') app.innerHTML = topbar() + renderOutcome();
  else if(state.node.startsWith('__ending_')) app.innerHTML = topbar() + renderEnding();
  else app.innerHTML = topbar() + renderStory();
  bind();
  startBannerFX();
  window.scrollTo({top:0, behavior: SETTINGS.reduce ? 'auto' : 'smooth'});
}

function renderTitle(){
  const s = state, n = STORY.nodes[s.node];
  const where = s.node.startsWith('__ending_') ? 'Saga complete' : n ? `${n.chapterShort} · ${esc(resolveTitle(n))}` : '';
  const found = ENDING_ORDER.filter(k => META.endings[k]).length;
  return `<div class="title-hero"><h1>Eternal Hoard</h1><div class="sub">A Dragon's Tale</div></div>
    <div class="banner">${sceneSVG('cave')}<canvas data-fx="embers"></canvas><div class="hero-dragon" style="right:50%;transform:translateX(50%);width:78%">${dragonArt(dragonLook(s), 'full', {fixedScale:1})}</div></div>
    ${s.dragonName ? `<div class="continue-card"><div class="p">${dragonArt(dragonLook(s), 'sm', {fixedScale:1})}</div><div><b>${esc(s.dragonName)}</b><small>${where}</small><small>${s.wealth} gold · ${s.infamy} infamy · ${s.health} health</small></div></div>
      <button class="btn" id="t-cont">${icon('play')}Continue the saga</button>` : ''}
    <div class="btn-row"><button class="btn ${s.dragonName ? 'ghost' : ''}" id="t-new">${icon('egg')}New hatching</button></div>
    <div class="btn-row"><button class="btn ghost" id="t-end">${icon('trophy')}Endings ${found}/${ENDING_ORDER.length}</button></div>`;
}

function renderNaming(){
  return banner('cave', 'Before it begins', 'What Shall We Call You?', {creation:true, dragon: dragonArt(dragonLook(state))}) +
    paras(["Before the shell cracks, before the first breath of smoke or shadow or gold, the world wants a name to attach to the legend that is about to begin. Choose your own, or let the mountain choose one for you."]) +
    `<input type="text" id="name-field" class="name-input" placeholder="Your dragon's name…" maxlength="32" autocomplete="off">
     <div class="divider">or let the mountain choose</div>
     <div class="presets">${NAME_PRESETS.map(n => `<button class="preset" data-name="${n}">${n}</button>`).join('')}</div>
     <button class="btn" id="name-go">${icon('flame')}Begin the saga</button>`;
}

function renderStory(){
  const node = STORY.nodes[state.node];
  const choices = resolveChoices(node);
  const creation = CREATION.has(state.node);
  const sceneKey = SCENE_OF[state.node] || 'cave';
  const look = dragonLook(state, UI.preview);
  const head = banner(sceneKey, `${node.chapterShort} · ${node.part}`, esc(resolveTitle(node)), creation ? {creation:true, dragon: heroArt(look)} : {});
  const list = choices.map((c, i) => {
    const locked = isLocked(c);
    const special = !!c.requires && !locked;
    return `<button class="choice ${locked ? 'locked' : ''} ${special ? 'special' : ''} ${UI.preview && UI.previewIdx === i ? 'preview' : ''}" data-idx="${i}" style="animation-delay:${.25 + i*.08}s" ${locked ? 'aria-disabled="true"' : ''}>
      ${special ? `<span class="special-tag">${icon('key','sm')}Only your dragon could</span>` : ''}
      <span class="c-label">${c.label}</span><span class="c-flavor">${c.flavor || ''}</span>
      ${locked ? `<span class="lock-hint">${icon('lock','sm')}${esc(c.lockHint || 'Locked')}</span>` : ''}
      ${SETTINGS.hints && !locked ? `<span class="c-hints">${choiceHints(c)}</span>` : ''}
      ${creation && UI.preview && UI.previewIdx === i && TOUCH() ? '<span class="tap-again">Tap again to choose</span>' : ''}
    </button>`;
  }).join('');
  return head + (creation ? '' : ledgerHTML()) + paras(resolveText(node.text)) + `<div class="choices">${list}</div>` +
    `<div class="footer"><button class="small-btn" onclick="openJournal('path')">${icon('map','sm')}Your path so far</button></div>`;
}

function renderOutcome(){
  const prev = STORY.nodes[state.node];
  const sceneKey = SCENE_OF[state.node] || 'cave';
  const impacts = state.pendingImpacts || [];
  setTimeout(() => outcomeEffects(impacts), 250);
  return banner(sceneKey, prev ? `${prev.chapterShort} · Aftermath` : 'Aftermath', esc(prev ? resolveTitle(prev) : ''), CREATION.has(state.node) ? {creation:true, dragon: heroArt(dragonLook(state))} : {}) +
    ledgerHTML() +
    `<div class="chips">${impacts.map(chipHTML).join('')}</div>` + paras(state.pendingOutcome) +
    `<button class="btn" id="cont-btn">${icon('arrow')}Continue</button>
     ${state.undo ? `<div class="footer"><button class="small-btn" id="rewind-btn">${icon('rewind','sm')}Rewind this choice</button></div>` : ''}`;
}
function outcomeEffects(impacts){
  const has = (k) => impacts.find(b => b.k === k);
  const v = $('vignette');
  if(has('hurt')){ if(!SETTINGS.reduce){ v.classList.add('hit'); $('app').classList.add('shake'); setTimeout(() => { v.classList.remove('hit'); $('app').classList.remove('shake'); }, 450); } try{ navigator.vibrate && navigator.vibrate([30, 40, 60]); }catch(e){} }
  const h = has('hoard');
  if(h && h.v > 0){ if(!SETTINGS.reduce) flyCoins(Math.min(14, 3 + Math.round(h.v / 5))); }
}
function flyCoins(n){
  const target = document.querySelector('.hoard-svg'); if(!target) return;
  const r = target.getBoundingClientRect();
  for(let i = 0; i < n; i++){
    const c = document.createElement('div'); c.className = 'coin-fly';
    const sx = window.innerWidth/2 + (Math.random()-.5)*160, sy = window.innerHeight*.55 + (Math.random()-.5)*80;
    c.style.left = sx + 'px'; c.style.top = sy + 'px';
    c.style.setProperty('--dx', (r.left + r.width/2 - sx) + 'px'); c.style.setProperty('--dy', (r.top + r.height/2 - sy) + 'px');
    c.style.animationDelay = (i*.05) + 's';
    document.body.appendChild(c); setTimeout(() => c.remove(), 1400 + i*50);
  }
}

function endingBonusParagraphs(){
  const bonus = [], f = state.flags;
  bonus.push("Somewhere to the north, the wreckage of a black citadel that once belonged to a man named Malvorath Thorne has already become a byword for what happens to those who plot against you from the shadows — a warning stone requires no upkeep once it has done its work.");
  if(f.sorceressAlive) bonus.push("Mirelle never did leave the mountain entirely. She keeps her own tower now, three peaks to the west, and visits often enough that the servants at your gate have long since stopped remarking on it.");
  if(f.goblinAllies === 'worship') bonus.push("In the ravine below, the goblin priesthood you never quite meant to found still leaves offerings at your door each new moon, their theology having survived — and outlived — several of their own kings.");
  else if(f.goblinAllies === 'fear') bonus.push("Deep in the mountain's eastern warren, the goblins you broke to servitude generations ago still mine gold for a master they have never once tried to overthrow, fear having proven, in your case, a remarkably stable form of government.");
  else if(f.goblinAllies === 'trust') bonus.push("In the ravine below, the goblin tribe you once chose to spare rather than conquer still trades freely at your mountain's foot, the last living creatures who remember you as something closer to a neighbor than a monster.");
  if(f.aureliaFate === 'killed') bonus.push("The throne room where you finally killed Aurelia has been sealed and left empty ever since — no regent in the years since has ever quite worked up the nerve to sit in it.");
  else if(f.aureliaFate === 'puppet') bonus.push("Aurelia still sits the throne, technically. The kingdom stopped asking what \"technically\" meant a long time ago, and has been considerably more peaceful for having stopped.");
  else if(f.aureliaFate === 'ally'){
    if(f.empireFate === 'conqueror') bonus.push("Empress Aurelia rules at your side over a realm considerably larger than the one her father ever left her, and considerably more honest, if nothing else, about how it got that way.");
    else if(f.empireFate === 'protector') bonus.push("Empress Aurelia rules at your side still, and between the two of you, this has become the one realm on the continent that neighboring kingdoms have quietly agreed is simply not worth testing.");
    else bonus.push("Empress Aurelia rules at your side still — an arrangement neither of you fully explained to the histories, and one neither of you has ever felt the need to.");
  }
  if(f.capitalFate === 'purged') bonus.push("The council chamber where you once purged the last of the old regime has been rebuilt three times since, each new government a little more careful about what it says in rooms with a clear view of your mountain.");
  else if(f.capitalFate === 'vassal') bonus.push("The Council of Regents still governs the capital, technically, in your name, in the particular hollow way governments do when everyone involved understands precisely whose permission actually matters.");
  if(f.vexarOutcome === 'victory') bonus.push("Vexar visits, now and then, on terms that have nothing left to do with dominance — the closest thing to family either of you has left, and, against every early prediction either of you would have made, something that has quietly come to resemble a friendship.");
  else if(f.vexarOutcome === 'draw') bonus.push("You and Vexar never did settle which of you was stronger, in the end, and have somehow spent the years since deciding they preferred it that way — an unfinished argument neither sibling has ever felt the need to actually finish.");
  else if(f.vexarOutcome === 'defeat') bonus.push("Vexar still holds, technically, that he could take you in a fair fight. You have never quite worked up the nerve to test that claim a third time — though you both privately suspect, these days, that the gap has closed considerably more than either of you says out loud.");
  return bonus.concat(expansionEpilogue(state));
}

function renderEnding(){
  const key = state.node.replace('__ending_', '');
  const ending = ENDINGS[key];
  if(!state.endingRecorded){
    state.endingRecorded = true;
    const first = recordEnding(key);
    state.endingFirst = first;
    saveGame();
    setTimeout(() => announce(checkAchievements(state, key)), 400);
  }
  const found = ENDING_ORDER.filter(k => META.endings[k]).length;
  const early = key === 'fallenEarly';
  const body = early ? ending.text : ending.text.concat(endingBonusParagraphs());
  return banner(ENDING_SCENE[key] || 'night', 'Epilogue', esc(ending.title), {dragon: dragonArt(dragonLook(state), 'full', {fixedScale:1})}) +
    `<div class="end-card"><div class="name">${esc(state.dragonName || '')}</div><div class="badge">${icon('crown','sm')}${esc(ending.badge)}</div>
      ${state.endingFirst ? '<div class="progress-line" style="color:var(--gold-hi)">A new ending discovered</div>' : ''}</div>` +
    paras(body) +
    `<div class="end-stats"><div class="stat-tile"><b>${state.wealth}</b><small>Gold</small></div><div class="stat-tile"><b>${state.infamy}</b><small>Infamy</small></div><div class="stat-tile"><b>${state.health}</b><small>Health</small></div></div>
     <div class="progress-line">${icon('trophy','sm')} Endings discovered: <b>${found}</b> of ${ENDING_ORDER.length}</div>
     <button class="btn gold" id="share-btn">${icon('share')}Share your legend</button>
     <div class="btn-row"><button class="btn ghost" onclick="openJournal('endings')">${icon('book')}Journal</button><button class="btn" id="restart-btn">${icon('egg')}New hatching</button></div>`;
}

function bind(){
  const q = (s) => document.querySelector(s);
  if(UI.screen === 'title'){
    q('#t-cont') && (q('#t-cont').onclick = () => { UI.screen = null; render(); });
    q('#t-new').onclick = async () => { if(state.dragonName && !state.node.startsWith('__ending_') && !await ask('A new hatching?', 'Your current saga will be lost. Endings and feats you have discovered are kept.', 'Hatch anew', true)) return; newSaga(true); };
    q('#t-end').onclick = () => openJournal('endings');
    return;
  }
  if(state.phase === 'naming'){
    const field = $('name-field');
    document.querySelectorAll('.preset').forEach(b => b.onclick = () => { field.value = b.dataset.name; document.querySelectorAll('.preset').forEach(x => x.classList.toggle('on', x === b)); });
    $('name-go').onclick = () => confirmName(field.value);
    field.onkeydown = (e) => { if(e.key === 'Enter') confirmName(field.value); };
    return;
  }
  if(state.phase === 'outcome'){
    $('cont-btn').onclick = continueStory;
    q('#rewind-btn') && (q('#rewind-btn').onclick = rewind);
    return;
  }
  if(state.node.startsWith('__ending_')){
    $('restart-btn').onclick = () => newSaga(true);
    $('share-btn').onclick = shareCard;
    return;
  }
  const node = STORY.nodes[state.node], choices = resolveChoices(node), creation = CREATION.has(state.node);
  if(creation) preloadArt(choices.map(c => { const fl = typeof c.setFlags === 'function' ? c.setFlags(state) : (c.setFlags || {}); const l = dragonLook(state, fl); return l.hatched ? `art/d-${l.color}-${l.horns || 'none'}.webp` : 'art/egg.webp'; }));
  document.querySelectorAll('.choice').forEach(btn => {
    const i = +btn.dataset.idx, c = choices[i];
    if(creation && !isLocked(c)){
      const pv = () => { const fl = typeof c.setFlags === 'function' ? c.setFlags(state) : (c.setFlags || {}); UI.preview = fl; UI.previewIdx = i; const lk = dragonLook(state, fl); const hd = $('hero-dragon'); if(hd) hd.innerHTML = heroArt(lk); previewBubble(hd, lk); document.querySelectorAll('.choice').forEach(b => b.classList.toggle('preview', b === btn)); };
      btn.onmouseenter = () => { if(!TOUCH()) pv(); };
      btn.onfocus = () => { if(!TOUCH()) pv(); };
      btn.onclick = () => {
        if(TOUCH() && UI.previewIdx !== i){ pv(); document.querySelectorAll('.tap-again').forEach(x => x.remove()); btn.insertAdjacentHTML('beforeend', '<span class="tap-again">Tap again to choose</span>'); return; }
        UI.previewIdx = null; choose(c, i);
      };
    } else btn.onclick = () => { if(isLocked(c)){ btn.classList.add('shake'); setTimeout(() => btn.classList.remove('shake'), 450); return; } choose(c, i); };
  });
}

/* ════════════ SHEETS: journal, settings ════════════ */
function ask(title, text, okLabel, danger){
  return new Promise(res => {
    const el = document.createElement('div'); el.className = 'ask';
    el.innerHTML = `<div class="ask-box" role="dialog" aria-modal="true"><div class="ask-ic">${icon(danger ? 'skull' : 'scroll','lg')}</div><h3>${esc(title)}</h3><p>${esc(text)}</p>
      <div class="btn-row"><button class="btn ghost" data-v="0">Cancel</button><button class="btn ${danger ? '' : 'gold'}" data-v="1">${esc(okLabel)}</button></div></div>`;
    const done = (v) => { el.remove(); res(v); };
    el.onclick = (e) => { const b = e.target.closest('button'); if(b) done(b.dataset.v === '1'); else if(e.target === el) done(false); };
    document.body.appendChild(el);
  });
}
function sheet(title, tabsHTML, body){
  closeSheet();
  const el = document.createElement('div'); el.className = 'overlay'; el.id = 'overlay';
  el.innerHTML = `<div class="sheet"><div class="sheet-h"><h2>${title}</h2><button class="tbtn" onclick="closeSheet()" aria-label="Close">${icon('x')}</button></div>${tabsHTML}<div class="sheet-b" id="sheet-b">${body}</div></div>`;
  el.onclick = (e) => { if(e.target === el) closeSheet(); };
  document.body.appendChild(el);
}
function closeSheet(){ const o = $('overlay'); if(o) o.remove(); }

function openJournal(tab = 'cast'){
  const tabs = [['cast','dragon','Cast'],['path','map','Path'],['ach','trophy','Feats'],['endings','crown','Endings']];
  sheet('Journal', `<div class="tabs">${tabs.map(([k, ic, l]) => `<button class="tab ${k===tab?'on':''}" onclick="openJournal('${k}')">${icon(ic,'sm')}${l}</button>`).join('')}</div>`, journalBody(tab));
}
function yourDragonCard(){
  const look = dragonLook(state);
  if(!state.dragonName || !look.hatched) return '';
  const COL = {'crimson':'Deep crimson', 'obsidian':'Obsidian black', 'storm-grey':'Storm-grey', 'gold-bronze':'Molten gold-and-bronze'};
  const HORN = {ram:'Ram horns', spike:'Twin spikes', crown:'Antler crown', none:'No horns'};
  return `<div class="your-dragon"><div class="yd-img">${dragonArt(look, 'full', {fixedScale:1})}</div>
    <div class="yd-txt"><b>${esc(state.dragonName)}</b><small>${[COL[look.color], look.horns ? HORN[look.horns] : '', look.texture ? HIDE_NAME[look.texture] : '', look.tail ? TAIL_NAME[look.tail] : ''].filter(Boolean).join(' · ')}</small>${medals(look, true)}</div></div>`;
}
function journalBody(tab){
  const s = state, seen = new Set(s.visited || []);
  if(tab === 'cast') return yourDragonCard() + CAST.map(c => {
    const met = seen.has(c.at);
    return `<div class="cast ${met?'':'unknown'}"><div class="sigil">${icon(met ? c.icon : 'lock')}</div><div><b>${met ? esc(c.name) : 'Not yet met'}</b><p>${met ? esc(c.desc) : 'Someone waits further along your path.'}</p>${met && c.status(s) ? `<div class="st">${esc(c.status(s))}</div>` : ''}</div></div>`;
  }).join('');
  if(tab === 'path'){
    if(!s.history.length) return '<p style="color:var(--parchment-dim)">Your story has not begun yet.</p>';
    return `<div class="tl">${s.history.map(h => `<div class="tl-i"><small>${esc(h.chapter || '')}${h.title ? ' · ' + esc(h.title) : ''}</small><span>${esc(h.label).replace(/^"|"$/g,'')}</span></div>`).join('')}</div>`;
  }
  if(tab === 'ach'){
    const n = ACHIEVEMENTS.filter(a => META.ach[a.id]).length;
    return `<p class="progress-line">${n} of ${ACHIEVEMENTS.length} feats unlocked, across all your sagas.</p><div class="grid2">${ACHIEVEMENTS.map(a => { const on = !!META.ach[a.id];
      return `<div class="tile ${on?'':'locked'}"><div class="t-ic">${icon(on ? a.icon : 'lock')}</div><b>${esc(a.title)}</b><small>${esc(a.desc)}</small></div>`; }).join('')}</div>`;
  }
  const n = ENDING_ORDER.filter(k => META.endings[k]).length;
  const hint = {tyrant:'Rule through fear alone.', shadow:'Rule unseen, and stay unseen.', wise:'Seek understanding over dominion.', emperor:'Conquer the world with an equal at your side.',
    protector:'Guard what you could have taken.', treaty:'Let gold do what fire could.', myth:'Leave the world wondering.', storm:'Refuse to be any one thing.', fallenEarly:'Burn too brightly.'};
  return `<p class="progress-line">${n} of ${ENDING_ORDER.length} endings discovered · ${META.runs} saga${META.runs===1?'':'s'} completed</p><div class="grid2">${ENDING_ORDER.map(k => { const on = !!META.endings[k], e = ENDINGS[k];
    return `<div class="tile ${on?'':'locked'}"><div class="t-ic">${icon(on ? 'crown' : 'lock')}</div><b>${on ? esc(e.badge) : '???'}</b><small>${on ? esc(e.title) + (META.endings[k] > 1 ? ` · ×${META.endings[k]}` : '') : esc(hint[k])}</small></div>`; }).join('')}</div>`;
}

function openSettings(){
  const seg = (key, opts) => `<div class="seg">${opts.map(([v, l]) => `<button class="${SETTINGS[key]===v?'on':''}" onclick="setSetting('${key}','${v}')">${l}</button>`).join('')}</div>`;
  const sw = (key) => `<button class="sw ${SETTINGS[key]?'on':''}" onclick="setSetting('${key}',${!SETTINGS[key]})" aria-label="${key}"></button>`;
  sheet('Settings', '', `
    <div class="set-row"><div><b>Text size</b></div>${seg('textSize', [['s','S'],['m','M'],['l','L']])}</div>
    <div class="set-row"><div><b>Show stat hints</b><small>Reveal which way each choice pulls you. Spoils a little.</small></div>${sw('hints')}</div>
    <div class="set-row"><div><b>Battle cutscenes</b><small>Short scenes when you fight. Tap to skip.</small></div>${sw('cutscenes')}</div>
    <div class="set-row"><div><b>Reduce motion</b><small>No particles, shakes or animations.</small></div>${sw('reduce')}</div>
    <div class="set-row"><div><b>Move your saga</b><small>Take your saga, endings and feats to another phone or browser.</small></div></div>
    <div class="btn-row" style="margin-top:0"><button class="btn ghost" onclick="exportSaga()">${icon('share')}Export</button><button class="btn ghost" onclick="importSaga()">${icon('download')}Import</button></div>
    <div class="btn-row"><button class="btn ghost" onclick="closeSheet();UI.screen='title';render()">${icon('scroll')}Title screen</button></div>
    <div class="btn-row"><button class="btn ghost" onclick="newSaga()">${icon('egg')}Restart this saga</button></div>
    <div class="btn-row"><button class="btn ghost" style="color:#d98a8a" onclick="resetProgress()">${icon('x')}Erase endings &amp; feats</button></div>
    <p class="progress-line" style="margin-top:18px">Eternal Hoard 2.1 · works offline · your saga saves automatically</p>`);
}
function setSetting(k, v){ SETTINGS[k] = v; saveSettings(); openSettings(); if(k === 'hints' || k === 'reduce' || k === 'textSize') render(); }
async function resetProgress(){ if(!await ask('Erase all progress?', 'Every discovered ending and feat will be forgotten. Your current saga is kept.', 'Erase', true)) return; META = {endings:{}, ach:{}, runs:0}; saveMeta(); openSettings(); }

/* ════════════ MOVE A SAGA (export / import) ════════════ */
function modal(inner){ const el = document.createElement('div'); el.className = 'ask'; el.innerHTML = `<div class="ask-box">${inner}</div>`; el.onclick = (e) => { if(e.target === el) el.remove(); }; document.body.appendChild(el); return el; }
function exportSaga(){
  const payload = { v:1, s: Object.assign({}, state, {undo:null}), m: META };
  const code = 'EH1:' + btoa(unescape(encodeURIComponent(JSON.stringify(payload))));
  const el = modal(`<div class="ask-ic">${icon('share','lg')}</div><h3>Your saga, as a code</h3><p>Copy this code and paste it into <b>Import</b> on your other phone or browser.</p>
    <textarea readonly>${code}</textarea><div class="btn-row"><button class="btn ghost" data-a="close">Close</button><button class="btn gold" data-a="copy">${icon('scroll','sm')}Copy</button></div>`);
  el.querySelector('textarea').onclick = (e) => e.target.select();
  el.querySelector('[data-a=close]').onclick = () => el.remove();
  el.querySelector('[data-a=copy]').onclick = async (e) => {
    try{ if(navigator.share && TOUCH()){ await navigator.share({title:'Eternal Hoard saga', text:code}); return; } }catch(err){ if(err && err.name === 'AbortError') return; }
    try{ await navigator.clipboard.writeText(code); e.target.closest('button').textContent = 'Copied'; }catch(err){ el.querySelector('textarea').select(); }
  };
}
function importSaga(){
  const el = modal(`<div class="ask-ic">${icon('download','lg')}</div><h3>Bring a saga here</h3><p>Paste the code from <b>Export</b>. Your current saga on this device will be replaced; endings and feats are combined.</p>
    <textarea placeholder="EH1:..."></textarea><div class="btn-row"><button class="btn ghost" data-a="close">Cancel</button><button class="btn" data-a="go">Import</button></div>`);
  el.querySelector('[data-a=close]').onclick = () => el.remove();
  el.querySelector('[data-a=go]').onclick = () => {
    try{
      const raw = el.querySelector('textarea').value.trim().replace(/\s+/g, '');
      if(!raw.startsWith('EH1:')) throw new Error('code');
      const data = JSON.parse(decodeURIComponent(escape(atob(raw.slice(4)))));
      if(!data.s || !(STORY.nodes[data.s.node] || String(data.s.node).startsWith('__ending_'))) throw new Error('state');
      state = migrate(data.s); state.undo = null; saveGame();
      const m = data.m || {};
      Object.entries(m.endings || {}).forEach(([k, v]) => { META.endings[k] = Math.max(META.endings[k] || 0, v); });
      Object.entries(m.ach || {}).forEach(([k, v]) => { if(!META.ach[k]) META.ach[k] = v; });
      META.runs = Math.max(META.runs || 0, m.runs || 0); saveMeta();
      el.remove(); closeSheet(); UI.screen = 'title'; render();
      toast('Saga imported', `Welcome back, ${state.dragonName || 'dragon'}.`, 'egg');
    }catch(err){ el.querySelector('p').innerHTML = '<span style="color:#d98a8a">That code did not work. Copy the whole code, from EH1: to the end, and try again.</span>'; }
  };
}

/* ════════════ SHARE CARD ════════════ */
async function shareCard(){
  const key = state.node.replace('__ending_', ''), e = ENDINGS[key];
  const W = 1080, H = 1350, cv = document.createElement('canvas'); cv.width = W; cv.height = H;
  const x = cv.getContext('2d');
  const g = x.createLinearGradient(0, 0, 0, H); g.addColorStop(0, '#1d0f14'); g.addColorStop(.55, '#0c0a10'); g.addColorStop(1, '#160d07'); x.fillStyle = g; x.fillRect(0, 0, W, H);
  const rg = x.createRadialGradient(W/2, 520, 40, W/2, 520, 520); rg.addColorStop(0, 'rgba(228,104,47,.35)'); rg.addColorStop(1, 'rgba(228,104,47,0)'); x.fillStyle = rg; x.fillRect(0, 0, W, H);
  x.strokeStyle = '#7d6a26'; x.lineWidth = 3; x.strokeRect(40, 40, W-80, H-80); x.strokeStyle = '#3a2c18'; x.strokeRect(56, 56, W-112, H-112);
  try{
    const look = dragonLook(state), img = new Image();
    img.src = `art/d-${look.color}-${look.horns || 'none'}.webp`;
    await img.decode(); const w = 880, h = w * img.naturalHeight / img.naturalWidth; x.drawImage(img, (W-w)/2, 790 - h, w, h);
  }catch(err){}
  try{ await document.fonts.load('900 60px Cinzel'); }catch(err){}
  x.textAlign = 'center';
  x.fillStyle = '#c9a227'; x.font = '700 34px Cinzel, Georgia, serif'; x.fillText('ETERNAL HOARD', W/2, 140);
  x.fillStyle = '#a89e8c'; x.font = '500 30px Cinzel, Georgia, serif'; x.fillText((state.dragonName || '').toUpperCase(), W/2, 860);
  x.fillStyle = '#f0c44a'; x.font = '900 58px Cinzel, Georgia, serif'; x.fillText(e.badge, W/2, 950);
  x.fillStyle = '#ece3d3'; x.font = 'italic 40px Spectral, Georgia, serif'; x.fillText(e.title, W/2, 1015);
  x.font = '600 34px Spectral, Georgia, serif'; x.fillStyle = '#d9a441';
  x.fillText(`${state.wealth} gold   ·   ${state.infamy} infamy   ·   ${state.health} health`, W/2, 1110);
  x.fillStyle = '#6a5d72'; x.font = '500 26px Cinzel, Georgia, serif'; x.fillText(`${ENDING_ORDER.filter(k => META.endings[k]).length} of ${ENDING_ORDER.length} endings discovered`, W/2, 1200);
  const blob = await new Promise(r => cv.toBlob(r, 'image/png'));
  const file = new File([blob], `eternal-hoard-${(state.dragonName||'legend').replace(/\W+/g,'-').toLowerCase()}.png`, {type:'image/png'});
  const text = `${state.dragonName} became ${e.badge} — "${e.title}". Which legend will your dragon become? https://eternalhoard.be`;
  try{
    if(navigator.canShare && navigator.canShare({files:[file]})){ await navigator.share({files:[file], text, title:'Eternal Hoard'}); return; }
  }catch(err){ if(err && err.name === 'AbortError') return; }
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = file.name; a.click(); setTimeout(() => URL.revokeObjectURL(a.href), 3000);
}

/* ════════════ INIT ════════════ */
(function init(){
  applySettings();
  const saved = loadSave();
  if(saved){ state = saved; if(state.phase !== 'naming') UI.screen = 'title'; }
  else state = freshState();
  if(!state.visited.includes(state.node)) state.visited.push(state.node);
  render();
})();

if('serviceWorker' in navigator){
  window.addEventListener('load', () => { navigator.serviceWorker.register('sw.js').catch(() => {}); });
}
</script>
