<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Eternal Hoard – A Dragon's Tale</title>
<meta name="description" content="A branching text RPG. Hatch, hunt, conquer, and choose the legend your dragon becomes.">
<meta name="theme-color" content="#0c0a10">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Eternal Hoard">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700;900&family=Spectral:ital,wght@0,400;0,500;0,600;1,400&display=swap" rel="stylesheet">
<style>
:root{
  --void:#0c0a10; --panel:#17121c; --panel-hi:#211a29; --line:#2e2434;
  --ember:#c1481f; --ember-bright:#e4682f; --gold:#c9a227; --gold-hi:#f0c44a; --gold-dim:#7d6a26;
  --parchment:#ece3d3; --parchment-dim:#a89e8c; --danger:#c43a3a; --ok:#5fbf7a;
  --c-brutality:#e4682f; --c-finesse:#f0c44a; --c-honor:#6ab7ff; --c-cunning:#7ddc8a; --c-disdain:#9a8fb0; --c-curiosity:#b47cff;
  --safe-top:env(safe-area-inset-top,0px); --safe-bot:env(safe-area-inset-bottom,0px);
  --fs:18px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;min-height:100%;background:radial-gradient(ellipse 900px 500px at 50% -10%,rgba(193,72,31,.13),transparent 60%),radial-gradient(ellipse 700px 400px at 90% 100%,rgba(201,162,39,.06),transparent 60%),var(--void);color:var(--parchment);font-family:'Spectral',Georgia,serif;line-height:1.65}
body{overscroll-behavior-y:none}
button{font-family:inherit;color:inherit;cursor:pointer;border:none;background:none}
.ic{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0;display:inline-block;vertical-align:middle}
.ic.lg{width:24px;height:24px}.ic.sm{width:14px;height:14px}
.hidden{display:none!important}
#app{max-width:680px;margin:0 auto;padding:calc(8px + var(--safe-top)) 14px calc(70px + var(--safe-bot));min-height:100vh}

/* ── top bar ── */
.topbar{position:sticky;top:0;z-index:30;display:flex;align-items:center;gap:10px;padding:10px 4px 10px;margin:0 -4px 6px;background:linear-gradient(180deg,rgba(12,10,16,.97) 70%,rgba(12,10,16,0));backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
.tb-name{flex:1;min-width:0}
.tb-title{font-family:'Cinzel',serif;font-weight:700;font-size:15px;letter-spacing:.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--gold-hi)}
.tb-sub{font-size:11px;letter-spacing:2px;text-transform:uppercase;color:var(--parchment-dim)}
.tbtn{width:38px;height:38px;border-radius:12px;display:flex;align-items:center;justify-content:center;border:1px solid var(--line);background:var(--panel);color:var(--parchment-dim)}
.tbtn:active{transform:scale(.93)}
.tbtn.on{color:var(--gold-hi)}

/* ── banner ── */
.banner{position:relative;height:210px;border-radius:18px;overflow:hidden;border:1px solid var(--line);box-shadow:0 18px 40px rgba(0,0,0,.45);margin-bottom:14px;background:#120d10}
.banner .scene-svg,.banner canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
.banner .shade{position:absolute;inset:0;background:linear-gradient(180deg,rgba(12,10,16,0) 35%,rgba(12,10,16,.88) 100%)}
.banner .cap{position:absolute;left:18px;right:18px;bottom:14px}
.eyebrow{font-family:'Cinzel',serif;font-size:11px;letter-spacing:3px;text-transform:uppercase;color:var(--gold)}
.ntitle{font-family:'Cinzel',serif;font-weight:700;font-size:25px;line-height:1.2;margin:2px 0 0;text-shadow:0 2px 12px rgba(0,0,0,.8)}
.banner .hero-dragon{position:absolute;right:4%;bottom:6px;width:58%;max-width:320px;height:92%}
.banner.creation{height:280px}
.banner.creation .hero-dragon{right:50%;transform:translateX(50%);width:78%;max-width:360px;bottom:30px}
.banner.creation .cap{text-align:center}
.dragon-svg{width:100%;height:100%;display:block;overflow:visible}
.breathe{animation:breathe 4.5s ease-in-out infinite;transform-origin:120px 188px}
@keyframes breathe{50%{transform:scale(1.012,1.022)}}
.eyeglow{animation:eye 3.2s ease-in-out infinite}@keyframes eye{50%{opacity:.55}}
.runes{animation:runes 2.6s ease-in-out infinite}@keyframes runes{50%{opacity:.25}}
.drip{animation:drip 2.4s ease-in infinite}@keyframes drip{0%{transform:translateY(0);opacity:1}100%{transform:translateY(18px);opacity:0}}
.smoke{animation:smoke 3s ease-out infinite}@keyframes smoke{0%{transform:translate(0,0);opacity:0}30%{opacity:1}100%{transform:translate(8px,-14px);opacity:0}}
.crack{animation:crack 1.6s ease-in-out infinite}@keyframes crack{50%{stroke:#fff1c2;filter:drop-shadow(0 0 4px #ff8a3d)}}
.pulse{animation:pulse 2.4s ease-in-out infinite}@keyframes pulse{50%{opacity:.4}}
.lava{animation:lava 3s ease-in-out infinite}@keyframes lava{50%{opacity:.45}}
.flick{animation:flick 1.3s steps(2) infinite}@keyframes flick{50%{opacity:.55}}
.ward{animation:ward 6s ease-in-out infinite}@keyframes ward{50%{opacity:.35}}
.flash{animation:flash 9s linear infinite}@keyframes flash{0%,92%,100%{opacity:0}93%{opacity:.35}94%{opacity:0}95%{opacity:.2}}
.ray{animation:ray 5s ease-in-out infinite}@keyframes ray{50%{opacity:.04}}

/* ── ledger ── */
.ledger{display:grid;grid-template-columns:104px 1fr;gap:12px;background:linear-gradient(180deg,var(--panel-hi),var(--panel));border:1px solid var(--line);border-radius:16px;padding:12px 14px;margin-bottom:16px;position:relative}
.ledger.collapsed{grid-template-columns:56px 1fr;padding:8px 12px}
.ledger .portrait{position:relative;cursor:pointer}
.ledger.collapsed .portrait{height:48px}
.ledger .portrait .dragon-svg{height:96px}
.ledger.collapsed .portrait .dragon-svg{height:48px}
.ledger .hoard{margin-top:2px}
.hoard-svg{width:100%;height:auto;display:block}
.hoard-n{text-align:center;font-size:12px;color:var(--gold-hi);font-weight:600;margin-top:-2px}
.ledger.collapsed .hoard,.ledger.collapsed .hoard-n{display:none}
.bars{display:flex;flex-direction:column;gap:7px;justify-content:center;min-width:0}
.ledger.collapsed .bars{gap:3px}
.bar-lbl{display:flex;justify-content:space-between;font-size:11.5px;letter-spacing:.4px;color:var(--parchment-dim);margin-bottom:3px}
.bar-lbl span{display:inline-flex;align-items:center;gap:4px}
.ledger.collapsed .bar-lbl{display:none}
.axis{position:relative;height:7px;border-radius:99px;background:#0f0b13;border:1px solid #2a2030;overflow:hidden}
.ledger.collapsed .axis{height:5px}
.axis .mid{position:absolute;left:50%;top:0;bottom:0;width:1px;background:#4a3d52}
.axis .fill{position:absolute;top:0;bottom:0;border-radius:99px;transition:all .6s cubic-bezier(.3,1.4,.6,1)}
.axis .knob{position:absolute;top:50%;width:11px;height:11px;margin:-5.5px 0 0 -5.5px;border-radius:50%;background:var(--parchment);box-shadow:0 0 8px rgba(255,255,255,.4);transition:left .6s cubic-bezier(.3,1.4,.6,1)}
.ledger.collapsed .axis .knob{width:7px;height:7px;margin:-3.5px 0 0 -3.5px}
.vitals{display:flex;gap:10px;font-size:12px;color:var(--parchment-dim);flex-wrap:wrap}
.vitals b{color:var(--parchment)}
.vitals span{display:inline-flex;align-items:center;gap:4px}
.ledger.collapsed .vitals{display:none}
.lg-toggle{position:absolute;right:8px;top:6px;color:var(--parchment-dim);opacity:.6;padding:4px}

/* ── text & choices ── */
.text{font-size:var(--fs);line-height:1.72}
.text p{margin:0 0 1em}
.text p:first-child::first-letter{font-family:'Cinzel',serif;font-size:2.6em;float:left;line-height:.9;margin:.06em .1em 0 0;color:var(--gold-hi)}
.reveal p{opacity:0;transform:translateY(6px);animation:rv .7s ease forwards}
@keyframes rv{to{opacity:1;transform:none}}
.choices{display:flex;flex-direction:column;gap:10px;margin:22px 0 10px}
.choice{position:relative;text-align:left;width:100%;padding:14px 16px 14px 18px;border-radius:14px;border:1px solid #3a2c40;background:linear-gradient(180deg,#1f1826,#18131d);transition:transform .12s,border-color .2s,background .2s;opacity:0;animation:rv .5s ease forwards}
.choice::before{content:'';position:absolute;left:0;top:12px;bottom:12px;width:3px;border-radius:3px;background:linear-gradient(180deg,var(--ember-bright),var(--gold))}
.choice:hover,.choice:focus-visible{border-color:var(--ember);outline:none}
.choice:active{transform:scale(.985)}
.choice.preview{border-color:var(--gold);background:linear-gradient(180deg,#2a2131,#1d1722);box-shadow:0 0 0 2px rgba(201,162,39,.25)}
.c-label{display:block;font-weight:600;font-size:16.5px;line-height:1.35}
.c-flavor{display:block;font-style:italic;color:var(--parchment-dim);font-size:14.5px;margin-top:3px}
.c-hints{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap}
.c-hint{display:inline-flex;align-items:center;gap:3px;font-size:11px;padding:2px 7px;border-radius:99px;background:#120e16;border:1px solid #2e2434}
.choice.locked{opacity:.55!important;cursor:not-allowed;border-style:dashed}
.choice.locked::before{background:#4a3d52}
.lock-hint{display:inline-flex;align-items:center;gap:5px;font-size:12px;color:var(--gold);margin-top:6px;font-style:normal}
.choice.special::before{background:linear-gradient(180deg,#b47cff,#6ab7ff)}
.special-tag{display:inline-flex;align-items:center;gap:4px;font-size:10.5px;letter-spacing:1px;text-transform:uppercase;color:#c9a9ff;margin-bottom:3px}
.tap-again{display:block;font-size:12px;color:var(--gold-hi);margin-top:6px;font-style:normal}

/* ── outcome ── */
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:2px 0 16px}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:600;padding:6px 11px;border-radius:99px;border:1px solid;opacity:0;animation:chip .45s cubic-bezier(.3,1.6,.6,1) forwards}
@keyframes chip{from{opacity:0;transform:scale(.6)}to{opacity:1;transform:none}}
.btn{display:flex;align-items:center;justify-content:center;gap:9px;width:100%;padding:15px;border-radius:14px;font-family:'Cinzel',serif;font-weight:700;font-size:15px;letter-spacing:1.5px;text-transform:uppercase;background:linear-gradient(135deg,var(--ember),#8f2e14);color:#fff3e6;border:1px solid #e4682f55;box-shadow:0 8px 24px rgba(193,72,31,.3)}
.btn:active{transform:scale(.98)}
.btn.ghost{background:var(--panel);border-color:var(--line);color:var(--parchment-dim);box-shadow:none}
.btn.gold{background:linear-gradient(135deg,#c9a227,#8a6a12);border-color:#f0c44a66;color:#1b1406;box-shadow:0 8px 24px rgba(201,162,39,.25)}
.btn-row{display:flex;gap:10px;margin-top:14px}
.btn-row .btn{flex:1}
.small-btn{display:inline-flex;align-items:center;gap:6px;font-size:13px;color:var(--parchment-dim);padding:8px 4px}

/* ── ending ── */
.badge{display:inline-flex;align-items:center;gap:8px;font-family:'Cinzel',serif;font-weight:900;letter-spacing:3px;font-size:13px;color:#1b1406;background:linear-gradient(135deg,#f0c44a,#a77d1a);padding:7px 14px;border-radius:99px;margin:6px 0 4px;box-shadow:0 0 30px rgba(240,196,74,.35)}
.end-card{text-align:center;margin:10px 0 18px}
.end-card .name{font-family:'Cinzel',serif;font-size:14px;letter-spacing:4px;text-transform:uppercase;color:var(--parchment-dim)}
.end-portrait{width:220px;height:180px;margin:0 auto}
.end-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:16px 0}
.stat-tile{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px;text-align:center}
.stat-tile b{display:block;font-size:20px;font-family:'Cinzel',serif}
.stat-tile small{font-size:11px;color:var(--parchment-dim);letter-spacing:1px;text-transform:uppercase}
.progress-line{font-size:13px;color:var(--parchment-dim);text-align:center;margin:8px 0}

/* ── title / naming ── */
.title-hero{text-align:center;padding:24px 0 6px}
.title-hero h1{font-family:'Cinzel',serif;font-weight:900;font-size:40px;letter-spacing:1px;margin:0;line-height:1.05;background:linear-gradient(180deg,#ffe7a0,#c9a227 60%,#7d5a12);-webkit-background-clip:text;background-clip:text;color:transparent}
.title-hero .sub{font-family:'Cinzel',serif;letter-spacing:5px;font-size:12px;text-transform:uppercase;color:var(--ember-bright);margin-top:6px}
.title-egg{width:220px;height:190px;margin:8px auto}
.name-input{width:100%;padding:14px 16px;border-radius:14px;background:#120e16;border:1px solid #3a2c40;color:var(--parchment);font-family:'Cinzel',serif;font-size:18px;letter-spacing:1px;text-align:center;outline:none}
.name-input:focus{border-color:var(--gold)}
.presets{display:flex;flex-wrap:wrap;gap:7px;justify-content:center;margin:12px 0 18px}
.preset{padding:6px 12px;border-radius:99px;border:1px solid #3a2c40;background:#17121c;font-size:14px;color:var(--parchment-dim)}
.preset.on{border-color:var(--gold);color:var(--gold-hi)}
.divider{text-align:center;font-size:11px;letter-spacing:3px;text-transform:uppercase;color:var(--parchment-dim);margin:14px 0 4px}
.continue-card{display:flex;align-items:center;gap:12px;background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:10px 14px;margin:14px 0}
.continue-card .p{width:84px;height:70px;flex-shrink:0}
.continue-card b{font-family:'Cinzel',serif;color:var(--gold-hi)}
.continue-card small{display:block;color:var(--parchment-dim);font-size:13px}

/* ── overlays ── */
.overlay{position:fixed;inset:0;z-index:100;display:flex;align-items:flex-end;justify-content:center;background:rgba(6,4,8,.72);backdrop-filter:blur(5px);-webkit-backdrop-filter:blur(5px);animation:fade .2s}
@keyframes fade{from{opacity:0}}
.sheet{width:100%;max-width:680px;max-height:90vh;background:#141018;border:1px solid var(--line);border-bottom:none;border-radius:24px 24px 0 0;display:flex;flex-direction:column;animation:up .3s cubic-bezier(.3,1.3,.6,1)}
@keyframes up{from{transform:translateY(60px);opacity:0}}
.sheet-h{display:flex;align-items:center;gap:10px;padding:16px 18px 10px}
.sheet-h h2{flex:1;margin:0;font-family:'Cinzel',serif;font-size:19px;color:var(--gold-hi)}
.sheet-b{padding:4px 18px calc(24px + var(--safe-bot));overflow-y:auto}
.tabs{display:flex;gap:4px;background:#0f0b13;border-radius:12px;padding:4px;margin:0 18px 10px}
.tab{flex:1;padding:8px 4px;border-radius:9px;font-size:12.5px;color:var(--parchment-dim);display:flex;align-items:center;justify-content:center;gap:5px}
.tab.on{background:var(--panel-hi);color:var(--gold-hi)}
.cast{display:flex;gap:12px;padding:12px 0;border-bottom:1px solid #221a28}
.cast:last-child{border-bottom:none}
.sigil{width:44px;height:44px;border-radius:13px;display:flex;align-items:center;justify-content:center;background:radial-gradient(circle at 30% 30%,#3a2c40,#1a1420);border:1px solid #3a2c40;color:var(--gold-hi);flex-shrink:0}
.cast.unknown .sigil{color:#4a3d52}
.cast b{font-family:'Cinzel',serif;font-size:15px}
.cast p{margin:2px 0 0;font-size:14px;color:var(--parchment-dim)}
.cast .st{color:var(--gold);font-style:italic;font-size:13.5px;margin-top:3px}
.tl{position:relative;padding-left:18px}
.tl::before{content:'';position:absolute;left:5px;top:6px;bottom:6px;width:2px;background:#2e2434}
.tl-i{position:relative;padding:6px 0 10px}
.tl-i::before{content:'';position:absolute;left:-17px;top:12px;width:10px;height:10px;border-radius:50%;background:var(--ember);box-shadow:0 0 8px var(--ember)}
.tl-i small{display:block;font-size:11px;letter-spacing:1.5px;text-transform:uppercase;color:var(--parchment-dim)}
.tl-i span{font-size:15px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tile{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:12px;min-height:96px}
.tile.locked{opacity:.45}
.tile .t-ic{width:34px;height:34px;border-radius:10px;display:flex;align-items:center;justify-content:center;background:#241b2b;color:var(--gold-hi);margin-bottom:6px}
.tile.locked .t-ic{color:#5a4d62}
.tile b{display:block;font-family:'Cinzel',serif;font-size:13.5px;line-height:1.3}
.tile small{display:block;font-size:12.5px;color:var(--parchment-dim);margin-top:3px;line-height:1.4}
.set-row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 0;border-bottom:1px solid #221a28}
.set-row b{font-weight:600}
.set-row small{display:block;color:var(--parchment-dim);font-size:13px}
.seg{display:flex;gap:3px;background:#0f0b13;border-radius:10px;padding:3px}
.seg button{padding:6px 11px;border-radius:8px;font-size:13px;color:var(--parchment-dim)}
.seg button.on{background:var(--panel-hi);color:var(--gold-hi)}
.sw{width:46px;height:27px;border-radius:99px;background:#2a2030;position:relative;transition:background .2s;flex-shrink:0}
.sw::after{content:'';position:absolute;top:3px;left:3px;width:21px;height:21px;border-radius:50%;background:#d8cfc0;transition:left .2s}
.sw.on{background:var(--ember)}.sw.on::after{left:22px}
input[type=range]{accent-color:var(--ember);width:120px}

.chapter-card{position:fixed;inset:0;z-index:200;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;background:radial-gradient(ellipse at center,#24121a,#070508 70%);animation:fade .5s;padding:30px}
.chapter-card .num{font-family:'Cinzel',serif;font-weight:900;font-size:84px;line-height:1;background:linear-gradient(180deg,#ffe7a0,#c9a227 55%,#6b4a0e);-webkit-background-clip:text;background-clip:text;color:transparent;animation:rise 1.2s ease}
.chapter-card .lab{font-family:'Cinzel',serif;letter-spacing:6px;text-transform:uppercase;font-size:12px;color:var(--ember-bright);margin-top:10px}
.chapter-card .nm{font-family:'Cinzel',serif;font-size:30px;margin-top:6px;animation:rise 1.4s ease}
.chapter-card .heal{margin-top:22px;font-size:14px;color:var(--ok);display:inline-flex;gap:6px;align-items:center;font-style:italic}
.chapter-card .tap{position:absolute;bottom:calc(30px + var(--safe-bot));font-size:12px;letter-spacing:2px;text-transform:uppercase;color:#6a5d72}
@keyframes rise{from{opacity:0;transform:translateY(14px);letter-spacing:12px}}
.chapter-card.out{animation:fadeout .45s forwards}@keyframes fadeout{to{opacity:0}}

.toast{position:fixed;left:50%;top:calc(14px + var(--safe-top));transform:translateX(-50%);z-index:300;display:flex;align-items:center;gap:10px;background:linear-gradient(135deg,#2a2131,#1a141f);border:1px solid var(--gold-dim);border-radius:14px;padding:10px 16px;box-shadow:0 14px 40px rgba(0,0,0,.6);max-width:calc(100% - 28px);animation:drop .4s cubic-bezier(.3,1.5,.6,1)}
.toast .t-ic{width:36px;height:36px;border-radius:10px;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,#f0c44a,#a77d1a);color:#1b1406;flex-shrink:0}
.toast b{display:block;font-family:'Cinzel',serif;font-size:13.5px;color:var(--gold-hi)}
.toast small{font-size:12.5px;color:var(--parchment-dim)}
@keyframes drop{from{transform:translate(-50%,-30px);opacity:0}}
.vignette{position:fixed;inset:0;pointer-events:none;z-index:250;box-shadow:inset 0 0 120px 40px rgba(196,58,58,.0);transition:box-shadow .15s}
.vignette.hit{box-shadow:inset 0 0 140px 50px rgba(196,58,58,.55)}
.vignette.gold{box-shadow:inset 0 0 140px 40px rgba(240,196,74,.28)}
.shake{animation:shake .45s}@keyframes shake{20%{transform:translateX(-7px)}40%{transform:translateX(6px)}60%{transform:translateX(-4px)}80%{transform:translateX(2px)}}
.coin-fly{position:fixed;z-index:260;width:14px;height:14px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#fff2b3,#d9a441 60%,#8a5d18);pointer-events:none;animation:coin 1s cubic-bezier(.2,.7,.4,1) forwards}
@keyframes coin{to{transform:translate(var(--dx),var(--dy)) scale(.5);opacity:0}}
.footer{display:flex;justify-content:center;margin-top:18px}

.cs-ring{position:absolute;width:34%;aspect-ratio:1;transform:translate(-50%,-50%);border:2px solid;border-radius:50%;z-index:4;animation:ringspin 2.4s linear infinite,fade .5s;box-shadow:0 0 30px currentColor;opacity:.85}
.cs-ring i{position:absolute;inset:14%;border:2px dashed;border-radius:50%;animation:ringspin 1.6s linear infinite reverse}
