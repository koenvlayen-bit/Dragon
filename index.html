            const tier = state.flags.vexarOutcome;
            if(tier === 'victory'){
              return ["You do not meet him head-on. You lead him instead, exactly the way you once led an elder wyrm into a rockslide of your own choosing, using terrain and timing and every hard lesson a war has taught you about making an opponent fight the battle you designed rather than the one they arrived for. By the time Vexar realizes the ridge beneath him was never solid ground to begin with, it is considerably too late to matter.",
              "'You planned this,' he says, half-buried, more impressed than angry. 'The whole approach. You planned this.' You did. It is, you decide, an extremely satisfying thing to confirm out loud."] ;
            }
            if(tier === 'draw'){
              return ["You try every trick a war's worth of enemies has taught you, and he counters more of them than you expected — matching cunning with cunning, feint with feint, until the two of you are more engaged in an increasingly elaborate chess match than an actual fight. Neither of you lands a decisive blow. Both of you, grudgingly, start to enjoy the puzzle of it.",
              "'You've gotten interesting,' Vexar says, disengaging rather than pressing an advantage neither of you quite has. 'That's new too.' You are not entirely sure it was a compliment. You are fairly sure you'll take it as one anyway."] ;
            }
            return ["Your tricks are better than they used to be. They are not, it turns out, quite better than his instincts, which have apparently sharpened just as much as yours have over the same stretch of seasons. He sees through the second feint before you've fully committed to the first, and the fight ends with you outmaneuvered rather than overpowered — a smaller humiliation than last time, but a humiliation nonetheless.",
            "'Good effort,' he says, and for once doesn't sound like he's mocking you. 'You're not the same hatchling. Just... not quite there yet.'"] ;
          } },
        { label:"Let your grown power simply speak for itself", flavor:"No rage, no tricks. Just the calm certainty of what you've become.",
          stats:{axis3:6}, next:"4.1",
          setFlags: (state) => {
            const score = vexarPower(state, 'finesse');
            const tier = score >= 180 ? 'victory' : score >= 120 ? 'draw' : 'defeat';
            return { vexarOutcome: tier, vexarStyle: 'finesse' };
          },
          outcome: (state) => {
            const tier = state.flags.vexarOutcome;
            if(tier === 'victory'){
              return ["You do not rage, and you do not scheme. You simply fight the way everything you've survived since that first humiliating morning taught you to fight — precise, economical, utterly without wasted motion — and Vexar, for the first time in either of your lives, finds himself on the losing end of a fight he was certain he still controlled. It is over almost before he registers that it's begun.",
              "He does not get up right away. When he finally does, he looks at you for a long moment with an expression you have genuinely never seen on him before. 'Well,' he says, quietly. 'That settles that, then.'"] ;
            }
            if(tier === 'draw'){
              return ["You fight with a controlled, unhurried precision that visibly unsettles him more than raw aggression would have — no wasted motion, no opening he can predict, every strike exactly as forceful as it needs to be and no more. It is not enough to finish him. It is more than enough to make him take you seriously for the first time in your life, in a way that has nothing to do with fear.",
              "'You've changed,' he says, retreating to a wary distance rather than closing back in. It is not quite a concession. It is the closest thing to one you have ever heard from him."] ;
            }
            return ["You fight well — better than either of you expected, precise where you used to be merely desperate — and it still, in the end, is not quite enough to close the gap he opened between you the day you were both hatched. He wins, again, though it takes him visibly longer, and he does not gloat about it the way he once might have.",
            "'You're better,' he says, and it costs him something to admit it. 'Not there. But better.' Somehow, this time, that is almost enough to feel like progress."] ;
          } }
      ]
    },

    "4.1": {
      chapterShort:"Chapter Four", chapter:"Chapter Four — The Endgame", part:"Part I",
      title:"The Villain's Castle",
      text: (state) => {
        if(state.flags.sorceressAlive){
          return [
            "The war above ground has barely finished settling into an uneasy quiet when Mirelle finds you again, exactly as she promised she would. She does not waste time on pleasantries. 'Ostrovan was never the true architect of any of this,' she says, unrolling a hand-inked map across the cavern floor. 'He was a puppet, same as the Emperor, same as half this kingdom's council. The hand behind the war belongs to a man who died two hundred years ago and simply never agreed to stay that way — Malvorath Thorne. His citadel sits three days' flight north, warded against everything except, as it turns out, a dragon he never planned for.'",
            "She has spent months mapping his defenses from the shadows, and she means to finish what she started. 'I cannot bring him down alone,' she admits, 'and until an hour ago, I was fairly sure you'd have eaten me before agreeing to help.' She is not entirely wrong to have thought so. But she is here now, and so, unmistakably, is the fortress she is pointing you toward."
          ];
        }
        return [
          "The war above ground has barely finished settling into an uneasy quiet when the truth finally reaches you anyway, pieced together from a captured war-wizard's ravings and the frightened testimony of a goblin scout: Archmage Ostrovan was never the true architect of any of this. He was a puppet, same as the Emperor, same as half the kingdom's council. The hand behind the war belongs to a man who died two hundred years ago and simply never agreed to stay that way — Malvorath Thorne, ruling from a warded black citadel three days' flight to the north.",
          "There is no ally at your side to hand you a map of his defenses this time, no one who has spent months learning his weaknesses from the shadows. Whatever waits behind those walls, you will be finding out the hard way, alone, exactly as you have been since the day you broke out of your shell."
        ];
      },
      choices: [
        { label:"Storm the gates in raw fire and fury", flavor:"A frontal assault. Let the walls answer for the man behind them.",
          stats:{axis1:-16}, health:-18, infamy:10, wealth:50, next:"4.2a",
          outcome: (state) => state.flags.sorceressAlive ? [
            "You do not wait for a clever entrance. You put the citadel's gates to the same test you have put every other obstacle in your life, and Mirelle, to her evident surprise, finds herself improvising wards on the fly to keep the answering counter-spells from taking your head off mid-charge. Between her shields and your fire, Malvorath's outer defenses last considerably less time than two hundred years of preparation should have bought him. You find him at the top of his own tower, furious and, in the end, entirely mortal after all.",
            "His vaults, once you finally breach them, contain two centuries of accumulated hoard — and a great many things Mirelle insists on burning rather than looting, for reasons she does not fully explain and you do not fully press."
          ] : [
            "You do not have a map, so you make your own — straight through the front gates, at speed, before the ancient wards have finished registering what kind of threat has just arrived. It is reckless in exactly the way that only works when the enemy has spent two centuries preparing for everything except this. Malvorath meets you at the top of his own tower, furious that two hundred years of careful defense amounted to a dragon simply refusing to be clever about it, and considerably more mortal than he expected to still be.",
            "His vaults, once breached, contain two centuries of accumulated hoard, and no one left alive to explain what half of it was for."
          ] },
        { label:"Slip through hidden passages and strike from within", flavor:"Patience and precision, striking before he even knows you've arrived.",
          stats:{axis2:18}, health:-6, infamy:4, wealth:60, next:"4.2a",
          outcome: (state) => state.flags.sorceressAlive ? [
            "Mirelle's months of scouting pay for themselves in full. She leads you through a servant's postern gate she mapped weeks ago, past ward-lines she long since learned to read like a second language, and by the time Malvorath realizes his citadel has been breached, you are already three floors above his study rather than pounding uselessly at his front door. He is old, and powerful, and utterly unprepared for an attack that skips every defense he actually built.",
            "'Two hundred years,' Mirelle mutters, stepping over what remains of his wards, 'and it never once occurred to him that patience beats a front door.'"
          ] : [
            "Without a guide, you spend three full days simply watching the citadel from a distance — its patrol patterns, the places its ancient wards seem to thin — before finally finding a crack in defenses built to repel armies rather than a single patient predator. The infiltration that follows is slow, careful, and entirely your own work: no map, no ally, just the same instinct for terrain and timing that once let a hatchling outmaneuver a rival twice its size.",
            "By the time Malvorath realizes his citadel has been breached, you are already standing in his study. Two hundred years of preparation, it turns out, cannot account for patience it never saw coming."
          ] },
        { label:"Overwhelm his wards with controlled, precise power", flavor:"Meet two centuries of dark magic with force worthy of the name.",
          stats:{axis1:16}, health:-10, infamy:6, wealth:55, next:"4.2a",
          outcome: (state) => state.flags.sorceressAlive ? [
            "Mirelle identifies the citadel's oldest, deepest ward-stone from half a mile out — the anchor every other layer of defense is built on — and the two of you spend a long, strange hour testing exactly how much combined force it takes to unmake two centuries of careful spellwork at once. The answer, it turns out, is a dragon at the height of its power and a sorceress who knows precisely where to aim it. The wards fail all at once, cascading, and Malvorath's last line of defense collapses before he has finished raising it.",
            "'I have wanted to do that for eleven years,' Mirelle admits, watching the ward-stone crumble to dust. 'Somehow it is more satisfying with an audience.'"
          ] : [
            "Without anyone to point you toward the citadel's weakest ward, you simply test all of them, methodically, until one finally gives — a slow, grinding hour of controlled, precise power thrown against two centuries of accumulated dark magic, patience matched against patience, until the oldest ward-stone finally cracks and the rest of the defenses cascade down with it. It is not elegant. It is, however, exactly as effective as elegance would have been.",
            "Malvorath's last line of defense collapses in a shower of failing magic, and for the first time in two hundred years, his citadel has nothing left standing between you and him."
          ] }
      ]
    },

    "4.2a": {
      chapterShort:"Chapter Four", chapter:"Chapter Four — The Endgame", part:"Part II",
      title:"Terms, Before the Terms",
      text:[
        "The Emperor has arrived with considerably more ceremony than the situation strictly requires — banners, a herald, an honor guard standing at attention in front of a mountain that has personally dismantled every army this kingdom has sent against it. There is, you decide, time for one exchange before he gets to the actual point."
      ],
      choices: [
        { label:"\"You brought your whole court to watch you lose. Bold.\"", flavor:"Mocking. He clearly can't do anything about it.",
          stats:{axis1:-6}, next:"4.2",
          outcome:["The Emperor does not dignify this with a response, in the specific and very obvious way of a man visibly biting back several responses he has been warned, repeatedly, not to give a dragon. His herald, less disciplined, makes a small strangled noise that might have been a laugh.",
          "You count it as a win regardless."] },
        { label:"\"Let's skip the theater. What do you actually want?\"", flavor:"Pragmatic. Cuts through the pageantry.",
          stats:{axis2:6}, next:"4.2",
          outcome:["Something in the Emperor's shoulders drops a fraction, almost relieved, as though he too has been waiting for someone to skip the part where they both pretend this meeting is anything but a formality. 'Very well,' he says, and for the first time since arriving, sounds like an actual person rather than a title.",
          "This, you suspect, is going to go considerably faster than either of you planned for."] },
        { label:"\"I've eaten kings for less impressive entrances than yours.\"", flavor:"Dark. Threatening. Possibly not even an exaggeration.",
          stats:{axis1:-6}, infamy:4, next:"4.2",
          outcome:["Several members of the honor guard go visibly, uniformly pale. The Emperor, to his credit, does not — though his hand finds the pommel of a ceremonial sword that would accomplish precisely nothing against you, and holds it there anyway, for reasons you suspect are entirely about dignity and not remotely about tactics.",
          "You respect the commitment to the bit, even as everyone around him is quietly recalculating their life choices."] }
      ]
    },

    "4.2": {
      chapterShort:"Chapter Four", chapter:"Chapter Four — The Endgame", part:"Part II",
      title:"The Emperor's Ultimatum",
      text: (state) => {
        const castleLine = " Word of the black citadel's fall has reached the capital ahead of him — the truth of who was really orchestrating this war, and who put an end to it, and it has visibly, uncomfortably reshaped the terms he thought he was arriving to dictate.";
        return [
          "The war is effectively over, and the Emperor himself — not a general, not an envoy, but the crowned ruler of the realm — rides to the base of your mountain under a truce banner, flanked by every surviving lord who still commands soldiers." + castleLine + " He offers you a choice with the flat, exhausted voice of a man who has already lost this war and knows it, on terms far less confident than he intended to bring.",
          "'Total surrender of your mountain and your submission to my crown,' he says, 'or total annihilation — I will burn every forest and empty every treasury of this empire before I let a dragon sit above me unanswered.' It is, of course, an empty threat and he knows you know it, more so now than he'd like to admit. What you do with that knowledge will become the final line of your legend."
        ];
      },
      choices: [
        { label:"Reject the terms, and march on the capital", flavor:"No treaty. You mean to take the throne itself.",
          stats:{axis1:-14}, infamy:12, wealth:20, next:"5.1a",
          outcome:["You do not wait for the Emperor's terms to finish echoing off the mountainside before you have already decided they were never going to be acceptable. He barely clears the treaty ground before you are airborne, angling south toward the one prize that was never actually on the negotiating table: the capital itself, and the throne sitting empty inside it while its ruler wastes time down here bargaining with a dragon who has already made up her mind.",
          "Behind you, the Emperor's truce banner is still fluttering in the wind by the time the capital's watchtowers spot your shadow on the horizon and begin, far too late, to ring every bell they have."] },
        { label:"Sign a treaty of eternal tribute", flavor:"Rule from the shadows of the throne instead of upon it.",
          stats:{axis2:16}, infamy:10, wealth:80, next:"END",
          outcome:["You do not need the capital to burn to get what you actually want. You meet the Emperor's terms with counter-terms of your own — tribute, permanent and substantial, delivered on a schedule you set, in exchange for a peace he is visibly relieved to be offered. He signs before you have finished speaking, and rides back down the mountain having lost a war without ever quite having to admit, out loud, that he lost it.",
          "Power, you have learned, does not always need to look like conquest to function exactly like it."] },
        { label:"Withdraw and become myth, untouchable", flavor:"Vanish from the world of men entirely, and let legend do the rest.",
          stats:{axis3:22}, infamy:-10, next:"END",
          outcome:["You do not answer the Emperor at all — not with fire, not with terms, not with a single word. You simply rise into the high thin air above the treaty banners and climbing lords, and fly, higher and further than any human eye can follow, until the mountain that made you is a rumor even to the people who live in its shadow.",
          "Let them argue over what it meant. Let them build shrines, or watchtowers, or nothing at all. You are no longer answerable to the question of what a dragon owes the world beneath it."] }
      ]
    },

    /* ============ CHAPTER FIVE — THE RECKONING ============ */
    "5.1a": {
      chapterShort:"Chapter Five", chapter:"Chapter Five — The Reckoning", part:"Part I",
      title:"The Captain's Challenge",
      text:[
        "Dame Vaneth has delivered her speech — the cost, the throne, the framing of this whole encounter as a matter of principle rather than survival. It was, you have to admit, a genuinely good speech. There is time, before the fighting starts, to say so, or to say something considerably less generous instead."
      ],
      choices: [
        { label:"\"You've clearly rehearsed that speech. I respect the commitment.\"", flavor:"Wry. Weirdly warm, for a battlefield.",
          stats:{axis3:6}, next:"5.1",
          outcome:["'Several times,' she admits, entirely without embarrassment. 'In a mirror. This morning, in fact.' It is, you decide, an oddly disarming thing to admit moments before what is about to be the largest fight of your life so far.",
          "You like her considerably more than you expected to. It does not change what happens next."] },
        { label:"\"I've survived worse than a Captain with main-character energy.\"", flavor:"Cocky. She does not look impressed.",
          stats:{axis1:-6}, next:"5.1",
          outcome:["Dame Vaneth does not so much as blink. 'Everyone says that,' she says, drawing her sword with the unhurried economy of someone who has heard every possible variation of this line from every possible opponent. 'Statistically, most of them were wrong.'",
          "You are beginning to understand exactly why this woman commands the Royal Guard."] },
        { label:"\"I'd rather not kill your best people today, Captain.\"", flavor:"An honest offer. It won't change her orders, but it's honest.",
          stats:{axis2:-6}, next:"5.1",
          outcome:["Something in her expression shifts — not agreement, not relief, but a flicker of genuine respect she was clearly not expecting to feel today. 'That is, unfortunately, not up to either of us anymore,' she says. 'But I appreciate you saying it before rather than after.'",
          "Small mercies, apparently, still register, even here."] }
      ]
    },

    "5.1": {
      chapterShort:"Chapter Five", chapter:"Chapter Five — The Reckoning", part:"Part I",
      title:"The Palace Guard",
      text:[
        "The capital does not fall the way Oakhaven did, or the way the trade road villages did, or the way anything has fallen to you so far. Its walls are higher, its streets emptied ahead of you by riders who outran your shadow by minutes rather than hours, and waiting at the palace gates is not a garrison of frightened regulars but the kingdom's actual best: the Royal Guard in full ceremonial-turned-battle plate, a corps of court battle-mages already weaving shield-glyphs into the air, and at their head, Dame Iseult Vaneth, Captain of the Guard, whose reputation you have heard even in the highlands, standing utterly still in your path.",
        "'You have already won the war,' she calls up to you, sword still sheathed. 'This is not a battle for the war. This is a battle for whether the throne means anything at all once you're sitting on it. I intend to make that cost as high as I can.'"
      ],
      choices: [
        { label:"Cut through the Royal Guard head-on", flavor:"Overwhelming force against the kingdom's finest. No subtlety required.",
          stats:{axis1:-14}, health:-20, infamy:14, next:(s)=>s.flags.aureliaAlive?'5.2a':'5.2',
          outcome:["You do not accept her framing. You come down on the gate itself rather than the guard formation, and the battle that follows is the largest, longest fight of your entire life — Dame Vaneth's guard trained specifically, it becomes clear, for exactly this scenario, their shield-glyphs absorbing three separate bursts of flame before the mages finally run dry. It costs you dearly: claw-wounds you will carry scars from for the rest of your existence, a wing membrane torn badly enough to ground you for days once this is over.",
          "But it costs the Royal Guard considerably more. By the time the gate finally gives, Dame Vaneth is one of perhaps a dozen still standing, and even she is bleeding from wounds that will end her career, if not quite her life."] },
        { label:"Slip through the old smuggler tunnels beneath the palace", flavor:"Bypass the guard entirely. Let precision do what force would cost too much for.",
          stats:{axis2:16}, health:-8, infamy:4, next:(s)=>s.flags.aureliaAlive?'5.2a':'5.2',
          outcome:["You do not meet Dame Vaneth's guard at all. While her formation braces for an assault that never comes at the front gate, you fold yourself — with considerably more effort than dignity — into the old flood tunnels beneath the palace, the same architecture that has smuggled contraband and desperate nobility out of this city for three centuries, now smuggling something considerably larger in. You emerge inside the palace walls, guard formation entirely behind you, before anyone realizes the siege they prepared for was never going to happen.",
          "Dame Vaneth, to her credit, works this out almost immediately. By the time she reorganizes her guard to intercept you, you are already three courtyards ahead of her."] },
        { label:"Challenge Dame Vaneth to single combat for the gate", flavor:"Meet her offer of a costly fight with a smaller, fairer one.",
          stats:{axis2:-14}, health:-16, infamy:6, next:(s)=>s.flags.aureliaAlive?'5.2a':'5.2',
          outcome:["You take her at her word, and her framing, and land instead of charging — close enough to speak without shouting, far enough that neither of you could call the distance an ambush. 'Winner takes the gate,' you say. 'No guard, no mages. Just us.' She studies you for a long moment, then, to the visible horror of her own lieutenants, sheathes nothing and simply nods. The duel that follows is brutal, honest, and considerably shorter than the battle either of you were braced for — she is extraordinary, and you are still larger, and larger, in the end, is what decides it.",
          "She yields with her sword still in her hand, guard standing down around her without needing to be told twice. It is, you both privately agree, a better ending than the one either army was prepared to give the other."] }
      ]
    },

    "5.2a": {
      chapterShort:"Chapter Five", chapter:"Chapter Five — The Reckoning", part:"Part II",
      title:"One Last Conversation",
      text:[
        "Aurelia has said she has had a great deal of time to think, and that she still hasn't decided what to say. You suspect she is waiting to see what you say first, the way she has been reading you correctly since the day you first took her captive."
      ],
      choices: [
        { label:"\"You've had 'a great deal of time to think.' And?\"", flavor:"Direct. Give her the opening she's clearly waiting for.",
          stats:{axis3:6}, next:"5.2",
          outcome:["'And I still don't fully know,' she admits, and something in the honesty of it lands harder than any prepared speech could have. 'Which is, I think, the single most truthful thing anyone has said in this palace all week — including several sentences I said myself.'",
          "It is not the answer of someone who has already decided how this ends. That, you suspect, is precisely the point."] },
        { label:"\"I could have killed you the day we met. I didn't. Remember that.\"", flavor:"A reminder. Not a threat, exactly. Close, though.",
          stats:{axis2:-6}, next:"5.2",
          outcome:["'I have thought of little else, dragon,' she says, dry as old parchment. 'It has been a genuinely inconvenient thing to be grateful for, given everything that's happened since. You do not get to keep being the reasonable one indefinitely just because you started that way.'",
          "Fair, you decide. Uncomfortably fair."] },
        { label:"\"Careful. Kings have died for less impressive silences than yours.\"", flavor:"An edge. A test, to see if she flinches.",
          stats:{axis1:-6}, next:"5.2",
          outcome:["She does not flinch. 'That,' she says, 'is rather the point of standing here unarmed in front of you instead of running. If I were going to flinch, I would have done it three sentences ago.'",
          "You are, despite the circumstances, thoroughly convinced. It does not make the decision ahead of you any easier."] }
      ]
    },

    "5.2": {
      chapterShort:"Chapter Five", chapter:"Chapter Five — The Reckoning", part:"Part II",
      title:"The Throne Room",
      text: (state) => {
        if(state.flags.aureliaAlive){
          return [
            "You find her exactly where the last of the guard reports say she has been for hours: standing before the throne itself, not sitting on it, dressed for a coronation that clearly hasn't happened yet and now, by the sound of things outside, isn't going to happen the way anyone planned. The Emperor is nowhere in the palace — fled, or worse, in the chaos of the last day — and Aurelia has simply stepped into the vacuum rather than let the throne room sit empty while the kingdom burns around it.",
            "'I wondered if it would be you who finally reached this room,' she says, not moving, not reaching for a weapon she almost certainly has somewhere within reach. 'I have had a great deal of time to think about what I would say to you, if it ever was. I find I still haven't decided.' She is not begging. She is, unmistakably, waiting to see what you actually are, one final time."
          ];
        }
        return [
          "The throne room, when you finally reach it, is not occupied by the princess you might once have expected to find here. There is no Aurelia left to meet you — that reckoning happened long ago, in your own den, in a choice you made seasons before this war even had a name. Instead the room holds what remains of the Council of Regents, seven old men and women in ceremonial robes far too fine for the terror currently written across all of their faces, gathered around an empty throne none of them have the bloodline or the nerve to actually sit in.",
          "The eldest of them, a woman whose hands are shaking badly enough to rattle her own ceremonial chain of office, finds her voice first. 'The line ends with us,' she says. 'There is no one else left to put on that throne. Whatever you intend to do with this kingdom, dragon, you will be doing it without an heir to blame for it.'"
        ];
      },
      choices: (state) => {
        if(state.flags.aureliaAlive){
          return [
            { label:"Kill her, and end the bloodline entirely", flavor:"No heirs, no rivals, no future claimants to the throne you now hold.",
              stats:{axis1:-18}, health:-4, infamy:30, next:"END", setFlags:{aureliaFate:'killed'},
              outcome:["You do not let the moment stretch any longer than it needs to. Whatever she was waiting to see, she sees it, and it is over before she finishes the sentence she was building toward. The throne room, when the guard finally forces itself back inside, is empty of anyone left to contest what you have just become — no bloodline, no rival claim, no inconvenient reminder of a mercy you once considered showing.",
              "The kingdom will spend generations arguing over whether the last Crown Princess died bravely, foolishly, or simply too late to matter. You already know the only answer that will ever actually be settled: she died, and you did not."] },
            { label:"Subjugate her, and rule through her as a puppet queen", flavor:"Let her keep the crown. You keep everything that crown actually controls.",
              stats:{axis2:16}, infamy:14, wealth:20, next:"END", setFlags:{aureliaFate:'puppet'},
              outcome:["You do not kill her, and you do not release her either. You let Aurelia keep the throne, the ceremony, the crown itself — every visible trapping of a rule that now, in every particular that actually matters, answers to a mountain rather than a council. She understands the arrangement before you finish explaining it, and accepts it with the flat, furious clarity of someone who has already calculated that the alternative was worse.",
              "'A puppet queen still needs strings,' she says, taking her seat on the throne for the first time. 'I hope you're prepared to hold them for considerably longer than you think.'"] },
            { label:"Make her your equal, and rule together", flavor:"Not a hostage, not a puppet. An actual partnership of thrones.",
              stats:{axis3:12, axis2:-8}, infamy:-6, next:"5.3", setFlags:{aureliaFate:'ally'},
              outcome:["You do not take the throne, and you do not let her keep it alone either. You offer her something neither the guard outside nor the council once assumed you were capable of offering: a genuine partnership, dragon and crown ruling as equals rather than conqueror and conquered. She studies you for a long moment — the same assessing look she gave you the day you first took her captive, seasons and an entire war ago — and finally, deliberately, extends a hand rather than a plea.",
              "'Then we had better decide, quickly, what kind of rule this is actually going to be,' she says. 'Because half this kingdom already assumes the worst, and the other half hasn't decided yet.'"] }
          ];
        }
        return [
          { label:"Purge the council entirely", flavor:"No regents, no council, no one left to challenge what comes next.",
            stats:{axis1:-14}, infamy:20, next:"END", setFlags:{capitalFate:'purged'},
            outcome:["You do not see much use for seven frightened old aristocrats clinging to titles that no longer describe anything real. It is quick, and thorough, and by the time it is finished the throne room holds no one at all except you and a crown with no head left in the kingdom qualified to wear it — a problem, you decide, that is considerably easier to solve than the one you just finished solving.",
            "The kingdom will need a government eventually. For now, it simply has you, and that, it turns out, is enough to keep it functioning in the short term."] },
            { label:"Let them rule as your terrified vassals", flavor:"A council that governs in name, and answers to you in every particular that matters.",
              stats:{axis2:14}, infamy:8, wealth:15, next:"END", setFlags:{capitalFate:'vassal'},
              outcome:["You do not purge the council. You simply make its actual position extremely clear — they may keep their robes, their titles, their empty ceremonial throne, provided every meaningful decision they make is one you would have made yourself, communicated through channels that never quite need to mention your name directly. The eldest regent, still shaking, understands the arrangement with the particular speed of someone who has just realized how close she came to a considerably worse ending.",
              "'The council will govern,' she says, carefully. 'In your name, if that is what you require.' It is exactly what you require."] }
          ];
      }
    },

    "5.3": {
      chapterShort:"Chapter Five", chapter:"Chapter Five — The Reckoning", part:"Part III",
      title:"The Choice of an Empress",

/* ── Ending logic (v2) ──
   Health 0 still means a legend cut short. Otherwise the ending follows the
   path you closed the saga on, and only then the shape of your character. */
function computeEnding(){
  const {axis1, axis2, axis3, infamy, flags:f} = state;
  if(f.endPath === 'myth') return (axis3 >= 30 && infamy <= 35) ? 'wise' : 'myth';
  if(f.endPath === 'treaty') return (axis2 >= 25 && infamy <= 30) ? 'shadow' : 'treaty';
  if(f.empireFate === 'conqueror') return 'emperor';
  if(infamy >= 65 && axis1 <= -5) return 'tyrant';
  if(axis2 >= 10 && infamy <= 40) return 'shadow';
  if(axis3 >= 8 && axis2 <= 6 && infamy <= 55) return 'wise';
  if(f.empireFate === 'protector') return 'protector';
  if(axis2 <= -20 && infamy <= 45) return 'protector';
  return 'storm';
}

function resolveChoices(node, s = state){ return typeof node.choices === 'function' ? node.choices(s) : node.choices; }
function resolveTitle(node, s = state){ return typeof node.title === 'function' ? node.title(s) : node.title; }
function isLocked(choice, s = state){ return !!(choice.requires && !choice.requires(s)); }
function chapterIndex(nodeId){ const n = STORY.nodes[nodeId]; if(!n) return 6; return ['Chapter One','Chapter Two','Chapter Three','Chapter Four','Chapter Five'].indexOf(n.chapterShort) + 1; }

/* Apply a choice to a state. Returns what actually changed. */
function applyChoiceCore(s, choice){
  const before = { axis1:s.axis1, axis2:s.axis2, axis3:s.axis3, health:s.health, wealth:s.wealth, infamy:s.infamy };
  const st = choice.stats || {};
  s.axis1 = clamp(s.axis1 + (st.axis1||0), -100, 100);
  s.axis2 = clamp(s.axis2 + (st.axis2||0), -100, 100);
  s.axis3 = clamp(s.axis3 + (st.axis3||0), -100, 100);

  // Mirelle's ward softens the next two real blows
  let dh = choice.health || 0, absorbed = 0;
  if(dh < 0 && (s.flags.ward||0) > 0){ absorbed = Math.ceil(-dh / 2); dh += absorbed; s.flags.ward--; }
  s.health = clamp(s.health + dh, 0, 100);
  s.wealth = Math.max(0, s.wealth + (choice.wealth||0));
  s.infamy = clamp(s.infamy + (choice.infamy||0), 0, 100);
  if(choice.requires) s.lockedTaken = (s.lockedTaken||0) + 1;

  const node = STORY.nodes[s.node];
  s.history.push({ node: s.node, chapter: node ? node.chapterShort : '', title: node ? resolveTitle(node, s) : '', label: choice.label });
  if(choice.setFlags){
    const fl = typeof choice.setFlags === 'function' ? choice.setFlags(s) : choice.setFlags;
    Object.assign(s.flags, fl);
  }

  const applied = {
    axis1: s.axis1 - before.axis1, axis2: s.axis2 - before.axis2, axis3: s.axis3 - before.axis3,
    health: s.health - before.health, wealth: s.wealth - before.wealth, infamy: s.infamy - before.infamy, absorbed
  };
  s.phase = 'outcome';
  s.pendingOutcome = resolveText(choice.outcome, s) || [];
  s.pendingImpacts = buildImpacts(applied);
  const nx = typeof choice.next === 'function' ? choice.next(s) : choice.next;
  s.pendingNext = (s.health <= 0) ? "__ending_fallenEarly" : nx;
  return applied;
}

function buildImpacts(a){
  const out = [];
  if(a.axis1 < 0) out.push({k:'brutality', v:-a.axis1}); else if(a.axis1 > 0) out.push({k:'finesse', v:a.axis1});
  if(a.axis2 < 0) out.push({k:'honor', v:-a.axis2});     else if(a.axis2 > 0) out.push({k:'cunning', v:a.axis2});
  if(a.axis3 < 0) out.push({k:'disdain', v:-a.axis3});   else if(a.axis3 > 0) out.push({k:'curiosity', v:a.axis3});
  if(a.health) out.push({k: a.health > 0 ? 'heal' : 'hurt', v:a.health, signed:true});
  if(a.absorbed) out.push({k:'ward', v:a.absorbed});
  if(a.wealth) out.push({k:'hoard', v:a.wealth, signed:true});
  if(a.infamy) out.push({k:'infamy', v:a.infamy, signed:true});
  return out;
}

function continueCore(s){
  let next = s.pendingNext;
  if(next === "END"){ state = s; next = "__ending_" + computeEnding(); }
  // Seasons pass between chapters: wounds close a little
  s.chapterHeal = 0;
  const prevCh = chapterIndex(s.node), nextCh = chapterIndex(next);
  if(nextCh > prevCh && nextCh <= 5 && s.health < 100){ s.chapterHeal = Math.min(10, 100 - s.health); s.health += s.chapterHeal; }
  s.node = next;
  s.phase = 'story';
  s.pendingOutcome = null; s.pendingImpacts = null; s.pendingNext = null;
  if(!s.visited.includes(next)) s.visited.push(next);
}

/* ── Persistence ── */
function migrate(old){
  const s = Object.assign(freshState(), old);
  s.version = 2;
  s.visited = Array.isArray(old.visited) ? old.visited : [old.node];
  s.history = (old.history || []).map(h => typeof h === 'string' ? {node:'', chapter:'', title:'', label:h} : h);
  if(s.pendingImpacts && s.pendingImpacts.length && !s.pendingImpacts[0].k) s.pendingImpacts = [];
  return s;
}
function loadSave(){
  try{
    const raw = localStorage.getItem(SAVE_KEY);
    if(raw) return migrate(JSON.parse(raw));
    const v1 = localStorage.getItem(SAVE_KEY_V1);
    if(v1) return migrate(JSON.parse(v1));
  }catch(e){}
  return null;
}
function saveGame(){ try{ localStorage.setItem(SAVE_KEY, JSON.stringify(state)); }catch(e){} }
function clearSave(){ try{ localStorage.removeItem(SAVE_KEY); localStorage.removeItem(SAVE_KEY_V1); }catch(e){} }

/* Returns newly unlocked achievements */
function checkAchievements(s, endingKey){
  const fresh = [];
  ACHIEVEMENTS.forEach(a => { if(!META.ach[a.id] && a.test(s, endingKey)){ META.ach[a.id] = Date.now(); fresh.push(a); } });
  if(fresh.length) saveMeta();
  return fresh;
}
function unlockAchievement(id){ if(META.ach[id]) return null; META.ach[id] = Date.now(); saveMeta(); return ACHIEVEMENTS.find(a => a.id === id); }
function recordEnding(key){
  const first = !META.endings[key];
  META.endings[key] = (META.endings[key]||0) + 1; META.runs++; saveMeta();
  return first;
}

function dragonLook(s, preview){
  const f = Object.assign({}, s.flags, preview || {});
  const color = f.skinColor || ELEMENT_COLOR[f.element];
  return {
    hatched: !!color,
    color: color || 'storm-grey',
    texture: f.skinTexture || null,
    horns: f.hornType || null,
    tail: f.tailType || null,
    stage: Math.max(1, chapterIndex(s.node)),
    health: s.health,
    eye: eyeColor(s)
  };
}
function eyeColor(s){
  const ax = [['#ff6a2a', -s.axis1], ['#ffd76a', s.axis1], ['#6ab7ff', -s.axis2], ['#7dff8a', s.axis2], ['#b47cff', s.axis3]];
  ax.sort((a, b) => b[1] - a[1]);
  return ax[0][1] > 8 ? ax[0][0] : '#ffcf6a';
}

  else if(look.tail === 'venom') tip = `<g transform="translate(${tipAt[0]} ${tipAt[1]}) rotate(-60)"><path d="M0 0 L-6 -18 L0 -12 L6 -18 Z" fill="${p.dark}"/><path d="M-4 -6 L-12 -4 M4 -6 L12 -4" stroke="${p.dark}" stroke-width="2.6" stroke-linecap="round"/></g><circle cx="${tipAt[0]-14}" cy="${tipAt[1]-6}" r="2.6" fill="#8cff5a" class="drip"/>`;
  else if(look.tail === 'fin') tip = `<path d="M${tipAt[0]+2} ${tipAt[1]+4} C ${tipAt[0]-22} ${tipAt[1]-4}, ${tipAt[0]-22} ${tipAt[1]-34}, ${tipAt[0]+6} ${tipAt[1]-30} C ${tipAt[0]} ${tipAt[1]-18}, ${tipAt[0]+6} ${tipAt[1]-8}, ${tipAt[0]+2} ${tipAt[1]+4}Z" fill="${p.membrane}" stroke="${p.dark}" stroke-width="2"/>`;
  else if(look.tail === 'whip') tip = `<path d="M${tipAt[0]} ${tipAt[1]} l-8 -2 l4 6z" fill="${p.dark}"/>`;
  else tip = `<path d="M${tipAt[0]} ${tipAt[1]} l-10 -6 l12 -4z" fill="${p.dark}"/>`;

  // Horns
  let horns = '';

  else if(look.horns === 'crown') horns = `<g fill="none" stroke="${hc}" stroke-width="4" stroke-linecap="round"><path d="M166 42 L146 18 M156 30 L144 30 M152 25 L150 12"/><path d="M176 40 L170 12 M173 26 L184 18 M171 18 L178 6"/></g>`;

  else horns = `<path d="M164 44 L156 34 L170 40Z M176 40 L172 30 L182 38Z" fill="${hc}" opacity=".8"/>`;

  // Spine ridges for ridged hide
  const ridges = look.texture === 'ridged'
    ? `<g fill="${p.dark}">${[[150,74],[142,88],[132,100],[118,106],[104,108],[90,112],[78,122]].map(([x,y],i)=>`<path d="M${x-6} ${y+4} L${x} ${y-9-(i<3?2:0)} L${x+6} ${y+4}Z"/>`).join('')}</g>` : '';

  const sheen = look.texture === 'leathery' ? `<path d="M80 122 C 100 104, 140 104, 152 116" fill="none" stroke="#fff" stroke-opacity=".22" stroke-width="5" stroke-linecap="round"/>` : '';
  const runes = glow ? `<g fill="none" stroke="${p.accent}" stroke-width="1.6" stroke-linecap="round" class="runes"><path d="M90 128 q8 -6 16 0 t16 0 t16 0"/><path d="M150 84 q6 6 0 12 t0 12"/><path d="M70 150 q-8 6 -14 2"/><circle cx="118" cy="146" r="2.5"/></g>` : '';

  const bodyFill = scales ? `url(#${id}s)` : 'none';

  return `<svg viewBox="0 0 240 200" class="dragon-svg" aria-hidden="true">
    <defs>
      <linearGradient id="${id}b" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${p.body}"/><stop offset="1" stop-color="${p.dark}"/></linearGradient>

      <radialGradient id="${id}eye"><stop offset="0" stop-color="#fff"/><stop offset=".35" stop-color="${look.eye}"/><stop offset="1" stop-color="${look.eye}" stop-opacity="0"/></radialGradient>
      ${scales}
    </defs>
    <ellipse cx="118" cy="188" rx="${70*sc}" ry="${7*sc}" fill="#000" opacity=".45"/>
    <g transform="translate(${120 - 120*sc} ${188 - 188*sc}) scale(${sc})">
     <g ${anim}>
      <!-- far wing -->

      <path d="M132 98 L58 12 M112 92 L54 56 M100 94 L70 76" stroke="${p.dark}" stroke-width="2.2" opacity=".7"/>
      <!-- tail -->
      <path d="${tailPath}" fill="none" stroke="${p.dark}" stroke-width="${look.tail==='whip'?7:13}" stroke-linecap="round"/>
      <path d="${tailPath}" fill="none" stroke="${p.body}" stroke-width="${look.tail==='whip'?4:9}" stroke-linecap="round"/>
      ${tip}
      <!-- hind leg -->
      <path d="M80 140 C 72 158, 80 176, 96 180 L112 182 L110 174 L100 170 C 98 160, 100 150, 98 140Z" fill="${p.dark}"/>
      <!-- body -->
      <path d="M70 140 C 66 112, 96 98, 128 100 C 152 102, 160 120, 156 142 C 152 164, 128 176, 104 174 C 84 172, 72 160, 70 140Z" fill="url(#${id}b)" stroke="${p.dark}" stroke-width="2"/>
      <path d="M70 140 C 66 112, 96 98, 128 100 C 152 102, 160 120, 156 142 C 152 164, 128 176, 104 174 C 84 172, 72 160, 70 140Z" fill="${bodyFill}"/>
      <!-- belly plates -->
      <path d="M118 170 C 136 168, 150 156, 152 138 C 148 150, 134 160, 116 162Z" fill="${p.belly}" opacity=".9"/>
      <!-- neck -->
      <path d="M128 104 C 136 86, 146 70, 160 58 L176 66 C 166 76, 158 92, 154 112 C 150 120, 136 118, 128 104Z" fill="url(#${id}b)" stroke="${p.dark}" stroke-width="2"/>
      <path d="M154 112 C 158 92, 164 78, 174 68" fill="none" stroke="${p.belly}" stroke-width="6" stroke-linecap="round" stroke-dasharray="4 3" opacity=".85"/>
      ${ridges}
      <!-- head -->
      <g class="head">
        ${horns}
        <path d="M156 46 C 168 36, 186 38, 196 46 L214 54 C 218 56, 218 62, 212 64 L196 66 C 188 72, 172 74, 162 68 C 152 62, 150 52, 156 46Z" fill="url(#${id}b)" stroke="${p.dark}" stroke-width="2"/>
        <path d="M196 66 L210 66 L198 72 C 190 74, 182 74, 176 71Z" fill="${p.dark}"/>
        <path d="M200 64 l2 4 l3-4 M192 66 l2 4 l3 -4" fill="#f4efe2"/>
        <circle cx="208" cy="55" r="1.6" fill="${p.dark}"/>
        <circle cx="181" cy="51" r="7" fill="url(#${id}eye)" class="eyeglow"/>
        <path d="M176 51 Q181 47 186 51 Q181 55 176 51Z" fill="${look.eye}"/>
        <path d="M181 48.5 L181 53.5" stroke="#120d0a" stroke-width="1.6" stroke-linecap="round"/>
        <path d="M172 45 L190 44" stroke="${p.dark}" stroke-width="2.4" stroke-linecap="round"/>
      </g>
      <!-- near wing (folded) -->
      <path d="M118 112 C 110 92, 96 80, 78 74 C 84 86, 84 96, 76 104 C 92 104, 100 112, 98 124 C 106 118, 114 118, 118 112Z" fill="url(#${id}w)" stroke="${p.dark}" stroke-width="2"/>

      ${opts.smoke ? `<g class="smoke"><circle cx="216" cy="52" r="3" fill="#bbb" opacity=".35"/><circle cx="222" cy="46" r="4" fill="#bbb" opacity=".25"/><circle cx="228" cy="38" r="5" fill="#bbb" opacity=".15"/></g>` : ''}
     </g>
    </g>
  </svg>`;
}

function sky(id, a, b, c){ return `<linearGradient id="${id}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${a}"/><stop offset=".6" stop-color="${b}"/><stop offset="1" stop-color="${c}"/></linearGradient>`; }
function ridge(seed, y, amp, color, n = 10){
  let d = `M0 200 L0 ${y}`; let r = seed;
  const rnd = () => (r = (r * 9301 + 49297) % 233280) / 233280;
  for(let i = 1; i <= n; i++){ const x = i * 400 / n; d += ` L${x - 400/n/2} ${y - amp * rnd()} L${x} ${y - amp*0.35*rnd()}`; }
  return `<path d="${d} L400 200Z" fill="${color}"/>`;
}

/* ── The hoard: a pile that grows with your gold ── */
function hoardSVG(w){
  const h = Math.min(1, Math.log10(1 + Math.max(0, w)) / Math.log10(400));
  const top = 58 - h * 44;
  const coins = Math.round(4 + h * 26);
  let c = '';
  for(let i = 0; i < coins; i++){
    const x = 14 + ((i * 37) % 92), yy = 60 - ((i * 13) % Math.max(4, Math.round(h * 40)));
    if(yy >= top + 4) c += `<ellipse cx="${x}" cy="${yy}" rx="4.4" ry="1.8" fill="${i%5===0?'#fff2b3':'#f2c04e'}" stroke="#8a5d18" stroke-width=".6"/>`;
  }
  const gems = h > .35 ? `<path d="M46 ${top+10} l4 -5 l4 5 l-4 5z" fill="#ff4d6d"/><path d="M76 ${top+14} l3 -4 l3 4 l-3 4z" fill="#5ad1ff"/>` : '';
  const crown = h > .75 ? `<path d="M56 ${top-2} l3 -7 l4 4 l4 -6 l4 6 l4 -4 l3 7z" fill="#ffd95a" stroke="#8a5d18" stroke-width=".6"/>` : '';
  return `<svg viewBox="0 0 120 64" class="hoard-svg" aria-hidden="true"><path d="M2 64 Q60 ${top-6} 118 64Z" fill="#b8862b"/><path d="M14 64 Q60 ${top+4} 106 64Z" fill="#d9a441"/>${c}${gems}${crown}</svg>`;
}

function dragonArt(look, size = 'full', opts = {}){
  if(!look.hatched) return `<img class="dragon-img egg" src="art/egg.webp" alt="" draggable="false">`;
  const horns = look.horns || 'none';
  const sc = opts.fixedScale || [.8, .8, .87, .94, 1, 1, 1][look.stage] || 1;
  const cls = ['dragon-img', look.texture === 'strange' ? 'glow' : '', look.health < 30 ? 'wounded' : ''].join(' ');
  return `<img class="${cls}" style="--sc:${sc}" src="art/d-${look.color}-${horns}${size === 'sm' ? '-sm' : ''}.webp" alt="" draggable="false">`;
}
const HIDE_NAME = { armored:'Armoured scales', ridged:'Ridged plates', leathery:'Leathery hide', strange:'Glowing hide' };
const TAIL_NAME = { club:'Club tail', whip:'Whip tail', venom:'Venom barb', fin:'Fin tail' };
function medals(look, big){
  const m = [];
  if(look.texture) m.push(`<div class="medal ${big ? 'big' : ''}" title="${HIDE_NAME[look.texture]}"><img src="art/hide-${look.texture}.webp" alt="">${big ? `<span>${HIDE_NAME[look.texture]}</span>` : ''}</div>`);

  return m.length ? `<div class="medals">${m.join('')}</div>` : '';
}

const CS = { skip:false, running:false };
const csWait = (ms) => new Promise(r => { const t0 = performance.now(); const tick = () => { if(CS.skip || performance.now() - t0 >= ms) r(); else requestAnimationFrame(tick); }; tick(); });

function enemyHTML(kind){
  if(kind === 'vexar' || kind === 'infernus'){
    const col = kind === 'infernus' ? 'gold-bronze' : (state.flags.skinColor === 'obsidian' ? 'crimson' : 'obsidian');
    const horns = kind === 'infernus' ? 'crown' : 'spike';
    return `<img src="art/d-${col}-${horns}.webp" class="cs-enemy-img ${kind}" alt="">`;
  }
  return ENEMY_SVG[kind] || '';
}

function shouldPlayCutscene(nodeId, idx){
  const c = CUTSCENES[nodeId];
  return !!(c && c.acts[idx] && SETTINGS.cutscenes !== false && !SETTINGS.reduce);
}

async function playCutscene(nodeId, idx){
  const def = CUTSCENES[nodeId], [act, lines] = def.acts[idx];
  CS.skip = false; CS.running = true;
  const look = dragonLook(state);
  const el = document.createElement('div'); el.className = 'cs';
  el.innerHTML = `<div class="cs-stage" id="cs-stage">
      <div class="cs-bg">${sceneSVG(def.scene)}</div>
      <div class="cs-sun"></div>
      <div class="cs-enemy ${def.enemy}" id="cs-enemy">${enemyHTML(def.enemy)}</div>
      <div class="cs-hero" id="cs-hero">${dragonArt(look, 'full')}</div>
      <canvas class="cs-fx" id="cs-fx"></canvas>
      <div class="cs-flash" id="cs-flash"></div>
      <div class="cs-cap" id="cs-cap"></div>
    </div>
    <button class="cs-skip" id="cs-skip">Skip ${icon('arrow','sm')}</button>`;
  document.body.appendChild(el);
  el.addEventListener('click', () => { CS.skip = true; });
  const stage = $('cs-stage'), hero = $('cs-hero'), enemy = $('cs-enemy'), flash = $('cs-flash'), cap = $('cs-cap');
  const fx = new CSFX($('cs-fx'));
  const anim = (node, frames, ms, easing = 'cubic-bezier(.3,.8,.3,1)') => CS.skip ? null : node.animate(frames, {duration: ms, easing, fill: 'forwards'});
  const say = (txt) => { cap.innerHTML = `<span>${esc(txt)}</span>`; };
  const boom = (strength = 1) => {
    if(CS.skip) return;
    flash.animate([{opacity: .85 * strength}, {opacity: 0}], {duration: 380, easing: 'ease-out'});
    stage.animate([{transform:'translate(0,0)'}, {transform:`translate(${-10*strength}px,${6*strength}px)`}, {transform:`translate(${9*strength}px,${-5*strength}px)`}, {transform:`translate(${-4*strength}px,${2*strength}px)`}, {transform:'translate(0,0)'}], {duration: 420});
    try{ navigator.vibrate && navigator.vibrate(40 * strength); }catch(e){}
  };
  // positions (fractions of the stage) for effects; measured once everyone is in place
  const P = { mouth:[.55,.52], foe:[.78,.6] };
  const measure = () => {
    const sr = stage.getBoundingClientRect(), img = hero.querySelector('img');
    { const r = hero.getBoundingClientRect(); P.mouth = [(r.left + r.width*.95 - sr.left)/sr.width, (r.top + r.height*.6 - sr.top)/sr.height]; }
    const er = enemy.getBoundingClientRect(); P.foe = [(er.left + er.width*.5 - sr.left)/sr.width, (er.top + er.height*.55 - sr.top)/sr.height];
  };

  // ── entrance ──
  anim(stage.querySelector('.cs-bg'), [{transform:'scale(1.15)'}, {transform:'scale(1.02)'}], 6000, 'linear');
  anim(hero, [{transform:'translateX(-60%)', opacity:0}, {transform:'translateX(0)', opacity:1}], 700);
  anim(enemy, [{transform:'translateX(40%)', opacity:0}, {transform:'translateX(0)', opacity:1}], 800);
  say(lines[0]);
  await csWait(2000);
  measure();

  // ── the act itself ──
  switch(act){
    case 'fire':
      anim(hero, [{transform:'translateX(0) scale(1)'}, {transform:'translateX(4%) scale(1.04)'}], 300);
      fx.fire(P.mouth, P.foe, 1300); await csWait(500); boom(.6);
      anim(enemy, [{filter:'brightness(1)'}, {filter:'brightness(1.8) sepia(.8) saturate(3) hue-rotate(-20deg)'}, {filter:'brightness(.7)'}], 1000);
      await csWait(500); say(lines[1]); await csWait(500);
      anim(enemy, [{transform:'translateX(0)', opacity:1}, {transform:'translateX(14%)', opacity:.35}], 700); break;
    case 'clash':
      anim(hero, [{transform:'translateX(0)'}, {transform:'translateX(22%) scale(1.05)'}], 320, 'cubic-bezier(.6,0,.9,.4)');
      anim(enemy, [{transform:'translateX(0)'}, {transform:'translateX(-10%)'}], 320, 'cubic-bezier(.6,0,.9,.4)');
      await csWait(320); boom(1); fx.sparks([.62,.52], 60); await csWait(250);
      fx.fire(P.mouth.map((v, i) => i ? v : v + .15), P.foe, 700);
      say(lines[1]); await csWait(500);
      if(def.lose){ anim(hero, [{transform:'translateX(22%)'}, {transform:'translateX(-18%) rotate(-6deg)'}], 600); boom(.7); }
      else { anim(hero, [{transform:'translateX(22%)'}, {transform:'translateX(6%)'}], 500); anim(enemy, [{transform:'translateX(-10%)', opacity:1}, {transform:'translateX(16%)', opacity:.3}], 700); }
      break;
    case 'feint': case 'shadow':
      fx.smoke([.3,.62], 40);
      anim(hero, [{opacity:1, filter:'brightness(1)'}, {opacity:0, filter:'brightness(.1)'}], 500); await csWait(700);
      say(lines[1]);
      hero.style.left = '30%';
      anim(hero, [{opacity:0, transform:'translateX(10%)'}, {opacity:1, transform:'translateX(0)'}], 250); await csWait(250);
      fx.slash([.62,.3], [.9,.78]); boom(.8); fx.sparks([.76,.52], 40);
      if(def.lose){ await csWait(300); anim(hero, [{transform:'translateX(0)'}, {transform:'translateX(-40%) rotate(-8deg)', opacity:.6}], 600); }
      else anim(enemy, [{transform:'translateX(0) rotate(0)'}, {transform:'translateX(10%) rotate(6deg)', opacity:.4}], 700);
      break;
    case 'retreat':
      anim(enemy, [{transform:'scale(1)'}, {transform:'scale(1.15)'}], 500); fx.fire([.72,.42], [.4,.55], 700, true); boom(.5);
      await csWait(600); say(lines[1]);
      anim(hero, [{transform:'translateX(0)', opacity:1}, {transform:'translateX(-70%)', opacity:0}], 900, 'ease-in'); break;
    case 'rockslide':
      fx.rocks([.6,.95], 1400); await csWait(500); boom(1); await csWait(400); boom(.7); say(lines[1]);
      anim(enemy, [{filter:'brightness(1)', transform:'translateY(0)'}, {filter:'brightness(.35)', transform:'translateY(10%)', opacity:.5}], 900);
      fx.smoke([.76,.8], 50); break;
    case 'sunlight':
      anim(stage.querySelector('.cs-sun'), [{opacity:0}, {opacity:1}], 1400, 'ease-in');
      anim(enemy, [{transform:'translateX(0)'}, {transform:'translateX(-12%)'}], 900);
      await csWait(1100); say(lines[1]);
      anim(enemy, [{filter:'none'}, {filter:'grayscale(1) brightness(.9) contrast(1.3)'}], 700); boom(.4);
      fx.sparks([.7,.5], 30, '#fff3c2'); break;
    case 'horde':
      spawnGoblins(stage, 16); await csWait(900); fx.pots([.2,.9], P.foe, 6); await csWait(600); boom(.7); say(lines[1]);
      anim(enemy, [{transform:'translateX(0)', opacity:1}, {transform:'translateX(12%) rotate(5deg)', opacity:.35}], 900); break;
    case 'magic':
      ring(stage, P.foe, '#b07cff'); await csWait(500); fx.beam(P.mouth, P.foe, '#c69cff', 1100); await csWait(600);
      anim(enemy, [{filter:'none'}, {filter:'hue-rotate(220deg) saturate(2) brightness(1.2)'}], 600); say(lines[1]);
      fx.sparks(P.foe, 50, '#d9b8ff'); boom(.5); break;
    case 'strafe':
      anim(hero, [{transform:'translate(-40%,-30%) scale(.55)', opacity:1}, {transform:'translate(120%,-30%) scale(.55)', opacity:1}], 1800, 'ease-in-out');
      fx.rain([.25,.95], [.35,.85], 1500); await csWait(700); boom(.6); await csWait(500); say(lines[1]); boom(.6); break;
    case 'soar':
      anim(hero, [{transform:'translate(0,0) scale(1)'}, {transform:'translate(10%,-48%) scale(.45)'}], 1400, 'ease-out');
      anim(enemy, [{transform:'translate(0,0)'}, {transform:'translate(-6%,-18%)'}, {transform:'translate(4%,12%)', opacity:.45}], 2000, 'ease-in-out');
      await csWait(1100); say(lines[1]); break;
    case 'duel':
      anim(hero, [{transform:'translateX(0)'}, {transform:'translateX(14%)'}], 300); await csWait(300); boom(.8); fx.sparks([.6,.5], 50, '#e8f0ff');
      await csWait(400); flash.style.background = '#c43a3a'; boom(.6); await csWait(300); flash.style.background = '#fff';
      say(lines[1]); fx.fire(P.mouth.map((v, i) => i ? v : v + .1), P.foe, 800);
      anim(enemy, [{transform:'translateX(0)', opacity:1}, {transform:'translateX(14%) rotate(8deg)', opacity:.4}], 800); break;
    case 'power':
      anim(hero, [{transform:'scale(1)', filter:'drop-shadow(0 0 0 #ffcf6a)'}, {transform:'scale(1.12)', filter:'drop-shadow(0 0 26px #ffcf6a)'}], 1100);
      fx.sparks([.35,.55], 70, '#ffe08a'); await csWait(900); say(lines[1]); boom(.5); break;
    case 'word':
      await csWait(300); boom(1.2);
      stage.querySelectorAll('.cs-wards ellipse').forEach((e, i) => e.animate([{transform:'scale(1)', opacity:.6}, {transform:`scale(${1.3 + i*.2})`, opacity:0}], {duration:900, delay:i*120, fill:'forwards'}));
      fx.sparks([.72,.55], 80, '#d9b8ff'); say(lines[1]); await csWait(600);
      anim(enemy, [{filter:'none'}, {filter:'brightness(.5)'}], 600); break;
    case 'batter':
      for(let i = 0; i < 3 && !CS.skip; i++){
        anim(hero, [{transform:'translateX(0)'}, {transform:'translateX(16%)'}, {transform:'translateX(0)'}], 380, 'ease-in-out');
        await csWait(200); boom(.9); fx.rocks([.68,.82], 300, true); await csWait(260);
      }
      say(lines[1]); anim(enemy, [{transform:'translateY(0)'}, {transform:'translateY(6%)', filter:'brightness(.6)'}], 500); break;
    case 'phase':
      anim(hero, [{filter:'none', opacity:1}, {filter:'drop-shadow(0 0 16px #7fe8ff) brightness(1.3)', opacity:.7}], 600);
      await csWait(500); anim(hero, [{transform:'translateX(0)'}, {transform:'translateX(38%)'}], 1300, 'ease-in-out');
      stage.querySelectorAll('.cs-wards ellipse').forEach(e => e.animate([{opacity:.6}, {opacity:.1}, {opacity:.6}, {opacity:.15}], {duration:1300}));
      await csWait(800); say(lines[1]); break;
    case 'dive':
      hero.style.opacity = 0; await csWait(150);
      anim(hero, [{transform:'translate(-30%,-90%) rotate(30deg) scale(.7)', opacity:1}, {transform:'translate(35%,0) rotate(8deg) scale(1)', opacity:1}], 650, 'cubic-bezier(.7,0,1,.6)');
      await csWait(650); boom(1.2); fx.sparks([.7,.7], 70); say(lines[1]);
      anim(enemy, [{transform:'translateY(0)', opacity:1}, {transform:'translateY(10%)', opacity:.3}], 700); break;
    case 'flank':
      anim(hero, [{transform:'translate(-50%,8%) scale(.8)'}, {transform:'translate(70%,8%) scale(.8)'}], 1500, 'ease-in-out');
      fx.fire([.2,.8], [.95,.86], 1300); await csWait(800); boom(.7); say(lines[1]); break;
  }

  // ── the rematch with Vexar ends the way the dice fell ──
  if(def.result && !CS.skip){
    await csWait(400);
    const r = state.flags.vexarOutcome;
    if(r === 'victory'){ say('Vexar yields.'); anim(enemy, [{transform:'translateX(0)', opacity:1}, {transform:'translateX(10%) translateY(8%) rotate(4deg)', opacity:.5}], 800); }
    else if(r === 'defeat'){ say('Not yet. Not quite yet.'); anim(hero, [{transform:'translateX(0)'}, {transform:'translateX(-24%) rotate(-6deg)', opacity:.6}], 800); boom(.6); }
    else { say('Neither of you gives an inch.'); anim(hero, [{transform:'translateX(0)'}, {transform:'translateX(-8%)'}], 700); anim(enemy, [{transform:'translateX(0)'}, {transform:'translateX(8%)'}], 700); }
  }

  await csWait(2400);
  fx.stop();
  el.classList.add('cs-out');
  await new Promise(r => setTimeout(r, CS.skip ? 120 : 420));
  el.remove(); CS.running = false;
}

/* Particle effects for cutscenes */
class CSFX {
  constructor(cv){
    this.cv = cv; this.ps = []; this.alive = true; this.lines = [];
    const dpr = Math.min(2, window.devicePixelRatio || 1); this.dpr = dpr;
    cv.width = cv.clientWidth * dpr; cv.height = cv.clientHeight * dpr;
    this.ctx = cv.getContext('2d');
    const loop = () => { if(!this.alive) return; this.step(); requestAnimationFrame(loop); };
    loop();
  }
  W(){ return this.cv.width; } H(){ return this.cv.height; }
  add(p){ this.ps.push(Object.assign({life:1, decay:.02, r:3, g:0, glow:0}, p)); }
  fire(from, to, ms, reverse){
    const t0 = performance.now(), W = this.W(), H = this.H();
    const emit = () => {
      if(!this.alive || performance.now() - t0 > ms) return;
      for(let i = 0; i < 9; i++){
        const sx = from[0]*W, sy = from[1]*H, tx = to[0]*W, ty = to[1]*H;
        const ang = Math.atan2(ty - sy, tx - sx) + (Math.random() - .5) * .35, sp = (9 + Math.random()*7) * this.dpr;
        this.add({x:sx, y:sy, vx:Math.cos(ang)*sp, vy:Math.sin(ang)*sp, r:(4 + Math.random()*8)*this.dpr, decay:.022 + Math.random()*.02, grow:.25*this.dpr,
          col: reverse ? ['#b48cff','#7a4dff','#e0c8ff'][i%3] : ['#fff1b0','#ffb347','#ff6a1a','#ff3d00'][i%4], glow:18});
      }
      requestAnimationFrame(emit);
    };
    emit();
  }
  beam(from, to, col, ms){ this.lines.push({from, to, col, t0:performance.now(), ms}); for(let i = 0; i < 30; i++) setTimeout(() => this.sparks(to, 3, col), i*30); }
  sparks(at, n, col){ const x = at[0]*this.W(), y = at[1]*this.H();
    for(let i = 0; i < n; i++){ const a = Math.random()*6.28, sp = (3 + Math.random()*9)*this.dpr;
      this.add({x, y, vx:Math.cos(a)*sp, vy:Math.sin(a)*sp - 2*this.dpr, g:.25*this.dpr, r:(1 + Math.random()*2.2)*this.dpr, decay:.025, col: col || ['#fff7d6','#ffd166','#ff9a3d'][i%3], glow:10}); } }
  smoke(at, n){ const x = at[0]*this.W(), y = at[1]*this.H();
    for(let i = 0; i < n; i++) this.add({x:x + (Math.random()-.5)*80*this.dpr, y:y + (Math.random()-.5)*40*this.dpr, vx:(Math.random()-.5)*1.2*this.dpr, vy:-Math.random()*1.4*this.dpr, r:(14 + Math.random()*26)*this.dpr, grow:.4*this.dpr, decay:.012, col:'rgba(40,34,40,.55)'}); }
  rocks(xr, ms, burst){ const t0 = performance.now(), W = this.W(), H = this.H();
    const emit = () => { if(!this.alive || performance.now() - t0 > ms) return;
      for(let i = 0; i < (burst ? 6 : 3); i++) this.add({x:(xr[0] + Math.random()*(xr[1]-xr[0]))*W, y: burst ? H*.7 : -20, vx:(Math.random()-.5)*(burst ? 10 : 2)*this.dpr, vy:(burst ? -6 - Math.random()*6 : 4 + Math.random()*6)*this.dpr, g:.5*this.dpr, r:(4 + Math.random()*9)*this.dpr, decay:.012, col:['#5a4a40','#3a302a','#7a6656'][i%3], rock:true});
      requestAnimationFrame(emit); };
    emit(); }
  rain(xr, yr, ms){ const t0 = performance.now(), W = this.W(), H = this.H();
    const emit = () => { if(!this.alive || performance.now() - t0 > ms) return;
      for(let i = 0; i < 5; i++) this.add({x:(xr[0] + Math.random()*(xr[1]-xr[0]))*W, y:H*.1, vx:(Math.random()-.3)*2*this.dpr, vy:(9 + Math.random()*6)*this.dpr, r:(3 + Math.random()*6)*this.dpr, decay:.018, col:['#ffb347','#ff6a1a','#fff1b0'][i%3], glow:16, floor:(yr[0] + Math.random()*(yr[1]-yr[0]))*H});
      requestAnimationFrame(emit); };
    emit(); }
  pots(from, to, n){ for(let i = 0; i < n; i++) setTimeout(() => { if(!this.alive) return; const W = this.W(), H = this.H();
      const sx = (from[0] + Math.random()*.25)*W, sy = from[1]*H, tx = (to[0] + (Math.random()-.5)*.15)*W, ty = to[1]*H, T = 40;
      this.add({x:sx, y:sy, vx:(tx - sx)/T, vy:(ty - sy)/T - .5*.35*this.dpr*T, g:.35*this.dpr, r:5*this.dpr, decay:1/T, col:'#ff9a3d', glow:14, onEnd:[to[0], to[1]]}); }, i*120); }
  slash(a, b){ this.lines.push({from:a, to:b, col:'#ffffff', t0:performance.now(), ms:300, w:6}); }
  step(){
    const c = this.ctx, W = this.W(), H = this.H(); c.clearRect(0, 0, W, H);
    c.globalCompositeOperation = 'lighter';
    const now = performance.now();
    this.lines = this.lines.filter(l => now - l.t0 < l.ms);
    this.lines.forEach(l => { const k = 1 - (now - l.t0)/l.ms; c.strokeStyle = l.col; c.globalAlpha = k; c.lineWidth = (l.w || 5 + Math.random()*4)*this.dpr; c.shadowColor = l.col; c.shadowBlur = 20*this.dpr;
      c.beginPath(); c.moveTo(l.from[0]*W, l.from[1]*H); c.lineTo(l.to[0]*W, l.to[1]*H); c.stroke(); });
    const next = [];
    for(const p of this.ps){
      p.x += p.vx; p.y += p.vy; p.vy += p.g; p.r += (p.grow || 0); p.life -= p.decay;
      if(p.floor && p.y > p.floor){ this.sparks([p.x/W, p.y/H], 4); p.life = 0; }
      if(p.life <= 0){ if(p.onEnd){ this.sparks(p.onEnd, 14); this.fire([p.onEnd[0], p.onEnd[1] + .05], [p.onEnd[0], p.onEnd[1] - .1], 120); } continue; }
      c.globalCompositeOperation = (p.rock || p.col.startsWith('rgba')) ? 'source-over' : 'lighter';
      c.globalAlpha = Math.max(0, Math.min(1, p.life)); c.fillStyle = p.col; c.shadowColor = p.col; c.shadowBlur = p.glow ? p.glow*this.dpr : 0;
      c.beginPath(); c.arc(p.x, p.y, Math.max(.5, p.r), 0, 6.283); c.fill();
      next.push(p);
    }
    this.ps = next; c.globalAlpha = 1; c.shadowBlur = 0;
  }
  stop(){ this.alive = false; }
}

const FX = {
  raf:null, cv:null,
  stop(){ cancelAnimationFrame(this.raf); this.raf = null; this.cv = null; },
  start(cv, type){
    this.stop(); if(!cv || SETTINGS.reduce) return;
    this.cv = cv; const ctx = cv.getContext('2d');
    const dpr = Math.min(2, window.devicePixelRatio || 1);
    const resize = () => { cv.width = cv.clientWidth * dpr; cv.height = cv.clientHeight * dpr; };
    resize();
    const W = () => cv.width, H = () => cv.height;
    const cfg = {
      embers:{n:42, col:['#ff8a3d','#ffb15c','#ff5a1a'], r:[1,2.6], vx:[-.25,.25], vy:[-.9,-.3], glow:12, from:'bottom'},
      fireflies:{n:18, col:['#e4ff8a','#ffe58a'], r:[1.2,2.2], vx:[-.25,.25], vy:[-.2,.2], glow:10, blink:true},
      smoke:{n:12, col:['rgba(160,150,150,.10)'], r:[14,34], vx:[-.15,.15], vy:[-.35,-.1], from:'bottom'},
      snow:{n:70, col:['#ffffff','#dfe8ff'], r:[.8,2.2], vx:[-.4,.1], vy:[.4,1.1], from:'top'},
      glitter:{n:28, col:['#fff2b3','#ffd95a'], r:[.8,1.8], vx:[0,0], vy:[0,0], glow:8, blink:true, area:[.55,1]},
      ash:{n:50, col:['#6b5a52','#8a6a5a','#ff7a3d'], r:[.8,2], vx:[-.3,.3], vy:[.2,.7], from:'top'},
      dust:{n:30, col:['rgba(255,231,168,.5)'], r:[.6,1.6], vx:[-.15,.15], vy:[-.1,.1], blink:true},
      motes:{n:26, col:['#7fd7ff','#b48cff'], r:[1,2.2], vx:[-.15,.15], vy:[-.5,-.15], glow:10, from:'bottom'},
      void:{n:34, col:['#b07cff','#6a3dff'], r:[1,2.4], vx:[-.3,.3], vy:[-.3,.3], glow:12, swirl:true},
      stars:{n:70, col:['#ffffff','#cfd8ff'], r:[.5,1.4], vx:[0,0], vy:[0,0], blink:true, area:[0,.6]}
    }[type] || {n:0};
    const R = (a) => a[0] + Math.random() * (a[1] - a[0]);
    const mk = (init) => {
      const p = { x:Math.random()*W(), y:Math.random()*H(), r:R(cfg.r)*dpr, vx:R(cfg.vx)*dpr, vy:R(cfg.vy)*dpr, c:cfg.col[Math.floor(Math.random()*cfg.col.length)], ph:Math.random()*6.28, life:1 };
      if(cfg.area) p.y = H() * R(cfg.area);
      if(!init && cfg.from === 'bottom') p.y = H() + 10;
      if(!init && cfg.from === 'top') p.y = -10;
      return p;
    };
    const ps = Array.from({length:cfg.n}, () => mk(true));
    let t = 0;
    const loop = () => {
      if(this.cv !== cv || !document.body.contains(cv)) return;
      if(cv.width !== cv.clientWidth * dpr) resize();
      t += .016; ctx.clearRect(0, 0, W(), H());
      ps.forEach((p, i) => {
        if(cfg.swirl){ const a = Math.atan2(p.y - H()/2, p.x - W()/2) + 1.57; p.x += Math.cos(a)*.4*dpr + p.vx*.3; p.y += Math.sin(a)*.25*dpr + p.vy*.3; }
        else { p.x += p.vx + Math.sin(t + p.ph) * .15 * dpr; p.y += p.vy; }
        if(p.y < -20 || p.y > H() + 20 || p.x < -20 || p.x > W() + 20) ps[i] = mk(false);
        let a = 1; if(cfg.blink) a = .35 + .65 * Math.abs(Math.sin(t*1.4 + p.ph));
        if(cfg.from === 'bottom') a *= Math.min(1, p.y / (H()*.25));
        ctx.globalAlpha = a; ctx.fillStyle = p.c;
        if(cfg.glow){ ctx.shadowColor = p.c; ctx.shadowBlur = cfg.glow * dpr; } else ctx.shadowBlur = 0;
        ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, 6.283); ctx.fill();
      });
      ctx.globalAlpha = 1;
      this.raf = requestAnimationFrame(loop);
    };
    loop();
  }
};

  const next = () => {
