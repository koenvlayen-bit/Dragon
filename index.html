        } else if(state.flags.vexarFirstApproach === 'retreat'){
          callback = " You remember calling yourself smart rather than weak, the day you backed down from him. You have spent every season since making sure that was true.";
        }
        return [
          "Word of your war reaches Vexar before the ash from Ostrovan's battalion has even finished settling — and he comes to see it for himself, landing on the same ridge where he once pinned a considerably smaller, considerably less finished version of you without breaking a sweat. He has grown too, these past seasons: broader, scarred along one wing in a way that suggests his own conquests have not been entirely bloodless." + callback,
          "'You've been busy,' he says, and there is something in his voice this time that wasn't there the first time — not quite respect, not yet, but no longer quite contempt either. 'Let's see if busy translates to anything.'"
        ];
      },
      choices: [
        { label:"Meet him with raw, overwhelming savagery", flavor:"No more running, no more cleverness. Just everything you've become.",
          stats:{axis1:-6}, infamy:6, next:"4.1",
          setFlags: (state) => {
            const score = vexarPower(state, 'brutality');
            const tier = score >= 180 ? 'victory' : score >= 120 ? 'draw' : 'defeat';
            return { vexarOutcome: tier, vexarStyle: 'brutality' };
          },
          outcome: (state) => {
            const tier = state.flags.vexarOutcome;
            if(tier === 'victory'){
              return ["You do not out-think him this time. You simply meet him, claw for claw, fire for fire, and somewhere in the middle of it you both realize at the same moment that the fight has stopped being close. Every season of choices you've made since that first humiliating morning — every hard-won scar, every hoard, every enemy you didn't run from — arrives all at once, and it is, finally, enough. You end the fight standing over him, and he does not get up quickly.",
              "'Enough,' he manages, from the ground, and there is no contempt left in it at all. 'Enough. You've made your point.' You let him leave under his own power. It costs you nothing at all to be generous, this time."];
            }
            if(tier === 'draw'){
              return ["Neither of you breaks first. It is the longest, most evenly matched fight of your life, claw and fire and raw stubbornness on both sides, until you are both too exhausted to continue and simply stop, by mutual and unspoken agreement, staring at each other across a scorched ridge neither of you fully controls.",
              "'Huh,' Vexar says, breathing hard, something unreadable crossing his face. 'That's new.' He leaves without declaring a winner, because for the first time in either of your lives, there genuinely isn't one."] ;
            }
            return ["You throw everything you have at him, and it is, once again, not quite enough — he is still faster to recover, still that crucial half-step ahead, and you end the exchange on your back for the second time in your life. But it takes him considerably longer to put you there this time, and both of you know it.",
            "'Closer,' he admits, stepping back rather than finishing it. 'Not yet. But closer than I expected.' He leaves you bruised, furious, and — for the first time — genuinely certain that closer is not the same as never."];
          } },
        { label:"Outwit him with everything you've learned since", flavor:"You've out-thought elder wyrms and archmages. He's next.",
          stats:{axis2:6}, next:"4.1",
          setFlags: (state) => {
            const score = vexarPower(state, 'cunning');
            const tier = score >= 180 ? 'victory' : score >= 120 ? 'draw' : 'defeat';
            return { vexarOutcome: tier, vexarStyle: 'cunning' };
          },
          outcome: (state) => {
            const tier = state.flags.vexarOutcome;
            if(tier === 'victory'){
              return ["You do not meet him head-on. You lead him instead, exactly the way you once led an elder wyrm into a rockslide of your own choosing, using terrain and timing and every hard lesson a war has taught you about making an opponent fight the battle you designed rather than the one they arrived for. By the time Vexar realizes the ridge beneath him was never solid ground to begin with, it is considerably too late to matter.",
              "'You planned this,' he says, half-buried, more impressed than angry. 'The whole approach. You planned this.' You did. It is, you decide, an extremely satisfying thing to confirm out loud."] ;
            }
            if(tier === 'draw'){
              return ["You try every trick a war's worth of enemies has taught you, and he counters more of them than you expected — matching cunning with cunning, feint with feint, until the two of you are more engaged in an increasingly elaborate chess match than an actual fight. Neither of you lands a decisive blow. Both of you, grudgingly, start to enjoy the puzzle of it.",
              "'You've gotten interesting,' Vexar says, disengaging rather than pressing an advantage neither of you quite has. 'That's new too.' You are not entirely sure it was a compliment. You are fairly sure you'll take it as one anyway."] ;
            }
            return ["Your tricks are better than they used to be. They are not, it turns out, quite better than his instincts, which have apparently sharpened just as much as yours have over the same stretch of seasons. He sees through the second feint before you've fully committed to the first, and the fight ends with you outmaneuvered rather than overpowered — a smaller humiliation than last time, but a humiliation nonetheless.",
            "'Good effort,' he says, and for once doesn't sound like he's mocking you. 'You're not the same hatchling. Just... not quite there yet.'"] ;
          } },
        { label:"Let your grown power simply speak for itself", flavor:"No rage, no tricks. Just the calm certainty of what you've become.",
          stats:{axis3:6}, next:"4.1",
          setFlags: (state) => {
            const score = vexarPower(state, 'finesse');
            const tier = score >= 180 ? 'victory' : score >= 120 ? 'draw' : 'defeat';
            return { vexarOutcome: tier, vexarStyle: 'finesse' };
          },
          outcome: (state) => {
            const tier = state.flags.vexarOutcome;
            if(tier === 'victory'){
              return ["You do not rage, and you do not scheme. You simply fight the way everything you've survived since that first humiliating morning taught you to fight — precise, economical, utterly without wasted motion — and Vexar, for the first time in either of your lives, finds himself on the losing end of a fight he was certain he still controlled. It is over almost before he registers that it's begun.",
              "He does not get up right away. When he finally does, he looks at you for a long moment with an expression you have genuinely never seen on him before. 'Well,' he says, quietly. 'That settles that, then.'"] ;
            }
            if(tier === 'draw'){
              return ["You fight with a controlled, unhurried precision that visibly unsettles him more than raw aggression would have — no wasted motion, no opening he can predict, every strike exactly as forceful as it needs to be and no more. It is not enough to finish him. It is more than enough to make him take you seriously for the first time in your life, in a way that has nothing to do with fear.",
              "'You've changed,' he says, retreating to a wary distance rather than closing back in. It is not quite a concession. It is the closest thing to one you have ever heard from him."] ;
            }
            return ["You fight well — better than either of you expected, precise where you used to be merely desperate — and it still, in the end, is not quite enough to close the gap he opened between you the day you were both hatched. He wins, again, though it takes him visibly longer, and he does not gloat about it the way he once might have.",
            "'You're better,' he says, and it costs him something to admit it. 'Not there. But better.' Somehow, this time, that is almost enough to feel like progress."] ;
          } }
      ]
    },

    "4.1": {
      chapterShort:"Chapter Four", chapter:"Chapter Four — The Endgame", part:"Part I",
      title:"The Villain's Castle",
      text: (state) => {
        if(state.flags.sorceressAlive){
          return [
            "The war above ground has barely finished settling into an uneasy quiet when Mirelle finds you again, exactly as she promised she would. She does not waste time on pleasantries. 'Ostrovan was never the true architect of any of this,' she says, unrolling a hand-inked map across the cavern floor. 'He was a puppet, same as the Emperor, same as half this kingdom's council. The hand behind the war belongs to a man who died two hundred years ago and simply never agreed to stay that way — Malvorath Thorne. His citadel sits three days' flight north, warded against everything except, as it turns out, a dragon he never planned for.'",
            "She has spent months mapping his defenses from the shadows, and she means to finish what she started. 'I cannot bring him down alone,' she admits, 'and until an hour ago, I was fairly sure you'd have eaten me before agreeing to help.' She is not entirely wrong to have thought so. But she is here now, and so, unmistakably, is the fortress she is pointing you toward."
          ];
        }
        return [
          "The war above ground has barely finished settling into an uneasy quiet when the truth finally reaches you anyway, pieced together from a captured war-wizard's ravings and the frightened testimony of a goblin scout: Archmage Ostrovan was never the true architect of any of this. He was a puppet, same as the Emperor, same as half the kingdom's council. The hand behind the war belongs to a man who died two hundred years ago and simply never agreed to stay that way — Malvorath Thorne, ruling from a warded black citadel three days' flight to the north.",
          "There is no ally at your side to hand you a map of his defenses this time, no one who has spent months learning his weaknesses from the shadows. Whatever waits behind those walls, you will be finding out the hard way, alone, exactly as you have been since the day you broke out of your shell."
        ];
      },
      choices: [

        { label:"Overwhelm his wards with controlled, precise power", flavor:"Meet two centuries of dark magic with force worthy of the name.",
          stats:{axis1:16}, health:-10, infamy:6, wealth:55, next:"4.2a",
          outcome: (state) => state.flags.sorceressAlive ? [
            "Mirelle identifies the citadel's oldest, deepest ward-stone from half a mile out — the anchor every other layer of defense is built on — and the two of you spend a long, strange hour testing exactly how much combined force it takes to unmake two centuries of careful spellwork at once. The answer, it turns out, is a dragon at the height of its power and a sorceress who knows precisely where to aim it. The wards fail all at once, cascading, and Malvorath's last line of defense collapses before he has finished raising it.",

            "Malvorath's last line of defense collapses in a shower of failing magic, and for the first time in two hundred years, his citadel has nothing left standing between you and him."

    /* ============ CHAPTER FIVE — THE RECKONING ============ */

      text:[

      choices: [

          "You like her considerably more than you expected to. It does not change what happens next."] },
        { label:"\"I've survived worse than a Captain with main-character energy.\"", flavor:"Cocky. She does not look impressed.",
          stats:{axis1:-6}, next:"5.1",

      ]

    "5.1": {
      chapterShort:"Chapter Five", chapter:"Chapter Five — The Reckoning", part:"Part I",
      title:"The Palace Guard",
      text:[
        "The capital does not fall the way Oakhaven did, or the way the trade road villages did, or the way anything has fallen to you so far. Its walls are higher, its streets emptied ahead of you by riders who outran your shadow by minutes rather than hours, and waiting at the palace gates is not a garrison of frightened regulars but the kingdom's actual best: the Royal Guard in full ceremonial-turned-battle plate, a corps of court battle-mages already weaving shield-glyphs into the air, and at their head, Dame Iseult Vaneth, Captain of the Guard, whose reputation you have heard even in the highlands, standing utterly still in your path.",
        "'You have already won the war,' she calls up to you, sword still sheathed. 'This is not a battle for the war. This is a battle for whether the throne means anything at all once you're sitting on it. I intend to make that cost as high as I can.'"
      ],
      choices: [
        { label:"Cut through the Royal Guard head-on", flavor:"Overwhelming force against the kingdom's finest. No subtlety required.",
          stats:{axis1:-14}, health:-20, infamy:14, next:(s)=>s.flags.aureliaAlive?'5.2a':'5.2',
          outcome:["You do not accept her framing. You come down on the gate itself rather than the guard formation, and the battle that follows is the largest, longest fight of your entire life — Dame Vaneth's guard trained specifically, it becomes clear, for exactly this scenario, their shield-glyphs absorbing three separate bursts of flame before the mages finally run dry. It costs you dearly: claw-wounds you will carry scars from for the rest of your existence, a wing membrane torn badly enough to ground you for days once this is over.",
          "But it costs the Royal Guard considerably more. By the time the gate finally gives, Dame Vaneth is one of perhaps a dozen still standing, and even she is bleeding from wounds that will end her career, if not quite her life."] },
        { label:"Slip through the old smuggler tunnels beneath the palace", flavor:"Bypass the guard entirely. Let precision do what force would cost too much for.",
          stats:{axis2:16}, health:-8, infamy:4, next:(s)=>s.flags.aureliaAlive?'5.2a':'5.2',
          outcome:["You do not meet Dame Vaneth's guard at all. While her formation braces for an assault that never comes at the front gate, you fold yourself — with considerably more effort than dignity — into the old flood tunnels beneath the palace, the same architecture that has smuggled contraband and desperate nobility out of this city for three centuries, now smuggling something considerably larger in. You emerge inside the palace walls, guard formation entirely behind you, before anyone realizes the siege they prepared for was never going to happen.",
          "Dame Vaneth, to her credit, works this out almost immediately. By the time she reorganizes her guard to intercept you, you are already three courtyards ahead of her."] },
        { label:"Challenge Dame Vaneth to single combat for the gate", flavor:"Meet her offer of a costly fight with a smaller, fairer one.",
          stats:{axis2:-14}, health:-16, infamy:6, next:(s)=>s.flags.aureliaAlive?'5.2a':'5.2',
          outcome:["You take her at her word, and her framing, and land instead of charging — close enough to speak without shouting, far enough that neither of you could call the distance an ambush. 'Winner takes the gate,' you say. 'No guard, no mages. Just us.' She studies you for a long moment, then, to the visible horror of her own lieutenants, sheathes nothing and simply nods. The duel that follows is brutal, honest, and considerably shorter than the battle either of you were braced for — she is extraordinary, and you are still larger, and larger, in the end, is what decides it.",
          "She yields with her sword still in her hand, guard standing down around her without needing to be told twice. It is, you both privately agree, a better ending than the one either army was prepared to give the other."] }
      ]
    },

      title:"One Last Conversation",
      text:[

    "5.2": {
      chapterShort:"Chapter Five", chapter:"Chapter Five — The Reckoning", part:"Part II",
      title:"The Throne Room",
      text: (state) => {
        if(state.flags.aureliaAlive){
          return [
            "You find her exactly where the last of the guard reports say she has been for hours: standing before the throne itself, not sitting on it, dressed for a coronation that clearly hasn't happened yet and now, by the sound of things outside, isn't going to happen the way anyone planned. The Emperor is nowhere in the palace — fled, or worse, in the chaos of the last day — and Aurelia has simply stepped into the vacuum rather than let the throne room sit empty while the kingdom burns around it.",

          "The eldest of them, a woman whose hands are shaking badly enough to rattle her own ceremonial chain of office, finds her voice first. 'The line ends with us,' she says. 'There is no one else left to put on that throne. Whatever you intend to do with this kingdom, dragon, you will be doing it without an heir to blame for it.'"
        ];
      },

          return [

              stats:{axis1:-18}, health:-4, infamy:30, next:"END", setFlags:{aureliaFate:'killed'},
              outcome:["You do not let the moment stretch any longer than it needs to. Whatever she was waiting to see, she sees it, and it is over before she finishes the sentence she was building toward. The throne room, when the guard finally forces itself back inside, is empty of anyone left to contest what you have just become — no bloodline, no rival claim, no inconvenient reminder of a mercy you once considered showing.",
              "The kingdom will spend generations arguing over whether the last Crown Princess died bravely, foolishly, or simply too late to matter. You already know the only answer that will ever actually be settled: she died, and you did not."] },

              outcome:["You do not kill her, and you do not release her either. You let Aurelia keep the throne, the ceremony, the crown itself — every visible trapping of a rule that now, in every particular that actually matters, answers to a mountain rather than a council. She understands the arrangement before you finish explaining it, and accepts it with the flat, furious clarity of someone who has already calculated that the alternative was worse.",
              "'A puppet queen still needs strings,' she says, taking her seat on the throne for the first time. 'I hope you're prepared to hold them for considerably longer than you think.'"] },
            { label:"Make her your equal, and rule together", flavor:"Not a hostage, not a puppet. An actual partnership of thrones.",

              outcome:["You do not take the throne, and you do not let her keep it alone either. You offer her something neither the guard outside nor the council once assumed you were capable of offering: a genuine partnership, dragon and crown ruling as equals rather than conqueror and conquered. She studies you for a long moment — the same assessing look she gave you the day you first took her captive, seasons and an entire war ago — and finally, deliberately, extends a hand rather than a plea.",
              "'Then we had better decide, quickly, what kind of rule this is actually going to be,' she says. 'Because half this kingdom already assumes the worst, and the other half hasn't decided yet.'"] }

            "The kingdom will need a government eventually. For now, it simply has you, and that, it turns out, is enough to keep it functioning in the short term."] },
            { label:"Let them rule as your terrified vassals", flavor:"A council that governs in name, and answers to you in every particular that matters.",
              stats:{axis2:14}, infamy:8, wealth:15, next:"END", setFlags:{capitalFate:'vassal'},

              "'The council will govern,' she says, carefully. 'In your name, if that is what you require.' It is exactly what you require."] }

    text: [
      "You did not conquer the world of men so much as become something it eventually needed. Pilgrims climb your mountain now, not with siege engines but with questions — about magic, about mortality, about the strange curiosity that once led you to speak with a captive princess as an equal rather than a meal. Some of them you turn away. Most, in time, you answer, in your own unhurried, ancient way.",
      "Aurelia, if your path once crossed hers with respect rather than cruelty, is remembered by history as the queen who brought a dragon into her council rather than her cage, and the peace between crown and mountain has held for three generations because of it. Knights no longer come to slay you. They come, occasionally, to be tested by you, and a strange kind of order — an order with a dragon quietly holding one corner of its foundation — has settled over a realm that once could not imagine such a thing.",
      "Your hoard is respectable rather than legendary, because you were never truly hoarding gold. You were hoarding knowledge, patience, and the slow accumulation of a wisdom no human lifetime allows for. When, centuries from now, your enormous age finally catches you, the mountain will not fall to invaders. It will become a shrine, tended by descendants of people who once feared your kind, now certain that something worth calling holy once slept in these stones."
    ]
  }
};

/* ============ GAME STATE & ENGINE ============ */

function freshState(){
  return {
    node: STORY.start,
    phase: 'naming',      // 'naming' = choosing a name, 'story' = scene with choices, 'outcome' = aftermath
    dragonName: null,
    pendingOutcome: null, // array of paragraphs for the aftermath screen
    pendingImpacts: null, // array of stat-change chips to show on the aftermath screen
    pendingNext: null,    // node key (or "END") to move to once Continue is pressed
    flags: {},   // narrative flags set by earlier choices (e.g. goblinAllies, sorceressAlive) that later text can react to
    axis1: 0,  // negative = Brutality, positive = Finesse
    axis2: 0,  // negative = Honor, positive = Cunning
    axis3: 0,  // negative = Disdain, positive = Curiosity
    health: 100,
    wealth: 0,
    infamy: 0,
    history: []
  };
}

const NAME_PRESETS = [
  "Emberwake", "Duskfang", "Vaelithra", "Korrathis",
  "Nyxaria", "Grimwing", "Aurumis", "Skarnoth",
  "Thalassor", "Obsidianne"
];

function pickPresetName(){
  return NAME_PRESETS[Math.floor(Math.random() * NAME_PRESETS.length)];
}

let state = freshState();

function clamp(v, lo, hi){ return Math.max(lo, Math.min(hi, v)); }

const SAVE_KEY = 'dragon-saga-save-v1';

async function tryLoad(){
  try{
    const raw = window.localStorage.getItem(SAVE_KEY);
    if(raw){ state = JSON.parse(raw); return true; }
  }catch(e){ /* no save yet, or storage unavailable — fine, start fresh */ }
  return false;
}
async function trySave(){
  try{
    window.localStorage.setItem(SAVE_KEY, JSON.stringify(state));
  }catch(e){ /* storage full or blocked — game still works, just won't persist */ }
}
async function tryClear(){
  try{
    window.localStorage.removeItem(SAVE_KEY);
  }catch(e){ /* ignore */ }
}

function pct(axisVal){
  // axisVal ranges roughly -100..100 -> 0..100 for bar width
  return clamp(((axisVal + 100) / 200) * 100, 0, 100);
}

function buildImpactBadges(applied){
  const badges = [];
  if(applied.axis1 < 0) badges.push({icon:'🔥', label:'Brutality', value:-applied.axis1, cls:'chip-brutality'});
  else if(applied.axis1 > 0) badges.push({icon:'✨', label:'Finesse', value:applied.axis1, cls:'chip-finesse'});

  if(applied.axis2 < 0) badges.push({icon:'🛡️', label:'Honor', value:-applied.axis2, cls:'chip-honor'});
  else if(applied.axis2 > 0) badges.push({icon:'🐍', label:'Cunning', value:applied.axis2, cls:'chip-cunning'});

  if(applied.axis3 < 0) badges.push({icon:'🌑', label:'Disdain', value:-applied.axis3, cls:'chip-disdain'});
  else if(applied.axis3 > 0) badges.push({icon:'👁️', label:'Curiosity', value:applied.axis3, cls:'chip-curiosity'});

  if(applied.health !== 0){
    const up = applied.health > 0;
    badges.push({icon: up ? '❤️' : '💔', label:'Health', value: applied.health, signed:true, cls: up ? 'chip-health-up' : 'chip-health-down'});
  }
  if(applied.wealth !== 0){
    badges.push({icon:'💰', label:'Hoard', value: applied.wealth, signed:true, cls:'chip-hoard'});
  }
  if(applied.infamy !== 0){
    badges.push({icon:'💀', label:'Infamy', value: applied.infamy, signed:true, cls:'chip-infamy'});
  }
  return badges;
}

function resolveText(value){
  // Story text and outcome text can be a static array, or a function(state) => array
  // so later scenes can react to earlier choices (e.g. whether an ally survived).
  return typeof value === 'function' ? value(state) : value;
}

function applyChoice(choice){
  const before = {
    axis1: state.axis1, axis2: state.axis2, axis3: state.axis3,
    health: state.health, wealth: state.wealth, infamy: state.infamy
  };

  state.axis1 = clamp(state.axis1 + (choice.stats.axis1||0), -100, 100);
  state.axis2 = clamp(state.axis2 + (choice.stats.axis2||0), -100, 100);
  state.axis3 = clamp(state.axis3 + (choice.stats.axis3||0), -100, 100);
  state.health = clamp(state.health + (choice.health||0), 0, 100);
  state.wealth = Math.max(0, state.wealth + (choice.wealth||0));
  state.infamy = clamp(state.infamy + (choice.infamy||0), 0, 100);
  state.history.push(choice.label);
  if(choice.setFlags){
    const resolvedFlags = typeof choice.setFlags === 'function' ? choice.setFlags(state) : choice.setFlags;
    Object.assign(state.flags, resolvedFlags);
  }

  const applied = {
    axis1: state.axis1 - before.axis1, axis2: state.axis2 - before.axis2, axis3: state.axis3 - before.axis3,
    health: state.health - before.health, wealth: state.wealth - before.wealth, infamy: state.infamy - before.infamy
  };

  // Show the aftermath of this specific choice before moving on.
  state.phase = 'outcome';
  state.pendingOutcome = resolveText(choice.outcome) || [];
  state.pendingImpacts = buildImpactBadges(applied);
  const resolvedNext = typeof choice.next === 'function' ? choice.next(state) : choice.next;
  state.pendingNext = (state.health <= 0) ? "__ending_fallenEarly" : resolvedNext;

  trySave();
  render();
}

function continueStory(){
  let next = state.pendingNext;
  if(next === "END"){
    next = "__ending_" + computeEnding();
  }
  state.node = next;
  state.phase = 'story';
  state.pendingOutcome = null;
  state.pendingImpacts = null;
  state.pendingNext = null;
  trySave();
  render();
}

function computeEnding(){
  const {axis1, axis2, axis3, infamy} = state;
  // Cruel Tyrant: brutal + very infamous
  if(infamy >= 65 && axis1 <= -5) return "tyrant";
  // Unseen Shadow: cunning + kept infamy low
  if(axis2 >= 10 && infamy <= 40) return "shadow";
  // Wise Dragon-God: curious + honorable/diplomatic
  if(axis3 >= 8 && axis2 <= 6 && infamy <= 55) return "wise";
  // Fallback: contradictory / chaotic legacy
  return "fallenEarly";
}

function confirmName(rawName){
  const trimmed = (rawName || "").trim();
  state.dragonName = trimmed.length > 0 ? trimmed.slice(0, 32) : pickPresetName();
  state.phase = 'story';
  trySave();
  render();
}

function restart(){
  state = freshState();
  tryClear();
  trySave();
  render();
}

/* ============ RENDER ============ */

function statLabel(name, val, leftWord, rightWord, fillClass){
  return `
    <div class="stat-row">
      <div class="stat-label"><span>${leftWord}</span><span>${rightWord}</span></div>
      <div class="stat-track"><div class="stat-fill ${fillClass}" style="width:${pct(val)}%"></div></div>
    </div>`;
}

function renderHud(){
  const currentNode = STORY.nodes[state.node];
  const chapterLabel = currentNode ? currentNode.chapterShort : "Epilogue";
  const ledgerTitle = state.dragonName ? `${state.dragonName}'s Ledger` : "Draconic Ledger";
  return `
    <div class="hud">
      <div class="hud-title"><span>${ledgerTitle}</span><span class="act-tag">${chapterLabel}</span></div>
      <div class="stat-grid">
        ${statLabel('axis1', state.axis1, 'Brutality', 'Finesse', 'fill-axis1')}
        ${statLabel('axis2', state.axis2, 'Honor', 'Cunning', 'fill-axis2')}
        ${statLabel('axis3', state.axis3, 'Disdain', 'Curiosity', 'fill-axis3')}
        <div class="stat-row">
          <div class="stat-label"><span>Health</span><span>${state.health}/100</span></div>
          <div class="stat-track"><div class="stat-fill fill-health" style="width:${state.health}%"></div></div>
        </div>
      </div>
      <div class="vitals">
        <span>Hoard: <b>${state.wealth}</b> gold</span>
        <span>Infamy: <b>${state.infamy}</b>/100</span>
      </div>
    </div>`;
}

function resolveChoices(node){
  return typeof node.choices === 'function' ? node.choices(state) : node.choices;
}

function renderScene(node){
  const paras = resolveText(node.text).map(p => `<p>${p}</p>`).join("");
  const choices = resolveChoices(node);
  const choicesHtml = choices.map((c, i) => `
    <button class="choice-btn" data-idx="${i}">
      <span class="choice-label">${c.label}</span>
      <span class="choice-flavor">${c.flavor}</span>
    </button>`).join("");

  return `
    <div class="scene">
      <div class="node-eyebrow">${node.chapterShort} · ${node.part}</div>
      <h2 class="node-title">${node.title}</h2>
      <div class="scene-text">${paras}</div>
    </div>
    <div class="choices">${choicesHtml}</div>
  `;
}

function renderNaming(){
  const chips = NAME_PRESETS.map(n => `<button class="name-chip" data-name="${n}">${n}</button>`).join("");
  return `
    <div class="scene">
      <div class="node-eyebrow">Before It Begins</div>
      <h2 class="node-title">What Shall We Call You?</h2>
      <div class="scene-text">
        <p>Before the shell cracks, before the first breath of smoke or shadow or gold, the world wants a name to attach to the legend that is about to begin. Choose your own, or let the mountain choose one for you.</p>
      </div>
      <input type="text" id="name-field" class="name-input" placeholder="Type your dragon's name…" maxlength="32" autocomplete="off">
      <div class="name-divider">or pick one</div>
      <div class="name-presets">${chips}</div>
    </div>
    <button class="continue-btn" id="name-begin-btn">Begin the Saga</button>
  `;
}

function renderImpactChips(impacts){
  if(!impacts || impacts.length === 0) return "";
  const chips = impacts.map(b => {
    const sign = b.signed ? (b.value >= 0 ? '+' : '') : '+';
    return `<span class="impact-chip ${b.cls}"><span class="chip-icon">${b.icon}</span><span>${sign}${b.value} ${b.label}</span></span>`;
  }).join("");
  return `<div class="impact-strip">${chips}</div>`;
}

function renderOutcome(){
  const paras = (state.pendingOutcome || []).map(p => `<p>${p}</p>`).join("");
  return `
    <div class="scene">
      ${renderImpactChips(state.pendingImpacts)}
      <div class="scene-text">${paras}</div>
    </div>
    <button class="continue-btn" id="continue-btn">Continue</button>
  `;
}

function endingBonusParagraphs(){
  const bonus = [];
  bonus.push("Somewhere to the north, the wreckage of a black citadel that once belonged to a man named Malvorath Thorne has already become a byword for what happens to those who plot against you from the shadows — a warning stone requires no upkeep once it has done its work.");

  if(state.flags.sorceressAlive){
    bonus.push("Mirelle never did leave the mountain entirely. She keeps her own tower now, three peaks to the west, and visits often enough that the servants at your gate have long since stopped remarking on it.");
  }

  if(state.flags.goblinAllies === 'worship'){
    bonus.push("In the ravine below, the goblin priesthood you never quite meant to found still leaves offerings at your door each new moon, their theology having survived — and outlived — several of their own kings.");
  } else if(state.flags.goblinAllies === 'fear'){
    bonus.push("Deep in the mountain's eastern warren, the goblins you broke to servitude generations ago still mine gold for a master they have never once tried to overthrow, fear having proven, in your case, a remarkably stable form of government.");
  } else if(state.flags.goblinAllies === 'trust'){
    bonus.push("In the ravine below, the goblin tribe you once chose to spare rather than conquer still trades freely at your mountain's foot, the last living creatures who remember you as something closer to a neighbor than a monster.");
  }

  if(state.flags.aureliaFate === 'killed'){
    bonus.push("The throne room where you finally killed Aurelia has been sealed and left empty ever since — no regent in the years since has ever quite worked up the nerve to sit in it.");
  } else if(state.flags.aureliaFate === 'puppet'){
    bonus.push("Aurelia still sits the throne, technically. The kingdom stopped asking what \"technically\" meant a long time ago, and has been considerably more peaceful for having stopped.");
  } else if(state.flags.aureliaFate === 'ally'){
    if(state.flags.empireFate === 'conqueror'){
      bonus.push("Empress Aurelia rules at your side over a realm considerably larger than the one her father ever left her, and considerably more honest, if nothing else, about how it got that way.");
    } else if(state.flags.empireFate === 'protector'){
      bonus.push("Empress Aurelia rules at your side still, and between the two of you, this has become the one realm on the continent that neighboring kingdoms have quietly agreed is simply not worth testing.");
    } else {
      bonus.push("Empress Aurelia rules at your side still — an arrangement neither of you fully explained to the histories, and one neither of you has ever felt the need to.");
    }
  }

  if(state.flags.capitalFate === 'purged'){
    bonus.push("The council chamber where you once purged the last of the old regime has been rebuilt three times since, each new government a little more careful about what it says in rooms with a clear view of your mountain.");
  } else if(state.flags.capitalFate === 'vassal'){
    bonus.push("The Council of Regents still governs the capital, technically, in your name, in the particular hollow way governments do when everyone involved understands precisely whose permission actually matters.");
  }

  if(state.flags.vexarOutcome === 'victory'){
    bonus.push("Vexar visits, now and then, on terms that have nothing left to do with dominance — the closest thing to family either of you has left, and, against every early prediction either of you would have made, something that has quietly come to resemble a friendship.");
  } else if(state.flags.vexarOutcome === 'draw'){
    bonus.push("You and Vexar never did settle which of you was stronger, in the end, and have somehow spent the years since deciding they preferred it that way — an unfinished argument neither sibling has ever felt the need to actually finish.");
  } else if(state.flags.vexarOutcome === 'defeat'){
    bonus.push("Vexar still holds, technically, that he could take you in a fair fight. You have never quite worked up the nerve to test that claim a third time — though you both privately suspect, these days, that the gap has closed considerably more than either of you says out loud.");
  }

  return bonus;
}

function renderEnding(ending){
  const paras = ending.text.map(p => `<p>${p}</p>`).join("");
  const bonusParas = endingBonusParagraphs().map(p => `<p>${p}</p>`).join("");
  const nameLine = state.dragonName ? `<div class="dragon-name-line">${state.dragonName}</div>` : "";
  return `
    <div class="scene">
      <div class="node-eyebrow">Chapter Four · Epilogue</div>
      ${nameLine}
      <div class="ending-badge">${ending.badge}</div>
      <h2 class="node-title">${ending.title}</h2>
      <div class="scene-text">${paras}${bonusParas}</div>
    </div>
    <div class="footer-controls">
      <button class="restart-btn" id="restart-btn">Begin a New Hatching</button>
    </div>
  `;
}

function render(){
  const app = document.getElementById('app');

  // Phase 0: choosing a name, shown once at the very start of a saga — no stat ledger yet
  if(state.phase === 'naming'){
    let html = renderNaming();
    app.innerHTML = html;
    const field = document.getElementById('name-field');
    field.focus();
    document.querySelectorAll('.name-chip').forEach(chip => {
      chip.addEventListener('click', () => {
        field.value = chip.getAttribute('data-name');
        document.querySelectorAll('.name-chip').forEach(c => c.classList.remove('selected'));
        chip.classList.add('selected');
      });
    });
    const begin = () => confirmName(field.value);
    document.getElementById('name-begin-btn').addEventListener('click', begin);
    field.addEventListener('keydown', (e) => { if(e.key === 'Enter') begin(); });
    window.scrollTo({top:0, behavior:'smooth'});
    return;
  }

  let html = renderHud();

  // Phase 1: showing the aftermath of the choice just made
  if(state.phase === 'outcome'){
    html += renderOutcome();
    app.innerHTML = html;
    document.getElementById('continue-btn').addEventListener('click', continueStory);
    window.scrollTo({top:0, behavior:'smooth'});
    return;
  }

  // Phase 2: a final ending screen
  if(state.node.startsWith("__ending_")){
    const key = state.node.replace("__ending_", "");
    html += renderEnding(ENDINGS[key]);
    app.innerHTML = html;
    document.getElementById('restart-btn').addEventListener('click', restart);
    window.scrollTo({top:0, behavior:'smooth'});
    return;
  }

  // Phase 3: a normal story scene with choices
  const node = STORY.nodes[state.node];
  const choices = resolveChoices(node);
  html += renderScene(node);
  html += `<div class="footer-controls"><button class="restart-btn" id="restart-btn-mid">Restart Saga</button></div>`;
  app.innerHTML = html;

  app.querySelectorAll('.choice-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      const idx = parseInt(btn.getAttribute('data-idx'), 10);
      applyChoice(choices[idx]);
    });
  });
  document.getElementById('restart-btn-mid').addEventListener('click', restart);

  window.scrollTo({top:0, behavior:'smooth'});
}

/* ============ INIT ============ */
(async function init(){
  await tryLoad();
  render();
})();

/* ============ SERVICE WORKER (offline support) ============ */
if('serviceWorker' in navigator){
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('sw.js').catch(() => {
      /* offline support just won't be available — game still runs fine online */
    });
  });
}
</script>
</body>
</html>
