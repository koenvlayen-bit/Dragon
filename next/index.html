<!doctype html>
<html lang="en"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b0a0e">
<title>Eternal Hoard – The Last Warmth</title>
<link rel="icon" href="../icon-192.png">
<link rel="apple-touch-icon" href="../apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700;900&family=Spectral:ital,wght@0,400;0,500;0,600;1,400&display=swap">
<style>
:root{
  --void:#0b0a0e; --panel:#15121a; --panel-hi:#1f1a26; --line:#2d2533;
  --ember:#c1481f; --ember-hi:#e4682f; --gold:#c9a227; --gold-hi:#f0c44a;
  --frost:#a6d4ee; --frost-dim:#5b7d92; --ice:#dff1ff;
  --parch:#ece3d3; --dim:#a89e8c; --faint:#6b6270;
  --hp:#c43a3a; --heat:#f08a3a; --hope:#f0c44a; --dread:#9a5bd0; --wild:#5fbf7a;
  --f-d:'Cinzel',Georgia,serif; --f-b:'Spectral',Georgia,serif;
  color-scheme:dark;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--void);color:var(--parch);font-family:var(--f-b);font-size:17px;line-height:1.55}
body{min-height:100vh;background:radial-gradient(120% 60% at 50% 0%,#14202a 0%,transparent 60%),var(--void)}
button{font:inherit;color:inherit;cursor:pointer}
#app{max-width:560px;margin:0 auto;min-height:100vh;padding:0 max(14px,env(safe-area-inset-left)) calc(24px + env(safe-area-inset-bottom)) max(14px,env(safe-area-inset-right))}
h1,h2,h3{font-family:var(--f-d);margin:0;letter-spacing:.02em}
.ic{width:1em;height:1em;vertical-align:-.15em;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

/* top bar */
.bar{position:sticky;top:0;z-index:20;margin:0 calc(-1 * max(14px,env(safe-area-inset-left)));padding:calc(8px + env(safe-area-inset-top)) max(14px,env(safe-area-inset-left)) 8px;background:rgba(11,10,14,.9);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border-bottom:1px solid var(--line);display:grid;gap:6px}
.bar-top{display:flex;align-items:center;gap:10px;justify-content:space-between}
.bar-name{font-family:var(--f-d);font-weight:700;color:var(--gold-hi);font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar-season{font-family:var(--f-d);font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--frost);display:flex;align-items:center;gap:8px;white-space:nowrap}
.pips{display:inline-flex;gap:3px}
.pips i{width:8px;height:12px;border-radius:50% 50% 45% 45%;background:var(--line)}
.pips i.on{background:linear-gradient(180deg,#ffd27a,var(--ember-hi));box-shadow:0 0 6px rgba(228,104,47,.6)}
.bar-stats{display:flex;gap:12px;align-items:center;font-size:13px;color:var(--dim)}
.hpbar{flex:1;height:8px;border-radius:6px;background:#2a1517;overflow:hidden;position:relative;min-width:60px}
.hpbar i{position:absolute;inset:0 auto 0 0;background:linear-gradient(90deg,#8c2323,var(--hp));border-radius:6px;transition:width .4s}
.stat{display:inline-flex;align-items:center;gap:4px;white-space:nowrap;font-variant-numeric:tabular-nums}
.stat b{color:var(--parch);font-weight:600}
.stat.gold{color:var(--gold-hi)} .stat.glow{color:var(--ember-hi)}

/* generic */
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;padding:13px 16px;border-radius:12px;border:1px solid var(--line);background:var(--panel);font-family:var(--f-d);font-size:14px;letter-spacing:.08em;text-transform:uppercase;transition:transform .12s,border-color .2s,background .2s}
.btn:active{transform:scale(.98)}
.btn:hover{border-color:#4a3d52}
.btn.primary{background:linear-gradient(180deg,#d4602a,#a33a16);border-color:#e4682f;color:#fff4e6}
.btn.frost{background:linear-gradient(180deg,#22394a,#16232e);border-color:#3e6a85;color:var(--ice)}
.btn.ghost{background:transparent}
.btn:disabled{opacity:.4;cursor:default;transform:none}
.row{display:flex;gap:10px}
.row > *{flex:1}
.stack{display:grid;gap:10px}
.muted{color:var(--dim)}
.small{font-size:14px}
.label{font-family:var(--f-d);font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:var(--dim)}
.fade-in{animation:fin .45s ease both}
@keyframes fin{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

/* title */
.title{min-height:100vh;display:grid;align-content:center;gap:22px;text-align:center;padding-block:40px}
.title h1{font-weight:900;font-size:44px;line-height:1.02;background:linear-gradient(180deg,#ffe7a0,#c9a227 60%,#7d5a12);-webkit-background-clip:text;background-clip:text;color:transparent}
.title .sub{font-family:var(--f-d);letter-spacing:.32em;text-transform:uppercase;font-size:12px;color:var(--frost)}
.title .egg{width:160px;margin:0 auto;filter:drop-shadow(0 0 30px rgba(228,104,47,.45))}
.title .note{font-size:14px;color:var(--faint)}

/* scene */
.scene{display:grid;gap:16px;padding-top:14px}
.plate{position:relative;aspect-ratio:16/9;border-radius:16px;overflow:hidden;border:1px solid var(--line);background:var(--panel)}
.plate .bg{position:absolute;inset:0}
.plate img.bgimg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.plate::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,transparent 55%,rgba(11,10,14,.85))}
.plate .who{position:absolute;left:12px;bottom:10px;z-index:2;display:flex;align-items:flex-end;gap:10px}
.portrait{width:74px;height:74px;border-radius:50%;overflow:hidden;border:2px solid var(--gold);background:#1c1720;display:grid;place-items:center;font-family:var(--f-d);font-weight:900;font-size:26px;color:var(--gold-hi);box-shadow:0 6px 18px rgba(0,0,0,.6)}
.portrait img{width:100%;height:100%;object-fit:cover}
.who-name{font-family:var(--f-d);font-size:13px;letter-spacing:.08em;color:var(--parch);text-shadow:0 2px 6px #000;padding-bottom:6px}
.plate .place{position:absolute;right:12px;bottom:12px;z-index:2;font-family:var(--f-d);font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:var(--frost);text-shadow:0 2px 6px #000}
.scene h2{font-size:22px;color:var(--gold-hi);text-wrap:balance}
.prose{display:grid;gap:12px}
.prose p{margin:0}
.prose p.say{padding-left:14px;border-left:2px solid var(--gold);font-style:italic;color:#f3e9d6}
.choices{display:grid;gap:10px;margin-top:4px}
.choice{display:grid;gap:3px;text-align:left;padding:13px 15px;border-radius:12px;border:1px solid var(--line);background:var(--panel);transition:border-color .2s,background .2s,transform .12s}
.choice:hover{border-color:#5b4a3a;background:var(--panel-hi)}
.choice:active{transform:scale(.99)}
.choice .t{font-weight:500}
.choice .h{font-size:13px;color:var(--dim);font-style:italic}
.choice.locked{opacity:.45;cursor:default}
.choice.fight{border-color:#6a2a1a}
.choice.fight .t::before{content:"⚔ ";color:var(--ember-hi)}
.fx{display:flex;flex-wrap:wrap;gap:6px}
.fx span{font-size:13px;padding:4px 9px;border-radius:999px;border:1px solid var(--line);background:var(--panel)}
.fx .up{color:#9ee0a8}.fx .down{color:#e48a8a}.fx .gold{color:var(--gold-hi)}.fx .glow{color:var(--ember-hi)}.fx .hope{color:var(--hope)}.fx .dread{color:#c79cf0}.fx .wild{color:var(--wild)}.fx .info{color:var(--frost)}

/* creation */
.create{display:grid;gap:16px;padding-top:14px}
.create .hero{position:sticky;top:0;z-index:5;margin:0 -14px;padding:6px 0 4px;background:linear-gradient(180deg,var(--void) 82%,transparent);display:flex;justify-content:center}
.create .hero img{width:auto!important;max-width:100%;height:min(34vh,300px)!important}
.opt-group{scroll-margin-top:min(36vh,316px)}
.create .hero img{width:100%;height:auto;display:block;filter:drop-shadow(0 16px 26px rgba(0,0,0,.6))}
.create .hero::before{content:"";position:absolute;inset:14% 10% 6%;background:radial-gradient(closest-side,rgba(228,104,47,.25),transparent);}
.opt-group{display:grid;gap:8px}
.opts{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.opt{padding:10px 6px;border-radius:10px;border:1px solid var(--line);background:var(--panel);font-size:13px;text-align:center;line-height:1.25}
.opt.on{border-color:var(--gold);background:#2a2214;color:var(--gold-hi)}
.opt small{display:block;color:var(--faint);font-size:11px;margin-top:3px}
.opt.on small{color:#c9a96a}
.sw{width:22px;height:22px;border-radius:50%;margin:0 auto 4px;border:2px solid rgba(255,255,255,.15)}
.name-in{width:100%;padding:14px 16px;border-radius:12px;border:1px solid var(--line);background:var(--panel);color:var(--parch);font:inherit;font-family:var(--f-d);font-size:18px;text-align:center;outline:none}
.name-in:focus{border-color:var(--gold)}
.presets{display:flex;flex-wrap:wrap;gap:6px;justify-content:center}
.presets button{font-size:13px;padding:6px 10px;border-radius:999px;border:1px solid var(--line);background:var(--panel)}
.kit{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.kit div{padding:10px 12px;border-radius:10px;background:var(--panel);border:1px solid var(--line);font-size:13px;color:var(--dim)}
.kit b{display:block;font-family:var(--f-d);font-size:12px;letter-spacing:.06em;color:var(--parch)}

/* map */
.mapview{display:grid;gap:12px;padding-top:12px}
.mapbox{position:relative;aspect-ratio:3/2;border-radius:16px;overflow:hidden;border:1px solid #2b3d4a;background:#0d1820;touch-action:manipulation}
.mapbox .base{position:absolute;inset:0;width:100%;height:100%}
.mapbox canvas{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.pin{position:absolute;transform:translate(-50%,-50%);display:grid;justify-items:center;gap:2px;background:none;border:0;padding:4px;z-index:3}
.pin .dot{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;background:rgba(13,24,32,.85);border:1.5px solid var(--frost);color:var(--ice);font-size:13px;box-shadow:0 0 0 3px rgba(0,0,0,.35)}
.pin .nm{font-family:var(--f-d);font-size:10px;letter-spacing:.08em;color:var(--ice);text-shadow:0 1px 3px #000,0 0 6px #000;white-space:nowrap}
.pin.warm .dot{border-color:var(--ember-hi);background:rgba(60,26,12,.9);color:#ffd2a8}
.pin.lost .dot{border-color:#555;color:#777;background:rgba(20,20,24,.9)}
.pin.lost .nm{color:#888;text-decoration:line-through}
.pin.event .dot{animation:pulse 1.6s ease-in-out infinite}
.pin.sel .dot{transform:scale(1.18);border-width:2.5px}
.pin.locked{opacity:.55}
.pin.lair .dot{width:32px;height:32px;border-color:var(--ember-hi);background:radial-gradient(circle,#7a2e10,#2a120a);color:#ffcf8a}
@keyframes pulse{0%,100%{box-shadow:0 0 0 3px rgba(0,0,0,.35),0 0 0 0 rgba(240,196,74,.6)}50%{box-shadow:0 0 0 3px rgba(0,0,0,.35),0 0 0 7px rgba(240,196,74,0)}}
.pin .ex{position:absolute;top:-2px;right:0;width:12px;height:12px;border-radius:50%;background:var(--gold-hi);border:2px solid #0d1820}
.mapinfo{border:1px solid var(--line);border-radius:14px;background:var(--panel);padding:14px 16px;display:grid;gap:8px}
.mapinfo h3{font-size:17px;color:var(--parch);display:flex;justify-content:space-between;align-items:center;gap:8px}
.tag{font-family:var(--f-d);font-size:10px;letter-spacing:.14em;text-transform:uppercase;padding:3px 8px;border-radius:999px;border:1px solid var(--line);color:var(--dim);white-space:nowrap}
.tag.warm{color:#ffb27a;border-color:#6a3518}.tag.frozen{color:var(--frost);border-color:#2f4a5c}.tag.lost{color:#999}.tag.ally{color:#9ee0a8;border-color:#2c5a36}
.meters{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.meter{border:1px solid var(--line);border-radius:12px;padding:8px 10px;background:var(--panel);display:grid;gap:5px}
.meter .label{font-size:10px}
.meter .mv{height:5px;border-radius:4px;background:var(--line);overflow:hidden}
.meter .mv i{display:block;height:100%;border-radius:4px}
.meter b{font-size:14px;font-variant-numeric:tabular-nums}
.hint{font-size:13px;color:var(--faint);text-align:center}

/* lair */
.lair{display:grid;gap:14px;padding-top:12px}
.hoardbox{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.big{border:1px solid var(--line);border-radius:14px;background:var(--panel);padding:12px 14px}
.big .n{font-family:var(--f-d);font-size:26px;font-weight:700;font-variant-numeric:tabular-nums}
.big.g .n{color:var(--gold-hi)} .big.w .n{color:var(--ember-hi)}
.upg{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 12px;align-items:center;border:1px solid var(--line);border-radius:14px;background:var(--panel);padding:12px 14px}
.upg h4{margin:0;font-family:var(--f-d);font-size:15px}
.upg p{margin:0;grid-column:1;font-size:14px;color:var(--dim)}
.upg .buy{grid-row:1/3;grid-column:2;padding:10px 12px;border-radius:10px;border:1px solid #6a5420;background:#2a2214;color:var(--gold-hi);font-family:var(--f-d);font-size:13px;white-space:nowrap}
.upg .buy:disabled{opacity:.4}
.upg .lvl{font-size:12px;color:var(--faint)}

/* battle */
.battle{display:grid;gap:10px;padding-top:10px}
.arena{position:relative;aspect-ratio:5/4;border-radius:16px;overflow:hidden;border:1px solid var(--line);background:linear-gradient(180deg,#0f1922,#0a0f14)}
.arena img.bgimg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:.75}
.arena::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.1),rgba(0,0,0,.55));pointer-events:none}
.me{position:absolute;left:-3%;bottom:8%;width:52%;z-index:2;transition:transform .2s}
.me img{width:100%;display:block;filter:drop-shadow(0 10px 18px rgba(0,0,0,.7))}
.foes{position:absolute;right:1%;top:12%;bottom:4%;width:47%;z-index:2;display:flex;flex-direction:column;justify-content:center;gap:4px}
.foe{position:relative;display:grid;grid-template-columns:minmax(0,1fr);justify-items:center;cursor:pointer;border-radius:12px;padding:4px;border:1px solid transparent;transition:transform .2s,opacity .4s}
.foe.tgt{border-color:rgba(240,196,74,.5);background:rgba(240,196,74,.06)}
.foe.dead{opacity:0;transform:scale(.8);pointer-events:none}
.foe .fig{width:100%;display:grid;place-items:center}
.foe .fig img,.foe .fig svg{max-width:100%;max-height:100%;display:block;filter:drop-shadow(0 8px 14px rgba(0,0,0,.7))}
.foes.n1 .fig{height:170px}.foes.n2 .fig{height:84px}.foes.n3 .fig{height:52px}
.foe .fname{font-family:var(--f-d);font-size:10px;letter-spacing:.06em;color:var(--parch);text-shadow:0 1px 3px #000}
.foe .fhp{width:90%;height:6px;border-radius:4px;background:#2a1517;overflow:hidden}
.foe .fhp i{display:block;height:100%;background:var(--hp);transition:width .35s}
.intent{position:absolute;top:0;left:0;font-size:12px;font-weight:600;padding:2px 7px;border-radius:999px;background:rgba(10,8,12,.85);border:1px solid var(--line);display:flex;gap:4px;align-items:center;font-variant-numeric:tabular-nums;z-index:3}
.intent.atk{color:#ff9a7a;border-color:#6a2a1a}.intent.def{color:var(--frost)}.intent.spc{color:#c79cf0}.intent.wind{color:#ffcf6a;border-color:#6a5420}
.chips{display:flex;flex-wrap:wrap;gap:3px;justify-content:center}
.chip{font-size:10px;padding:1px 6px;border-radius:999px;background:rgba(10,8,12,.8);border:1px solid var(--line);white-space:nowrap}
.chip.burn{color:#ff9a5a}.chip.poison{color:#9ee07a}.chip.chill,.chip.soak{color:var(--frost)}.chip.stun{color:#ffe07a}.chip.block{color:#cfd8e0}.chip.fear{color:#c79cf0}.chip.blind{color:#9aa}.chip.fury{color:#ff7a7a}.chip.evade{color:#a6f0d8}.chip.thorns{color:#e0c07a}
.mestat{display:grid;gap:6px;border:1px solid var(--line);border-radius:14px;background:var(--panel);padding:10px 12px}
.mestat .row1{display:flex;align-items:center;gap:10px}
.heat{display:flex;gap:3px}
.heat i{width:10px;height:14px;border-radius:50% 50% 45% 45%;background:var(--line)}
.heat i.on{background:linear-gradient(180deg,#ffd27a,var(--heat))}
.acts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.act{display:grid;gap:2px;text-align:left;padding:10px 12px;border-radius:12px;border:1px solid var(--line);background:var(--panel);position:relative;min-height:62px}
.act .an{font-family:var(--f-d);font-size:13px;letter-spacing:.04em}
.act .ad{font-size:12px;color:var(--dim);line-height:1.3}
.act .cost{position:absolute;top:8px;right:10px;font-size:12px;color:var(--heat);font-weight:600}
.act:disabled{opacity:.38;cursor:default}
.act.breath{border-color:#6a3518;background:linear-gradient(180deg,#2a1610,var(--panel))}
.blog{font-size:14px;color:var(--dim);min-height:42px;text-align:center;font-style:italic}
.dawn{position:absolute;top:10px;left:50%;transform:translateX(-50%);z-index:4;font-family:var(--f-d);font-size:11px;letter-spacing:.14em;text-transform:uppercase;padding:4px 10px;border-radius:999px;background:rgba(10,8,12,.8);border:1px solid #6a5420;color:#ffcf6a;white-space:nowrap}
.float{position:absolute;z-index:6;font-family:var(--f-d);font-weight:900;font-size:22px;pointer-events:none;animation:flt .9s ease-out forwards;text-shadow:0 2px 6px #000}
.float.dmg{color:#ffb08a}.float.heal{color:#9ee0a8}.float.blk{color:#cfd8e0}
@keyframes flt{from{opacity:1;transform:translate(-50%,0)}to{opacity:0;transform:translate(-50%,-46px)}}
.shake{animation:shk .3s}
@keyframes shk{0%,100%{transform:none}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.burst{position:absolute;z-index:5;pointer-events:none;width:120px;height:120px;border-radius:50%;transform:translate(-50%,-50%);animation:bst .5s ease-out forwards}
@keyframes bst{from{opacity:.95;transform:translate(-50%,-50%) scale(.2)}to{opacity:0;transform:translate(-50%,-50%) scale(1.4)}}

/* summary */
.summary{display:grid;gap:14px;padding-top:18px}
.summary h2{font-size:26px;color:var(--gold-hi)}
.lines{display:grid;gap:8px}
.line{display:flex;justify-content:space-between;gap:12px;padding:10px 14px;border-radius:12px;background:var(--panel);border:1px solid var(--line);font-size:15px}
.line b{font-variant-numeric:tabular-nums}
.line.good b{color:#9ee0a8}.line.bad b{color:#e48a8a}
.ach{display:flex;gap:10px;align-items:center;padding:10px 14px;border-radius:12px;border:1px solid #6a5420;background:#211a10}
.ach b{font-family:var(--f-d);font-size:14px;color:var(--gold-hi)}
.toast{position:fixed;left:50%;top:calc(70px + env(safe-area-inset-top));transform:translateX(-50%);z-index:50;padding:10px 16px;border-radius:12px;background:#211a10;border:1px solid #6a5420;color:var(--gold-hi);font-family:var(--f-d);font-size:13px;box-shadow:0 10px 30px rgba(0,0,0,.5);animation:fin .3s ease both;max-width:90vw;text-align:center}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}
.foe .fig > div > svg{width:100%;height:100%}
.foe .fig{position:relative}
.foe .fig > div{position:absolute;inset:0}
.foe .fig > img{max-height:100%;width:auto}
.foe .fig{display:flex;align-items:center;justify-content:center}
.foe .fig > img{height:100%;width:auto;max-width:100%;object-fit:contain}
</style></head><body><div id="app"></div><script>
const SIL = {
  troll: `<svg viewBox="0 0 220 230" class="cs-svg sil"><defs><linearGradient id="trg" x1="1" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#3a4234"/><stop offset=".5" stop-color="#191d16"/><stop offset="1" stop-color="#0b0d0a"/></linearGradient></defs>
    <g stroke="#a9b893" stroke-opacity=".45" stroke-width="2.2" stroke-linejoin="round">
    <path d="M160 226 L156 182 C 186 164 198 120 182 86 C 168 58 136 44 108 50 C 90 54 76 66 70 82 L56 84 C 44 86 40 98 46 104 L58 108 C 56 120 62 132 72 138 L66 176 C 62 196 52 210 44 226 L70 226 L84 188 L100 160 L118 164 L126 226Z" fill="url(#trg)"/>

/* ═══════════ ENGINE: state, rules, persistence ═══════════ */
const SAVE_KEY = 'eh-warmth-save-v1';
const META_KEY = 'eh-warmth-meta-v1';

function freshState(){
  return {
    v:1, screen:'title', name:null,
    look:{ color:'crimson', horns:'ram', hide:'armored', tail:'club', element:'fire' },
    stage:0, hp:50, maxHp:50, gold:0, hope:10, dread:0, wild:0,
    season:0, flights:3, flags:{}, places:{ kettle:'frozen', ashby:'frozen', hollin:'frozen' },
    upgrades:{ vents:0, pool:0, forge:0 }, done:{}, hunted:-1,
    scene:null, out:null, battle:null, report:null, sel:'kettle', chapterDone:false,
  };
}
let S = freshState();
function save(){ try{ localStorage.setItem(SAVE_KEY, JSON.stringify(S)); }catch(e){} }
function load(){ try{ const r = localStorage.getItem(SAVE_KEY); if(r){ return Object.assign(freshState(), JSON.parse(r)); } }catch(e){} return null; }
function wipe(){ try{ localStorage.removeItem(SAVE_KEY); }catch(e){} }

function loadMeta(){ try{ return Object.assign({ ach:{}, runs:0 }, JSON.parse(localStorage.getItem(META_KEY) || '{}')); }catch(e){ return { ach:{}, runs:0 }; } }
let META = loadMeta();
function saveMeta(){ try{ localStorage.setItem(META_KEY, JSON.stringify(META)); }catch(e){} }
let pendingAch = [];
function unlock(id){ if(META.ach[id]) return; META.ach[id] = Date.now(); saveMeta(); const a = ACH.find(x => x.id === id); if(a) pendingAch.push(a); }

const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const R = (v, s = S) => typeof v === 'function' ? v(s) : v;

/* ── Warmth ── */
function radius(s = S){ return 14 + Math.min(16, s.gold / 12) + 7 * s.upgrades.vents + (s.flags.ember ? 5 : 0); }
function dist(a, b){ const dx = a.x - b.x, dy = (a.y - b.y) * (2/3); return Math.sqrt(dx*dx + dy*dy); }
function warmAt(id, s = S){
  const p = PLACES[id]; if(!p) return false;
  if(id === 'lair' || id === 'warren') return true;
  if(s.places[id] === 'kindled' || s.places[id] === 'saved') return true;
  return dist(p, LAIR) <= radius(s);
}
function placeState(id, s = S){
  if(PLACES[id].kind === 'village'){
    const st = s.places[id];
    if(st === 'lost') return 'lost';
    if(st === 'kindled') return 'kindled';
    if(st === 'saved') return 'saved';
    return warmAt(id, s) ? 'warm' : 'frozen';
  }
  if(PLACES[id].kind === 'locked' && (s.chapter || 1) < 2) return 'locked';
  return warmAt(id, s) ? 'warm' : 'frozen';
}
function glowLevel(s = S){ return Math.round(radius(s)); }

/* ── Effects ── */
function applyFx(fx, s = S){
  if(!fx) return [];
  fx = R(fx, s);
  const shown = [];
  const num = (k, label, cls, max) => {
    if(!fx[k]) return;
    const before = s[k];
    s[k] = max ? clamp(s[k] + fx[k], 0, max) : Math.max(0, s[k] + fx[k]);
    const d = s[k] - before;
    if(d) shown.push({ t:`${label} ${d > 0 ? '+' : ''}${d}`, c: cls || (d > 0 ? 'up' : 'down') });
  };
  if(fx.maxHp){ s.maxHp += fx.maxHp; s.hp += fx.maxHp; shown.push({ t:`Max health +${fx.maxHp}`, c:'up' }); }
  num('hp', 'Health', null, s.maxHp);
  num('gold', 'Hoard', 'gold');
  num('hope', 'Hope', 'hope', 100);
  num('dread', 'Dread', 'dread', 100);
  num('wild', 'Wildness', 'wild', 100);
  if(fx.flags) Object.assign(s.flags, fx.flags);
  if(fx.kindle){ s.places[fx.kindle] = 'kindled'; shown.push({ t:`${PLACES[fx.kindle].name} is kindled`, c:'glow' }); }
  if(fx.lose){ s.places[fx.lose] = 'lost'; shown.push({ t:`${PLACES[fx.lose].name} is lost`, c:'down' }); }
  if(fx.done) s.done[fx.done] = true;
  if(fx.ach) [].concat(fx.ach).forEach(unlock);
  if(fx.note) shown.push({ t:fx.note, c:'info' });
  if(s.dread >= 60) unlock('feared');
  if(s.hope >= 60) unlock('beloved');
  return shown;
}

/* ── Seasons ── */
function season(s = S){ return SEASONS[s.season]; }
function tribute(s = S){
  let g = 0; const lines = [];
  VILLAGES.forEach(v => { const st = placeState(v, s); if(st === 'kindled' || st === 'warm' || st === 'saved'){ const t = 6 + Math.floor(s.hope / 10); g += t; lines.push([`${PLACES[v].name} sends tribute`, `+${t}`]); } });
  const gob = { allied:10, vassal:14, terrified:8 }[s.flags.goblins];
  if(gob){ g += gob; lines.push(['The goblins dig gold', `+${gob}`]); }
  return { g, lines };
}
/* Ends the current season: returns a report for the summary screen */
function endSeason(s = S){
  const rep = { from: season(s).name, lines:[], villages:[] };
  const t = tribute(s); s.gold += t.g; t.lines.forEach(l => rep.lines.push({ t:l[0], v:l[1], good:true }));
  const heal = Math.min(s.maxHp - s.hp, Math.round(s.maxHp * .25 + s.hope / 5));
  if(heal > 0){ s.hp += heal; rep.lines.push({ t:'You sleep on your hoard', v:`+${heal} health`, good:true }); }
  // growth
  const ch1 = (s.chapter || 1) < 2;
  const grow = ch1 ? { 0:1, 2:2 }[s.season] : undefined;
  if(grow !== undefined && s.stage < grow){
    s.stage = grow; const add = STAGE_HP[grow] - STAGE_HP[grow - 1]; s.maxHp += add; s.hp += add;
    rep.lines.push({ t:`You grow into a ${STAGES[grow].toLowerCase()}`, v:`+${add} max health`, good:true });
  }
  s.season++;
  // winter arrives: the frost judges every village
  if(ch1 && s.season === 3){
    VILLAGES.forEach(v => {
      const st = placeState(v, s);
      if(st === 'frozen'){ s.places[v] = 'lost'; s.hope = clamp(s.hope - 8, 0, 100); rep.villages.push({ v, ok:false }); }
      else { s.places[v] = 'saved'; s.hope = clamp(s.hope + 6, 0, 100); rep.villages.push({ v, ok:true }); }
    });
    if(rep.villages.every(x => x.ok)) unlock('hearths');
  }
  if(s.season < SEASONS.length) s.flights = SEASONS[s.season].flights;
  s.hunted = -1;
  return rep;
}

/* ── What waits at each place ── */
function eventAt(id, s = S){
  if((s.chapter || 1) >= 2) return eventAt2(id, s);
  const f = s.flags, d = s.done, se = s.season;
  switch(id){
    case 'warren':
      if(!d.warren) return { scene:'warren', label:'Goblins are gathering at the tunnel mouth.' };
      if(f.goblins === 'allied' && se >= 1 && !d.snikkit) return { scene:'snikkit', label:'Snikkit wants a word about your hoard.' };
      return null;
    case 'kettle':
      if(s.places.kettle === 'lost') return null;
      if(!d.kettle) return { scene:'kettle', label:'The village is freezing.' };
      if(se === 3 && !d.kettleWinter && s.places.kettle === 'saved') return { scene:'kettleWinter', label:'Kettle is holding a winter feast.' };
      return null;
    case 'pines':
      if(s.hunted === se) return null;
      return { scene:'pines', label: se >= 2 ? 'A bigger pack has gathered.' : 'Wolves circle in the pines.' };
    case 'hut':
      if(se < 1) return null;
      if(!d.hut) return { scene:'hut', label:'A warm window, and someone waiting.' };
      return null;
    case 'ashby':
      if(s.places.ashby === 'lost') return null;
      if(se >= 1 && !d.ashby) return { scene:'ashby', label:'Riders in grey are at the ford.' };
      if(d.ashby && s.places.ashby === 'frozen' && se <= 2) return { scene:'ashbyKindle', label:'Ashby could still be warmed.' };
      return null;
    case 'hollin':
      if(s.places.hollin === 'lost') return null;
      if(se >= 1 && s.places.hollin === 'frozen' && se <= 2) return { scene:'hollin', label:'Hollin is starving in the cold.' };
      return null;
    case 'pass':
      if(se === 3 && !d.grinder) return { scene:'grinderPass', label:'The Grinder walks the pass tonight.' };
      return null;
  }
  return null;
}
function anyEvents(s = S){ return Object.keys(PLACES).some(id => eventAt(id, s)); }

/* ═══════════ BATTLE ═══════════ */
const sleep = (ms) => new Promise(r => setTimeout(r, ms));
const rnd = () => Math.random();

function pow(){ return STAGE_POW[S.stage] * (1 + S.wild / 200); }
function startBattle(encId, win, lose){
  if(encId === '__pines') encId = S.season >= 2 ? 'pack' : 'wolves';
  const enc = ENCOUNTERS[encId];
  const hpScale = 1 + S.season * 0.12 + ((S.chapter || 1) >= 2 ? .3 : 0);
  const foes = enc.foes.map((k, i) => {
    const e = ENEMIES[k]; const max = Math.round(e.hp * (e.tags.includes('boss') ? 1 : hpScale));
    return { i, key:k, name:e.name, art:e.art, sil:e.sil, hp:max, max, tags:e.tags, moves:e.moves, mi:(i % e.moves.length), intent:null, st:{} };
  });
  const B = { enc:encId, breakAt:enc.breakAt || 0, redeem:!!enc.redeem, bg:enc.bg, flee:enc.flee, foes, tgt:0, turn:1, win, lose, busy:false, log:'', dawn:enc.dawn || 0,
    me:{ heat:4, st:{} } };
  if(S.flags.ward) B.me.st.block = 8;
  foes.forEach(f => {
    if(f.tags.includes('beast') && S.dread >= 35) f.st.fear = 2;
    if(f.tags.includes('human') && S.dread >= 60) f.st.fear = 2;
  });
  S.battle = B; S.screen = 'battle';
  pickIntents(B);
  B.log = foes.length > 1 ? `${foes.length} enemies close in.` : `${foes[0].name} closes in.`;
  if(S.flags.ward) B.log += ' Mirelle\'s ward glows on your chest.';
}

function alive(B){ return B.foes.filter(f => f.hp > 0); }
function pickIntents(B){
  alive(B).forEach(f => {
    let m = f.moves[f.mi % f.moves.length]; f.mi++;
    if(m === 'howl' && alive(B).filter(x => x.key === f.key || x.key === 'pup' || x.key === 'wolf').length < 2) m = 'bite';
    if(m === 'mend' && !alive(B).some(x => x !== f && x.hp < x.max)) m = 'bolt';
    if(m === 'chain' && B.me.st.stun) m = 'chill';
    if(m === 'vchains' && B.me.st.stun) m = 'coldfire';
    if(m === 'net' && B.me.st.stun) m = 'spear';
    f.intent = m;
  });
}
function foeDmg(f, base){
  let d = base + (f.st.fury || 0) * 2;
  if(f.st.fear) d = Math.round(d * .7);
  return d;
}
function intentView(f){
  const m = MOVES[f.intent]; if(!m) return null;
  if(m.k === 'atk') return { c:'atk', t:`⚔ ${foeDmg(f, m.dmg)}` };
  if(m.k === 'def') return { c:'def', t:`⛨ ${m.blk}` };
  if(m.k === 'wind') return { c:'wind', t:'⚠ Winding up' };
  return { c:'spc', t:`✦ ${m.label}${m.dmg ? ' ' + foeDmg(f, m.dmg) : ''}` };
}

/* ── Player actions ── */
function actions(B){
  const L = S.look, forge = S.upgrades.forge;
  const t = B.foes[B.tgt];
  const canDevour = t && t.hp > 0 && !t.tags.includes('boss') && t.hp <= t.max * .25;
  const list = [
    { id:'claw',   name:'Claw',  d:`${Math.round((5 + forge * 3) * pow())} damage`, cost:0 },
    { id:'breath', name:BREATH[L.element].name, d:BREATH[L.element].d, cost:4, cls:'breath' },
    { id:'tail',   name:TAIL[L.tail].name, d:TAIL[L.tail].d, cost:2 },
    { id:'guard',  name:GUARD[L.hide].name, d:GUARD[L.hide].d, cost:1 },
    { id:'roar',   name:'Roar',  d:'Enemies hit 30% softer for 2 turns', cost:1 },
  ];
  if(B.redeem && t && t.hp > 0 && t.hp <= t.max * .5 && canRedeem()) list.unshift({ id:'offer', name:'Offer your fire', d:'Breathe warmth into his chains, not into him', cost:4, cls:'breath' });
  if(canDevour) list.push({ id:'devour', name:'Devour', d:'Finish it. Heal 10.', cost:0 });
  else if(B.flee) list.push({ id:'flee', name:'Fly away', d:'Leave the fight', cost:0 });
  return list;
}

function hit(B, f, amount, opts = {}){
  if(f.hp <= 0) return 0;
  let d = Math.max(0, Math.round(amount));
  if(opts.breath && f.tags.includes('frost')) d = Math.round(d * 1.5);
  if(f.st.block){ const a = Math.min(f.st.block, d); f.st.block -= a; d -= a; if(a) fx('blk', f, `⛨${a}`); }
  f.hp = Math.max(0, f.hp - d);
  if(d) fx('dmg', f, `-${d}`);
  return d;
}

async function playerAct(id){
  const B = S.battle; if(!B || B.busy) return;
  const me = B.me, P = pow();
  if(me.st.stun){ me.st.stun = 0; B.log = 'You tear free of the chains.'; return enemyPhase(B); }
  const act = actions(B).find(a => a.id === id); if(!act) return;
  if(me.heat < act.cost) return;
  let t = B.foes[B.tgt]; if(!t || t.hp <= 0){ B.tgt = B.foes.findIndex(f => f.hp > 0); t = B.foes[B.tgt]; }
  me.heat -= act.cost;
  const chillPen = me.st.chill ? 2 : 0;
  B.busy = true;
  switch(id){
    case 'claw': { const d = hit(B, t, (5 + S.upgrades.forge * 3) * P - chillPen); B.log = `You rake ${t.name} for ${d}.`; anim('claw', t); break; }
    case 'breath': {
      const soak = me.st.soak ? .5 : 1, el = S.look.element;
      anim('breath', el === 'gold' || el === 'fluid' ? null : t);
      if(el === 'fire'){ const d = hit(B, t, 9 * P * soak - chillPen, { breath:true }); if(t.hp > 0) t.st.burn = (t.st.burn || 0) + 3; B.log = `Dragonfire! ${d} damage, and ${t.name} burns.`; }
      if(el === 'shadow'){ const d = hit(B, t, 8 * P * soak - chillPen, { breath:true }); if(t.hp > 0) t.st.blind = 2; B.log = `Black flame: ${d} damage. ${t.name} can barely see.`; }
      if(el === 'gold'){ let tot = 0; alive(B).forEach(f => tot += hit(B, f, 5 * P * soak - chillPen, { breath:true })); me.st.block = (me.st.block || 0) + 6; B.log = `Molten gold washes over everything: ${tot} damage, and it cools on your scales as armour.`; }
      if(el === 'fluid'){ let tot = 0; alive(B).forEach(f => tot += hit(B, f, 6 * P * soak - chillPen, { breath:true })); delete me.st.chill; delete me.st.soak; B.log = `Scalding steam: ${tot} damage, and the frost on you boils away.`; }
      if(me.st.soak) B.log += ' (Soaked: half power.)';
      break; }
    case 'tail': {
      const tb = S.upgrades.forge * 2;
      anim('claw', t);
      if(S.look.tail === 'club'){ const d = hit(B, t, (6 + tb) * P - chillPen); if(t.hp > 0 && !t.st.stunImmune && !t.tags.includes('boss')){ t.st.stun = 1; B.log = `Your tail club lands: ${d}. ${t.name} is stunned.`; } else B.log = `Your tail club lands: ${d}.${t.tags.includes('boss') ? ' Too big to stun.' : ''}`; }
      if(S.look.tail === 'whip'){ let d = 0; for(let k = 0; k < 3; k++) d += hit(B, t, (3 + tb / 2) * P - chillPen / 2); B.log = `Three lashes: ${d} damage.`; }
      if(S.look.tail === 'venom'){ const d = hit(B, t, (3 + tb) * P); if(t.hp > 0) t.st.poison = (t.st.poison || 0) + 4; B.log = `The barb sinks in: ${d}, and poison.`; }
      if(S.look.tail === 'fin'){ let tot = 0; alive(B).forEach(f => tot += hit(B, f, (4 + tb) * P - chillPen)); me.st.evade = 1; B.log = `You sweep the field: ${tot} damage. You will dodge the next blow.`; }
      break; }
    case 'guard': {
      const h = S.look.hide;
      me.st.block = (me.st.block || 0) + (h === 'armored' ? 12 : 7);
      if(h === 'ridged') me.st.thorns = 4;
      if(h === 'leathery') me.st.heatNext = 2;
      if(h === 'strange'){ ['chill','soak','stun'].forEach(k => delete me.st[k]); }
      B.log = { armored:'You tuck in behind armoured scales.', ridged:'Your plates bristle like spears.', leathery:'You cloak yourself in your wings and gather heat.', strange:'Your hide flares bright and burns the frost away.' }[h];
      fx('blk', 'me', `⛨${me.st.block}`);
      break; }
    case 'roar': alive(B).forEach(f => f.st.fear = 2); S.wild = clamp(S.wild + 1, 0, 100); B.log = 'You roar. The mountain answers. They falter.'; anim('roar'); break;
    case 'devour': {
      t.hp = 0; S.hp = Math.min(S.maxHp, S.hp + 10); S.wild = clamp(S.wild + 3, 0, 100);
      if(t.tags.includes('human')){ S.dread = clamp(S.dread + 4, 0, 100); S.hope = clamp(S.hope - 2, 0, 100); }
      fx('heal', 'me', '+10'); B.log = `You finish ${t.name} the old way.`; break; }
    case 'flee': B.busy = false; return endBattle(B, 'fled');
    case 'offer': S.flags.vexarFreed = true; B.log = 'You breathe on the chains. Not on him. On the chains.'; anim('breath', t); render(); await sleep(900); return endBattle(B, 'win');
  }
  render();
  await sleep(420);
  if(!alive(B).length) return endBattle(B, 'win');
  if(B.breakAt && B.foes.some(f => f.hp > 0 && f.hp <= f.max * B.breakAt)) return endBattle(B, 'win');
  if(B.tgt >= 0 && B.foes[B.tgt].hp <= 0){ B.tgt = B.foes.findIndex(f => f.hp > 0); }
  return enemyPhase(B);
}

async function enemyPhase(B){
  B.busy = true;
  const me = B.me;
  for(const f of alive(B)){
    if(f.st.stun){ f.st.stun = 0; f.st.stunImmune = 1; B.log = `${f.name} is stunned and does nothing.`; render(); await sleep(380); continue; }
    delete f.st.block;
    const m = MOVES[f.intent];
    const strike = (base) => {
      if(f.st.blind && rnd() < .5){ B.log = `${f.name} ${m.t}, and misses in the dark.`; return -1; }
      if(me.st.evade){ me.st.evade = 0; B.log = `${f.name} ${m.t}, and you slip aside.`; return -1; }
      let d = foeDmg(f, base);
      if(me.st.block){ const a = Math.min(me.st.block, d); me.st.block -= a; d -= a; }
      S.hp = Math.max(0, S.hp - d);
      if(me.st.thorns){ f.hp = Math.max(0, f.hp - me.st.thorns); fx('dmg', f, `-${me.st.thorns}`); }
      fx('dmg', 'me', d ? `-${d}` : '⛨'); shake('me');
      return d;
    };
    switch(f.intent){
      case 'howl': alive(B).forEach(x => x.st.fury = (x.st.fury || 0) + 1); B.log = 'The wolves howl, and their eyes go bright.'; break;
      case 'shield': case 'rime': case 'brood': f.st.block = m.blk; B.log = `${f.name} ${m.t}.`; break;
      case 'windup': B.log = 'The Grinder raises his club high. Brace yourself.'; break;
      case 'douse': { const d = strike(m.dmg); if(d >= 0){ me.st.soak = 2; me.heat = Math.max(0, me.heat - 1); B.log = `${f.name} douses you in ice water (${d}). Your fire sputters.`; } break; }
      case 'chill': case 'coldfire': { const d = strike(m.dmg); if(d >= 0){ me.st.chill = 2; B.log = `Frost creeps over your scales (${d}). You feel slow.`; } break; }
      case 'chain': case 'net': case 'vchains': { const d = strike(m.dmg); if(d >= 0){ me.st.stun = 1; B.log = `Iron chains snap around your wings (${d}). You lose your next turn.`; } break; }
      case 'mend': { const w = alive(B).filter(x => x !== f).sort((a, b) => a.hp / a.max - b.hp / b.max)[0]; if(w){ w.hp = Math.min(w.max, w.hp + 10); fx('heal', w, '+10'); B.log = `${f.name} mends ${w.name}.`; } break; }
      case 'grab': { const d = strike(m.dmg); if(d >= 0){ f.hp = Math.min(f.max, f.hp + m.heal); B.log = `The Grinder grabs and chews (${d}). He looks pleased.`; } break; }
      default: { const d = strike(m.dmg); if(d >= 0) B.log = `${f.name} ${m.t}: ${d} damage.`; }
    }
    if(f.st.blind) f.st.blind--;
    render(); await sleep(480);
    if(S.hp <= 0) return endBattle(B, 'lose');
  }
  // end of round
  B.foes.forEach(f => {
    if(f.hp <= 0) return;
    if(f.st.burn){ f.hp = Math.max(0, f.hp - f.st.burn); fx('dmg', f, `-${f.st.burn}🔥`); f.st.burn = Math.max(0, f.st.burn - 1) || undefined; }
    if(f.st.poison){ f.hp = Math.max(0, f.hp - f.st.poison); fx('dmg', f, `-${f.st.poison}☠`); f.st.poison = Math.max(0, f.st.poison - 1) || undefined; }
    if(f.st.fear){ f.st.fear--; if(!f.st.fear) delete f.st.fear; }
    if(f.st.stunImmune && !f.st.stun){ f.st.stunImmune--; if(!f.st.stunImmune) delete f.st.stunImmune; }
  });
  ['chill','soak'].forEach(k => { if(me.st[k]){ me.st[k]--; if(!me.st[k]) delete me.st[k]; } });
  delete me.st.thorns;
  const regen = 2 - (me.st.chill ? 1 : 0) + (me.st.heatNext || 0); delete me.st.heatNext;
  me.heat = Math.min(10, me.heat + regen);
  me.st.block = 0;
  B.turn++;
  if(!alive(B).length) return endBattle(B, 'win');
  if(B.dawn){
    B.dawn--;
    if(B.dawn <= 0){ S.flags.dawned = true; B.log = 'The sun comes up over the mountains.'; render(); await sleep(700); return endBattle(B, 'win'); }
  }
  pickIntents(B);
  if(B.tgt < 0 || B.foes[B.tgt].hp <= 0) B.tgt = B.foes.findIndex(f => f.hp > 0);
  B.busy = false;
  render();
}

function endBattle(B, result){
  const rewards = [];
  if(result === 'win'){
    const silver = B.foes.reduce((a, f) => a + (ENEMIES[f.key].silver || 0), 0);
    if(silver){ S.gold += silver; rewards.push({ t:`Hoard +${silver} (Quench silver)`, c:'gold' }); }
    if(B.enc === 'wolves' || B.enc === 'pack') S.hunted = S.season;
  }
  if(result === 'lose') S.hp = Math.max(1, Math.round(S.maxHp * .15));
  S.battle = null;
  const next = result === 'win' ? B.win : result === 'fled' ? null : (B.lose || 'defeat');
  if(!next){ goMap(); return; }
  S.pendingFx = rewards;
  openScene(next);
}

let frostTex = null, shownR = null;
function drawFrost(){
  const box = document.getElementById('mapbox'), cv = document.getElementById('frost'); if(!box || !cv) return;
  const W = box.clientWidth, H = box.clientHeight, dpr = Math.min(2, devicePixelRatio || 1);
  cv.width = W * dpr; cv.height = H * dpr;
  const x = cv.getContext('2d'); x.setTransform(dpr, 0, 0, dpr, 0, 0);
  if(!frostTex){
    frostTex = document.createElement('canvas'); frostTex.width = 256; frostTex.height = 256;
    const t = frostTex.getContext('2d');
    t.fillStyle = 'rgba(40,70,96,.46)'; t.fillRect(0, 0, 256, 256);
    for(let i = 0; i < 900; i++){ t.fillStyle = `rgba(225,242,255,${Math.random() * .4})`; const r = Math.random() * 1.6; t.beginPath(); t.arc(Math.random() * 256, Math.random() * 256, r, 0, 7); t.fill(); }
    t.strokeStyle = 'rgba(240,250,255,.18)'; t.lineWidth = .7;
    for(let i = 0; i < 40; i++){ const cx = Math.random() * 256, cy = Math.random() * 256; for(let k = 0; k < 6; k++){ const a = k * Math.PI / 3; t.beginPath(); t.moveTo(cx, cy); t.lineTo(cx + Math.cos(a) * 6, cy + Math.sin(a) * 6); t.stroke(); } }
  }
  const target = radius();
  if(shownR === null) shownR = target;
  const paint = (r) => {
    x.globalCompositeOperation = 'source-over'; x.clearRect(0, 0, W, H);
    x.fillStyle = x.createPattern(frostTex, 'repeat'); x.fillRect(0, 0, W, H);
    x.globalCompositeOperation = 'destination-out';
    const hole = (px, py, rr) => { const g = x.createRadialGradient(px, py, rr * .55, px, py, rr); g.addColorStop(0, 'rgba(0,0,0,1)'); g.addColorStop(1, 'rgba(0,0,0,0)'); x.fillStyle = g; x.beginPath(); x.arc(px, py, rr, 0, 7); x.fill(); };
    hole(LAIR.x / 100 * W, LAIR.y / 100 * H, r / 100 * W * 1.12);
    VILLAGES.forEach(v => { if(S.places[v] === 'kindled' || S.places[v] === 'saved') hole(PLACES[v].x / 100 * W, PLACES[v].y / 100 * H, 9 / 100 * W); });
    hole(PLACES.warren.x / 100 * W, PLACES.warren.y / 100 * H, 6 / 100 * W);
    x.globalCompositeOperation = 'source-over';
    const g = x.createRadialGradient(LAIR.x / 100 * W, LAIR.y / 100 * H, 0, LAIR.x / 100 * W, LAIR.y / 100 * H, r / 100 * W);
    g.addColorStop(0, 'rgba(228,104,47,.30)'); g.addColorStop(1, 'rgba(228,104,47,0)'); x.fillStyle = g; x.fillRect(0, 0, W, H);
  };
  if(Math.abs(shownR - target) < .3 || matchMedia('(prefers-reduced-motion: reduce)').matches){ shownR = target; paint(target); return; }
  const from = shownR, t0 = performance.now();
  const step = (now) => { const k = Math.min(1, (now - t0) / 1400), e = 1 - Math.pow(1 - k, 3); shownR = from + (target - from) * e; paint(shownR); if(k < 1 && document.getElementById('frost') === cv) requestAnimationFrame(step); };
  requestAnimationFrame(step);
}

function vLair(){
  const restHeal = S.upgrades.pool ? S.maxHp - S.hp : Math.min(S.maxHp - S.hp, Math.round(S.maxHp * .5));
  return `<div class="lair fade-in">
    ${plate('A3', null, 'Your lair')}
    <div class="hoardbox"><div class="big g"><div class="label">Hoard</div><div class="n">◆ ${S.gold}</div></div><div class="big w"><div class="label">Warmth range</div><div class="n">☀ ${glowLevel()}</div></div></div>
    <p class="muted small" style="margin:0">Every 12 gold in your hoard pushes your warmth one step further (up to 16). Upgrades cost gold, but their warmth is permanent.</p>
    ${UPGRADES.map(u => {
      const lvl = S.upgrades[u.id], maxed = lvl >= u.max, cost = u.cost[lvl], ok = !maxed && S.gold >= cost && (!u.req || u.req(S));
      return `<div class="upg"><h4>${u.name} ${u.max > 1 ? `<span class="lvl">${lvl}/${u.max}</span>` : ''}</h4><p>${esc(u.d(lvl))}${u.req && !u.req(S) ? `<br><i>${u.reqText}</i>` : ''}</p><button class="buy" data-a="buy" data-v="${u.id}" ${ok ? '' : 'disabled'}>${maxed ? 'Built' : `◆ ${cost}`}</button></div>`;
    }).join('')}
    <button class="btn frost" data-a="rest" ${S.flights > 0 && S.hp < S.maxHp ? '' : 'disabled'}>Sleep on your hoard · ${restHeal > 0 ? `+${restHeal} health · ` : ''}1 flight</button>
    <button class="btn" data-a="map">Back to the map</button>
  </div>`;
}

function vBattle(){
  const B = S.battle; const me = B.me;
  const foes = B.foes.map((f, i) => {
    const iv = f.hp > 0 ? intentView(f) : null;
    const chips = Object.entries(f.st).filter(([k, v]) => v && k !== 'stunImmune').map(([k, v]) => `<span class="chip ${k}">${{ burn:'🔥', poison:'☠', blind:'◌', fear:'✖', stun:'✷', block:'⛨', fury:'▲' }[k] || ''}${v}</span>`).join('');
    return `<div class="foe ${i === B.tgt ? 'tgt' : ''} ${f.hp <= 0 ? 'dead' : ''}" id="foe-${i}" data-a="tgt" data-i="${i}">
      ${iv ? `<span class="intent ${iv.c}">${iv.t}</span>` : ''}
      <div class="fig"><img src="${ART.bg(f.art)}" alt="" onerror="this.nextElementSibling.style.display='block';this.remove()"><div style="display:none;width:100%;height:100%">${silFor(f.sil)}</div></div>
      <span class="fname">${esc(f.name)} · ${f.hp}/${f.max}</span>
      <span class="fhp"><i style="width:${f.hp / f.max * 100}%"></i></span>
      <span class="chips">${chips}</span>
    </div>`;
  }).join('');
  const mchips = Object.entries(me.st).filter(([k, v]) => v).map(([k, v]) => `<span class="chip ${k}">${{ block:'⛨ ', chill:'❄ Chilled ', soak:'💧 Soaked ', stun:'⛓ Chained', evade:'≋ Dodge', thorns:'✶ Thorns ', heatNext:'+heat ' }[k] || k}${k === 'stun' || k === 'evade' ? '' : v}</span>`).join('');
  const acts = actions(B);
  return `<div class="battle">
    <div class="arena" id="arena"><div style="position:absolute;inset:0;background:${BG_FALLBACK[B.bg]}"></div><img class="bgimg" src="${ART.bg(B.bg)}" alt="" onerror="this.remove()">
      ${B.dawn ? `<div class="dawn">☀ Dawn in ${B.dawn} turn${B.dawn > 1 ? 's' : ''}</div>` : ''}
      <div class="me" id="me"><img src="${ART.dragon(S.look)}" alt=""></div>
      <div class="foes n${B.foes.length}">${foes}</div>
    </div>
    <div class="mestat"><div class="row1"><span class="hpbar"><i style="width:${S.hp / S.maxHp * 100}%"></i></span><span class="stat"><b>${S.hp}</b>/${S.maxHp}</span></div>
      <div class="row1"><span class="label">Heat</span><span class="heat">${Array.from({ length:10 }, (_, i) => `<i class="${i < me.heat ? 'on' : ''}"></i>`).join('')}</span><span class="chips" style="justify-content:flex-start">${mchips}</span></div></div>
    <div class="blog">${esc(B.log)}</div>
    ${me.st.stun ? `<button class="btn frost" data-a="act" data-v="struggle" ${B.busy ? 'disabled' : ''}>Struggle against the chains</button>` :
    `<div class="acts">${acts.map(a => `<button class="act ${a.cls || ''}" data-a="act" data-v="${a.id}" ${B.busy || me.heat < a.cost ? 'disabled' : ''}><span class="an">${esc(a.name)}</span><span class="ad">${esc(a.d)}</span>${a.cost ? `<span class="cost">🔥${a.cost}</span>` : ''}</button>`).join('')}</div>`}
    ${B.foes.length > 1 ? '<p class="hint">Tap an enemy to target it.</p>' : ''}
  </div>`;
}

function vReport(){
  const r = S.report;
  return `<div class="summary fade-in">
    <div class="label">${esc(r.from)} ends</div>
    <h2>${r.villages.length ? 'The frost returns' : 'The season turns'}</h2>
    ${r.villages.length ? `<div class="lines">${r.villages.map(v => `<div class="line ${v.ok ? 'good' : 'bad'}"><span>${PLACES[v.v].name}</span><b>${v.ok ? 'Survives the winter' : 'Lost to the frost'}</b></div>`).join('')}</div>` : ''}
    <div class="lines">${r.lines.map(l => `<div class="line ${l.good ? 'good' : 'bad'}"><span>${esc(l.t)}</span><b>${esc(l.v)}</b></div>`).join('') || '<div class="line"><span>A quiet season.</span><b></b></div>'}</div>
    <button class="btn primary" data-a="nextseason">${SEASONS[S.season] ? SEASONS[S.season].name : 'Continue'}</button>
  </div>`;
}

function vEnd(){
  const ch2 = (S.chapter || 1) >= 2;
  const saved = VILLAGES.filter(v => S.places[v] === 'saved' || S.places[v] === 'kindled');
  const got = ACH.filter(a => META.ach[a.id]);
  const line = (k, v, good) => `<div class="line ${good ? 'good' : ''}"><span>${k}</span><b>${v}</b></div>`;
  const lines = ch2 ? [
    line('Vexar', { freed:'Freed, your brother', fled:'Fled north, still chained' }[S.flags.vexar] || 'Unknown', S.flags.vexar === 'freed'),
    line('Ysolde Marr', { spared:'Spared', exiled:'Exiled north', burned:'Burned with her tower' }[S.flags.ysolde] || 'Unknown'),
    line('Lord Harrow', { pact:'Took his gold', burned:'Burned his ice', warned:'Warned him' }[S.flags.harrow] || 'Never met'),
    line('Villages warm', `${saved.length}/3`, saved.length === 3),
    line('Hoard', `◆ ${S.gold}`),
    line('Hope · Dread · Wildness', `${S.hope} · ${S.dread} · ${S.wild}`),
  ] : [
    line('Villages saved', `${saved.length}/3 ${saved.length ? '· ' + saved.map(v => PLACES[v].name).join(', ') : ''}`, saved.length === 3),
    line('Hoard', `◆ ${S.gold}`),
    line('Hope · Dread · Wildness', `${S.hope} · ${S.dread} · ${S.wild}`),
    line('The Grinder', S.flags.dawned ? 'Turned to stone' : S.done.grinder ? 'Defeated' : 'Survived'),
    line('Aurelia', { free:'Walked free', held:'Your guest' }[S.flags.aurelia] || 'Never met'),
  ];
  return `<div class="summary fade-in">
    ${plate('A7', ch2 && S.flags.vexar === 'freed' ? 'V5' : null, ch2 ? 'End of chapter two' : 'End of chapter one')}
    <div class="label">The Last Warmth · Chapter ${ch2 ? 'two' : 'one'}</div>
    <h2>${esc(S.name)}, ${ch2 ? 'who silenced the bell' : STAGES[S.stage].toLowerCase() + ' of the Spring'}</h2>
    <div class="lines">${lines.join('')}</div>
    <div class="label">Feats unlocked · ${got.length}/${ACH.length}</div>
    <div class="stack">${got.map(a => `<div class="ach"><b>${a.t}</b><span class="muted small">${a.d}</span></div>`).join('')}</div>
    ${ch2 ? `<p class="muted">The next campaign, <i>The Gilded Debt</i>, takes you south to Veyrmark and the Ledger that paid for the Quench. It is being written.</p>
      <button class="btn primary" data-a="new">Start a new saga</button>`
    : `<p class="muted">Your choices carry over: the villages you saved, the goblins, Aurelia, Mirelle and the scale.</p>
      <button class="btn primary" data-a="ch2">Continue to chapter two</button>
      <button class="btn" data-a="new">Play chapter one again</button>`}
    <button class="btn ghost" data-a="title">Title screen</button>
  </div>`;
}

/* ── render & effects ── */
const UI = { feats:false, nameDraft:'', confirmEnd:false };
function render(){
  const v = { title:vTitle, create:vCreate, scene:vScene, out:vOut, map:vMap, lair:vLair, battle:vBattle, report:vReport, end:vEnd }[S.screen] || vTitle;
  const showBar = !['title','create','end'].includes(S.screen);
  $app().innerHTML = (showBar ? topbar() : '') + v();
  if(S.screen === 'map') drawFrost();
  if(S.screen !== 'title') save();
  flushToasts();
}
function flushToasts(){
  if(!pendingAch.length || document.querySelector('.toast')) return;
  const a = pendingAch.shift();
  const el = document.createElement('div'); el.className = 'toast'; el.textContent = `Feat unlocked · ${a.t}`;
  document.body.appendChild(el); setTimeout(() => { el.remove(); flushToasts(); }, 2600);
}
function toastText(t){ const el = document.createElement('div'); el.className = 'toast'; el.style.color = 'var(--parch)'; el.textContent = t; document.body.appendChild(el); setTimeout(() => el.remove(), 2400); }
function fx(type, target, text){
  const el = target === 'me' ? document.getElementById('me') : document.getElementById('foe-' + target.i); if(!el) return;
  const r = el.getBoundingClientRect(); const f = document.createElement('div');
  f.className = 'float ' + type; f.textContent = text;
  f.style.left = (r.left + r.width / 2 + (Math.random() * 30 - 15)) + 'px'; f.style.top = (r.top + r.height * .3 + scrollY) + 'px'; f.style.position = 'absolute';
  document.body.appendChild(f); setTimeout(() => f.remove(), 950);
}
function anim(kind, target){
  const arena = document.getElementById('arena'); if(!arena) return;
  const col = { fire:'rgba(255,140,50,.85)', shadow:'rgba(120,70,180,.85)', gold:'rgba(255,210,90,.85)', fluid:'rgba(200,235,255,.85)' }[S.look.element];
  const b = document.createElement('div'); b.className = 'burst';
  let x = '72%', y = '50%';
  if(target){ const el = document.getElementById('foe-' + target.i); if(el){ const ar = arena.getBoundingClientRect(), r = el.getBoundingClientRect(); x = (r.left - ar.left + r.width / 2) + 'px'; y = (r.top - ar.top + r.height / 2) + 'px'; } }
  if(kind === 'roar'){ x = '30%'; y = '62%'; }
  b.style.left = x; b.style.top = y;
  b.style.background = kind === 'claw' ? 'radial-gradient(circle,rgba(255,255,255,.7),transparent 60%)' : kind === 'roar' ? 'radial-gradient(circle,transparent 40%,rgba(255,220,160,.5) 50%,transparent 70%)' : `radial-gradient(circle,${col},transparent 65%)`;
  if(kind === 'breath' && !target){ b.style.width = '300px'; b.style.height = '300px'; }
  setTimeout(() => { const a = document.getElementById('arena'); if(a){ a.appendChild(b); setTimeout(() => b.remove(), 520); } }, 0);
}
function shake(who){ setTimeout(() => { const el = document.getElementById(who === 'me' ? 'me' : 'foe-' + who.i); if(el){ el.classList.remove('shake'); void el.offsetWidth; el.classList.add('shake'); } }, 0); }

/* ── flow ── */
function openScene(id){ S.scene = id; S.out = null; S.screen = 'scene'; render(); scrollTo(0, 0); }
function navigate(go){
  if(!go || go === 'map') return goMap();
  if(go === 'create'){ S.screen = 'create'; render(); return scrollTo(0, 0); }
  if(go === 'end'){ if(!S.chapterDone){ S.chapterDone = true; META.runs++; saveMeta(); } S.screen = 'end'; render(); return scrollTo(0, 0); }
  if(go === 'lair'){ S.screen = 'lair'; return render(); }
  if(SCENES[go]) return openScene(go);
  goMap();
}
function choose(i){
  const sc = SCENES[S.scene], c = sc.choices[i]; if(!c || (c.req && !c.req(S))) return;
  if(c.fight){ startBattle(c.fight.enc, c.fight.win, c.fight.lose); render(); return scrollTo(0, 0); }
  if(c.refund) S.flights = Math.min(SEASONS[S.season].flights, S.flights + 1);
  const shown = applyFx(c.fx);
  if(c.out){ S.out = { text:c.out, fx:shown, go:c.go }; S.screen = 'out'; render(); return scrollTo(0, 0); }
  if(shown.length && (!c.go || c.go === 'map')) setTimeout(() => toastText(shown.map(x => x.t).join(' · ')), 50);
  else if(shown.length) S.pendingFx = shown;
  navigate(c.go);
}
function goMap(){
  if((S.chapter || 1) >= 2){
    if(S.season === 1 && !S.done.siege && S.flights <= 2){ S.done.siege = true; S.flights = Math.max(0, S.flights - 1); return openScene('siege'); }
  } else if(S.season === 2 && !S.done.raid && S.flights <= 2){ S.done.raid = true; S.flights = Math.max(0, S.flights - 1); return openScene('raid'); }
  if(S.flights <= 0) return turnSeason();
  S.screen = 'map'; UI.confirmEnd = false; render();
}
function turnSeason(){
  if((S.chapter || 1) >= 2 && S.season >= 2) return openScene(S.done.hold ? 'ch2end' : 'holdApproach');
  if(S.season >= 3) return openScene(S.done.grinder ? 'ending' : 'grinderAttack');
  S.report = endSeason(); S.screen = 'report'; render(); scrollTo(0, 0);
}
function fly(id){
  const ev = eventAt(id); if(!ev || S.flights <= 0) return;
  S.flights--; openScene(ev.scene);
}

document.addEventListener('click', (e) => {
  const el = e.target.closest('[data-a]'); if(!el || el.disabled) return;
  const a = el.dataset.a, v = el.dataset.v;
  if(a !== 'endseason') UI.confirmEnd = false;
  switch(a){
    case 'ch2': startChapter2(); scrollTo(0, 0); break;
    case 'new': S = freshState(); UI.nameDraft = ''; S.screen = 'scene'; openScene('egg'); break;
    case 'continue': { const l = load(); if(l){ S = l; if(S.screen === 'battle' && !S.battle) S.screen = 'map'; if(S.battle) S.battle.busy = false; render(); } break; }
    case 'title': S.screen = 'title'; render(); break;
    case 'feats': UI.feats = !UI.feats; render(); break;
    case 'look': {
      S.look[el.dataset.k] = v; UI.nameDraft = (document.getElementById('name-in') || {}).value || UI.nameDraft; render();
      const order = ['color','horns','hide','tail','element','name'], nx = order[order.indexOf(el.dataset.k) + 1];
      const g = nx && document.querySelector(`[data-g="${nx}"]`);
      if(g) setTimeout(() => g.scrollIntoView({ behavior: matchMedia('(prefers-reduced-motion: reduce)').matches ? 'auto' : 'smooth', block:'start' }), 60);
      break; }
    case 'preset': { const i = document.getElementById('name-in'); if(i){ i.value = v; UI.nameDraft = v; } break; }
    case 'hatch': { const n = ((document.getElementById('name-in') || {}).value || '').trim() || NAME_PRESETS[Math.floor(Math.random() * NAME_PRESETS.length)]; S.name = n.slice(0, 20); S.hp = S.maxHp = STAGE_HP[0]; openScene('firstWarmth'); break; }
    case 'choose': choose(+el.dataset.i); break;
    case 'outnext': navigate(S.out && S.out.go); break;
    case 'sel': S.sel = v; render(); break;
    case 'fly': fly(v); break;
    case 'lair': S.screen = 'lair'; render(); scrollTo(0, 0); break;
    case 'map': goMap(); break;
    case 'buy': { const u = UPGRADES.find(x => x.id === v), l = S.upgrades[v], c = u.cost[l]; if(l < u.max && S.gold >= c && (!u.req || u.req(S))){ S.gold -= c; S.upgrades[v]++; if(v === 'pool'){ S.maxHp += 15; S.hp += 15; } toastText(`${u.name} built`); render(); } break; }
    case 'rest': if(S.flights > 0){ S.flights--; S.hp = S.upgrades.pool ? S.maxHp : Math.min(S.maxHp, S.hp + Math.round(S.maxHp * .5)); toastText('You sleep on your hoard.'); if(S.flights <= 0) goMap(); else render(); } break;
    case 'endseason': if(!UI.confirmEnd){ UI.confirmEnd = true; render(); } else { UI.confirmEnd = false; S.flights = 0; goMap(); } break;
    case 'nextseason': S.report = null; openScene(((S.chapter || 1) >= 2 ? SEASON_OPEN_2 : { 1:'summer', 2:'ashfall', 3:'winter' })[S.season] || 'ending'); break;
    case 'tgt': if(S.battle && !S.battle.busy){ S.battle.tgt = +el.dataset.i; render(); } break;
    case 'act': if(v === 'struggle') playerAct('struggle'); else playerAct(v); break;
  }
});
document.addEventListener('input', (e) => { if(e.target.id === 'name-in') UI.nameDraft = e.target.value; });
addEventListener('resize', () => { if(S.screen === 'map') drawFrost(); });

/* boot */
(function boot(){ const l = load(); if(l && l.name){ S = l; S.screen = 'title'; } render(); })();
</script></body></html>
