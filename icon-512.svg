<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <radialGradient id="bg" cx="50%" cy="38%" r="75%">
      <stop offset="0%" stop-color="#211a29"/>
      <stop offset="100%" stop-color="#0c0a10"/>
    </radialGradient>
    <linearGradient id="ember" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e4682f"/>
      <stop offset="100%" stop-color="#c1481f"/>
    </linearGradient>
    <radialGradient id="pupil" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#0c0a10"/>
      <stop offset="100%" stop-color="#1a1219"/>
    </radialGradient>
  </defs>

  <rect width="512" height="512" fill="url(#bg)"/>

  <!-- outer scale ring -->
  <circle cx="256" cy="256" r="196" fill="none" stroke="#3a2a30" stroke-width="6"/>

  <!-- draconic eye shape -->
  <path d="M 96 256 Q 256 156 416 256 Q 256 356 96 256 Z" fill="url(#ember)"/>

  <!-- vertical slit pupil -->
  <ellipse cx="256" cy="256" rx="26" ry="92" fill="url(#pupil)"/>

  <!-- gold rim highlight -->
  <path d="M 96 256 Q 256 156 416 256" fill="none" stroke="#c9a227" stroke-width="5" stroke-linecap="round" opacity="0.8"/>

  <!-- small ember flecks -->
  <circle cx="150" cy="196" r="5" fill="#c9a227" opacity="0.7"/>
  <circle cx="362" cy="200" r="4" fill="#e4682f" opacity="0.6"/>
  <circle cx="256" cy="120" r="3.5" fill="#c9a227" opacity="0.5"/>
</svg>
